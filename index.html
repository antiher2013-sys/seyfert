<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Seyfert</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08090d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 30px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 42px;
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #191b24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .hello {
      color: #9295a3;
      font-size: 15px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #9295a3;
      font-size: 16px;
      line-height: 1.5;
      margin: 14px 0 30px;
    }

    .cards {
      display: grid;
      gap: 14px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 0;
      border-radius: 24px;
      padding: 24px;
      min-height: 145px;
      color: white;
      text-align: left;
      cursor: pointer;
    }

    .card-dating {
      background: linear-gradient(135deg, #6d4cff, #a84dff);
    }

    .card-gaming {
      background: linear-gradient(135deg, #1769ff, #20b8d8);
    }

    .card-icon {
      font-size: 30px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 21px;
      font-weight: 750;
      margin-bottom: 6px;
    }

    .card-text {
      font-size: 14px;
      opacity: 0.82;
    }

    .arrow {
      position: absolute;
      right: 22px;
      bottom: 20px;
      font-size: 22px;
    }

    .section {
      margin-top: 30px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .activity {
      background: #12141b;
      border-radius: 20px;
      padding: 18px;
      color: #a5a8b5;
      font-size: 14px;
      line-height: 1.45;
    }

    .bottom {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      color: #555865;
      font-size: 12px;
    }

    button {
      font: inherit;
    }

    button:active {
      transform: scale(0.985);
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="top">
      <div class="brand">Seyfert</div>
      <div class="profile">👤</div>
    </header>

    <div class="hello">Добро пожаловать</div>

    <h1>Найди своих людей.</h1>

    <p class="subtitle">
      Знакомься, общайся и находи тиммейтов в одном пространстве.
    </p>

    <section class="cards">

      <button class="card card-dating">
        <div class="card-icon">💜</div>
        <div class="card-title">Знакомства</div>
        <div class="card-text">
          Находи людей, которые тебе интересны.
        </div>
        <div class="arrow">→</div>
      </button>

      <button class="card card-gaming">
        <div class="card-icon">🎮</div>
        <div class="card-title">Игроки</div>
        <div class="card-text">
          Ищи тиммейтов и собирай свою команду.
        </div>
        <div class="arrow">→</div>
      </button>

    </section>

    <section class="section">

      <div class="section-title">Активности</div>

      <div class="activity">
        Здесь будут появляться события, игровые активности
        и интересные предложения сообщества.
      </div>

    </section>

    <div class="bottom">
      Seyfert • 0.3
    </div>

  </main>
  
</body>
</html>
