<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seyfert — Recommendation Test</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080711;
  --card:#151320;
  --card2:#1d182b;
  --text:#f7f5fb;
  --muted:#9e98ae;
  --purple:#8b5cf6;
  --pink:#d946ef;
  --green:#69e6a7;
  --red:#ff6683;
  --line:rgba(255,255,255,.1);
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(139,92,246,.25),
      transparent 42%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body{
  padding:18px 14px 30px;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
}

/* ================= HEADER ================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:var(--purple);
}

.version{
  padding:6px 10px;
  border-radius:999px;
  color:#c8b9ee;
  background:rgba(139,92,246,.1);
  border:1px solid rgba(139,92,246,.2);
  font-size:10px;
  font-weight:800;
}

/* ================= USER ================= */

.user-card{
  padding:18px;
  border-radius:22px;
  background:
    linear-gradient(
      145deg,
      rgba(139,92,246,.13),
      rgba(255,255,255,.025)
    );
  border:1px solid var(--line);
  margin-bottom:14px;
}

.section-label{
  color:#817b8f;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.user-name{
  margin-top:7px;
  font-size:25px;
  font-weight:900;
}

.user-meta{
  margin-top:4px;
  color:#bcb5c9;
  font-size:13px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.chip{
  padding:7px 9px;
  border-radius:10px;
  color:#d4c5fa;
  background:rgba(139,92,246,.12);
  border:1px solid rgba(139,92,246,.2);
  font-size:10px;
  font-weight:700;
}

.game-chip{
  color:#f2c7ff;
  background:rgba(217,70,239,.1);
  border-color:rgba(217,70,239,.2);
}

/* ================= FILTER ================= */

.panel{
  padding:17px;
  border-radius:22px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  margin-bottom:14px;
}

.panel-title{
  font-size:17px;
  font-weight:900;
}

.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.field label{
  display:block;
  margin-bottom:6px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
}

select{
  width:100%;
  padding:12px;
  color:white;
  background:#191526;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
}

.primary{
  width:100%;
  margin-top:12px;
  padding:13px;
  border-radius:14px;
  color:white;
  background:linear-gradient(
    100deg,
    var(--purple),
    var(--pink)
  );
  font-weight:800;
}

/* ================= RESULT ================= */

.result-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 2px 10px;
}

.result-title{
  font-size:18px;
  font-weight:900;
}

.result-count{
  color:var(--muted);
  font-size:11px;
}

/* ================= PROFILE ================= */

.profile{
  padding:16px;
  margin-bottom:10px;
  border-radius:20px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.025)
    );
  border:1px solid var(--line);
  transition:
    transform .18s ease,
    border-color .18s ease;
}

.profile:hover{
  transform:translateY(-2px);
  border-color:rgba(139,92,246,.35);
}

.profile-main{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.profile-left{
  min-width:0;
}

.profile-name{
  font-size:20px;
  font-weight:900;
}

.profile-meta{
  margin-top:4px;
  color:#aaa3b4;
  font-size:11px;
}

.online{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:8px;
  color:#bcb6c6;
  font-size:10px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
}

.dot.offline{
  opacity:.3;
}

.score{
  min-width:67px;
  height:67px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:rgba(139,92,246,.11);
  border:1px solid rgba(139,92,246,.2);
}

.score-value{
  color:#d6c5ff;
  font-size:20px;
  font-weight:900;
}

.score-label{
  margin-top:1px;
  color:#80798d;
  font-size:8px;
  text-transform:uppercase;
}

.breakdown{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-top:13px;
}

.metric{
  min-width:0;
  padding:8px 5px;
  border-radius:10px;
  text-align:center;
  background:rgba(0,0,0,.16);
}

.metric-value{
  font-size:11px;
  font-weight:900;
}

.metric-label{
  margin-top:3px;
  color:#716b7c;
  font-size:7px;
  line-height:1.1;
}

.matches{
  margin-top:11px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.match{
  padding:5px 7px;
  border-radius:8px;
  color:#d2c2f7;
  background:rgba(139,92,246,.1);
  font-size:9px;
  font-weight:700;
}

/* ================= EMPTY ================= */

.empty{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:20px;
}

.empty strong{
  display:block;
  margin-bottom:6px;
  color:white;
}

/* ================= LOG ================= */

.log{
  margin-top:15px;
  padding:15px;
  border-radius:18px;
  background:#0e0d16;
  border:1px solid var(--line);
}

.log-title{
  margin-bottom:8px;
  color:#8b8494;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
}

.log-line{
  padding:5px 0;
  color:#aaa3b2;
  font-size:10px;
  border-bottom:1px solid rgba(255,255,255,.04);
}

.log-line:last-child{
  border-bottom:0;
}

.highlight{
  color:#d1bfff;
  font-weight:800;
}

@media(max-width:420px){

  .filter-grid{
    grid-template-columns:1fr;
  }

  .breakdown{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="logo">
      SEY<span>F</span>ERT
    </div>

    <div class="version">
      Recommendation Test
    </div>

  </header>


  <!-- ================= USER ================= -->

  <section class="user-card">

    <div class="section-label">
      Тестовый пользователь
    </div>

    <div class="user-name">
      Дима, 21
    </div>

    <div class="user-meta">
      📍 Москва
    </div>

    <div class="chips">

      <div class="chip">
        🍳 Готовка
      </div>

      <div class="chip">
        🖥️ ПК игры
      </div>

      <div class="chip">
        🐈 Кошки
      </div>

      <div class="chip game-chip">
        🎮 Dota 2
      </div>

      <div class="chip game-chip">
        🎮 CS 2
      </div>

    </div>

  </section>


  <!-- ================= FILTER ================= -->

  <section class="panel">

    <div class="panel-title">
      Фильтры
    </div>

    <div class="filter-grid">

      <div class="field">

        <label>
          Возраст
        </label>

        <select id="ageFilter">

          <option value="all">
            Любой возраст
          </option>

          <option value="18-21">
            18–21
          </option>

          <option value="22-25">
            22–25
          </option>

          <option value="26-30">
            26–30
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Пол
        </label>

        <select id="genderFilter">

          <option value="all">
            Все
          </option>

          <option value="female">
            Девушки
          </option>

          <option value="male">
            Парни
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Город
        </label>

        <select id="cityFilter">

          <option value="all">
            Любой
          </option>

          <option value="Москва">
            Москва
          </option>

          <option value="Санкт-Петербург">
            Санкт-Петербург
          </option>

          <option value="Казань">
            Казань
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Интерес
        </label>

        <select id="interestFilter">

          <option value="all">
            Любой
          </option>

          <option value="Готовка">
            Готовка
          </option>

          <option value="ПК игры">
            ПК игры
          </option>

          <option value="Кошки">
            Кошки
          </option>

          <option value="Музыка">
            Музыка
          </option>

          <option value="Спорт">
            Спорт
          </option>

          <option value="Кино">
            Кино
          </option>

        </select>

      </div>

    </div>


    <button
      class="primary"
      id="applyFilters">

      Применить фильтры

    </button>

  </section>


  <!-- ================= RESULTS ================= -->

  <div class="result-head">

    <div class="result-title">
      Рекомендации
    </div>

    <div
      class="result-count"
      id="resultCount">
      —
    </div>

  </div>


  <section id="results"></section>


  <!-- ================= LOG ================= -->

  <section class="log">

    <div class="log-title">
      Лог алгоритма
    </div>

    <div id="log"></div>

  </section>

</div>


<script>

/*
=========================================================
SEYFERT — RECOMMENDATION TEST
=========================================================

Формула:

40% — общие интересы + игры
20% — расстояние
15% — активность
15% — заполненность
10% — новизна

Фильтры применяются ДО расчёта рейтинга.

Максимум пользователя:
3 интереса
2 игры

=========================================================
*/


/* ======================================================
   ТЕСТОВЫЙ ПОЛЬЗОВАТЕЛЬ
====================================================== */

const me = {

  name:"Дима",

  age:21,

  gender:"male",

  city:"Москва",

  interests:[
    "Готовка",
    "ПК игры",
    "Кошки"
  ],

  games:[
    "Dota 2",
    "CS 2"
  ]

};


/* ======================================================
   ТЕСТОВЫЕ АНКЕТЫ
====================================================== */

const profiles = [

  {
    id:1,

    name:"Алина",
    age:21,
    gender:"female",
    city:"Москва",

    interests:[
      "Готовка",
      "ПК игры",
      "Кошки"
    ],

    games:[
      "Dota 2",
      "CS 2"
    ],

    distance:3,

    activity:"online",

    completeness:100,

    ageDays:1
  },


  {
    id:2,

    name:"София",
    age:22,
    gender:"female",
    city:"Москва",

    interests:[
      "Кошки",
      "Музыка",
      "Кино"
    ],

    games:[
      "Dota 2"
    ],

    distance:5,

    activity:"today",

    completeness:80,

    ageDays:2
  },


  {
    id:3,

    name:"Катя",
    age:20,
    gender:"female",
    city:"Москва",

    interests:[
      "Готовка",
      "Кошки",
      "Спорт"
    ],

    games:[
      "CS 2",
      "Minecraft"
    ],

    distance:8,

    activity:"today",

    completeness:70,

    ageDays:4
  },


  {
    id:4,

    name:"Мария",
    age:25,
    gender:"female",
    city:"Санкт-Петербург",

    interests:[
      "Музыка",
      "Кино",
      "Путешествия"
    ],

    games:[
      "Dota 2",
      "CS 2"
    ],

    distance:635,

    activity:"week",

    completeness:90,

    ageDays:10
  },


  {
    id:5,

    name:"Лера",
    age:19,
    gender:"female",
    city:"Москва",

    interests:[
      "Готовка",
      "ПК игры",
      "Музыка"
    ],

    games:[
      "Dota 2",
      "Valorant"
    ],

    distance:12,

    activity:"online",

    completeness:50,

    ageDays:1
  },


  {
    id:6,

    name:"Настя",
    age:23,
    gender:"female",
    city:"Казань",

    interests:[
      "Кошки",
      "Спорт",
      "Кино"
    ],

    games:[
      "CS 2",
      "Dota 2"
    ],

    distance:720,

    activity:"offline",

    completeness:60,

    ageDays:6
  },


  {
    id:7,

    name:"Ева",
    age:21,
    gender:"female",
    city:"Москва",

    interests:[
      "Готовка",
      "ПК игры",
      "Кошки"
    ],

    games:[
      "Minecraft",
      "Valorant"
    ],

    distance:2,

    activity:"online",

    completeness:65,

    ageDays:3
  }

];


/* ======================================================
   ФИЛЬТР
====================================================== */

function passesFilters(profile){

  const ageValue =
    document.getElementById("ageFilter").value;

  const genderValue =
    document.getElementById("genderFilter").value;

  const cityValue =
    document.getElementById("cityFilter").value;

  const interestValue =
    document.getElementById("interestFilter").value;


  /* возраст */

  if(ageValue !== "all"){

    const parts =
      ageValue
        .split("-")
        .map(Number);

    const min = parts[0];
    const max = parts[1];

    if(
      profile.age < min ||
      profile.age > max
    ){
      return false;
    }

  }


  /* пол */

  if(
    genderValue !== "all" &&
    profile.gender !== genderValue
  ){

    return false;

  }


  /* город */

  if(
    cityValue !== "all" &&
    profile.city !== cityValue
  ){

    return false;

  }


  /*
    Фильтр интереса:
    наличие хотя бы одного выбранного
    интереса ИЛИ игры.
  */

  if(interestValue !== "all"){

    const hasInterest =
      profile.interests
        .includes(interestValue);

    const hasGame =
      profile.games
        .includes(interestValue);

    if(
      !hasInterest &&
      !hasGame
    ){

      return false;

    }

  }


  return true;

}


/* ======================================================
   ИНТЕРЕСЫ
====================================================== */

function getCommonInterests(profile){

  const commonInterests =
    me.interests.filter(
      interest =>
        profile.interests
          .includes(interest)
    );


  const commonGames =
    me.games.filter(
      game =>
        profile.games
          .includes(game)
    );


  return {

    interests:commonInterests,

    games:commonGames,

    total:
      commonInterests.length +
      commonGames.length

  };

}


/* ======================================================
   40% — ИНТЕРЕСЫ
====================================================== */

function interestScore(profile){

  const matches =
    getCommonInterests(profile);

  /*
    Максимум 5 совпадений.

    1 = 8%
    2 = 16%
    3 = 24%
    4 = 32%
    5 = 40%
  */

  return Math.min(
    matches.total * 8,
    40
  );

}


/* ======================================================
   20% — РАССТОЯНИЕ
====================================================== */

function distanceScore(profile){

  const d =
    profile.distance;


  if(d <= 2)
    return 20;

  if(d <= 5)
    return 18;

  if(d <= 10)
    return 15;

  if(d <= 25)
    return 11;

  if(d <= 50)
    return 7;

  if(d <= 100)
    return 3;

  return 0;

}


/* ======================================================
   15% — АКТИВНОСТЬ
====================================================== */

function activityScore(profile){

  switch(profile.activity){

    case "online":
      return 15;

    case "today":
      return 12;

    case "twoDays":
      return 9;

    case "week":
      return 5;

    default:
      return 0;

  }

}


/* ======================================================
   15% — ЗАПОЛНЕННОСТЬ
====================================================== */

function completenessScore(profile){

  const value =
    profile.completeness;


  /*
    25% — фундамент.

    Дополнительное влияние:
    25% = 0
    40% = 3
    50% = 5
    60% = 8
    70% = 10
    80% = 12
    90% = 14
    100% = 15
  */

  if(value >= 100)
    return 15;

  if(value >= 90)
    return 14;

  if(value >= 80)
    return 12;

  if(value >= 70)
    return 10;

  if(value >= 60)
    return 8;

  if(value >= 50)
    return 5;

  if(value >= 40)
    return 3;

  return 0;

}


/* ======================================================
   10% — НОВИЗНА
====================================================== */

function freshnessScore(profile){

  const days =
    profile.ageDays;


  if(days <= 1)
    return 10;

  if(days <= 3)
    return 7;

  if(days <= 7)
    return 4;

  if(days <= 14)
    return 2;

  return 0;

}


/* ======================================================
   ИТОГОВЫЙ РЕЙТИНГ
====================================================== */

function calculateScore(profile){

  const interests =
    interestScore(profile);

  const distance =
    distanceScore(profile);

  const activity =
    activityScore(profile);

  const completeness =
    completenessScore(profile);

  const freshness =
    freshnessScore(profile);


  const total =
    interests +
    distance +
    activity +
    completeness +
    freshness;


  return {

    interests,

    distance,

    activity,

    completeness,

    freshness,

    total

  };

}


/* ======================================================
   РЕКОМЕНДАЦИИ
====================================================== */

function getRecommendations(){

  /*
    Сначала жёсткие фильтры.
  */

  const filtered =
    profiles.filter(
      passesFilters
    );


  /*
    Потом рейтинг.
  */

  const ranked =
    filtered.map(
      profile =>({

        profile,

        score:
          calculateScore(profile)

      })
    );


  /*
    Сортировка:
    самый высокий рейтинг первым.
  */

  ranked.sort(
    (a,b)=>
      b.score.total -
      a.score.total
  );


  return ranked;

}


/* ======================================================
   RENDER
====================================================== */

function render(){

  const results =
    document.getElementById("results");

  const resultCount =
    document.getElementById("resultCount");

  const log =
    document.getElementById("log");


  const recommendations =
    getRecommendations();


  resultCount.textContent =
    `${recommendations.length} анкет`;


  if(!recommendations.length){

    results.innerHTML = `

      <div class="empty">

        <strong>
          Подходящих анкет нет
        </strong>

        Попробуй изменить фильтры.

      </div>

    `;

    log.innerHTML="";

    return;

  }


  results.innerHTML =
    recommendations
      .map(
        (item,index)=>
          renderProfile(
            item,
            index
          )
      )
      .join("");


  log.innerHTML =
    recommendations
      .map(
        item=>renderLog(item)
      )
      .join("");

}


/* ======================================================
   PROFILE CARD
====================================================== */

function renderProfile(item,index){

  const p =
    item.profile;

  const s =
    item.score;

  const matches =
    getCommonInterests(p);


  const matchHTML = [

    ...matches.interests.map(
      x =>
        `<span class="match">
          ${safe(x)}
        </span>`
    ),

    ...matches.games.map(
      x =>
        `<span class="match">
          🎮 ${safe(x)}
        </span>`
    )

  ].join("");


  return `

    <article class="profile">

      <div class="profile-main">

        <div class="profile-left">

          <div class="profile-name">
            ${index+1}. ${safe(p.name)}, ${p.age}
          </div>

          <div class="profile-meta">
            📍 ${safe(p.city)}
            · ${p.distance} км
          </div>

          <div class="online">

            <span
              class="
                dot
                ${p.activity==="offline"
                  ?"offline"
                  :""
                }
              ">
            </span>

            ${activityText(p.activity)}

          </div>

        </div>


        <div class="score">

          <div class="score-value">
            ${s.total}%
          </div>

          <div class="score-label">
            рейтинг
          </div>

        </div>

      </div>


      <div class="breakdown">

        ${metric(
          s.interests,
          "интересы"
        )}

        ${metric(
          s.distance,
          "расстояние"
        )}

        ${metric(
          s.activity,
          "активность"
        )}

        ${metric(
          s.completeness,
          "заполнение"
        )}

        ${metric(
          s.freshness,
          "новизна"
        )}

      </div>


      ${
        matchHTML
        ?
        `<div class="matches">
          ${matchHTML}
        </div>`
        :
        ""
      }

    </article>

  `;

}


/* ======================================================
   METRIC
====================================================== */

function metric(value,label){

  return `

    <div class="metric">

      <div class="metric-value">
        ${value}%
      </div>

      <div class="metric-label">
        ${label}
      </div>

    </div>

  `;

}


/* ======================================================
   LOG
====================================================== */

function renderLog(item){

  const p =
    item.profile;

  const s =
    item.score;


  return `

    <div class="log-line">

      <span class="highlight">
        ${safe(p.name)}
      </span>

      →

      интересы ${s.interests}% +

      расстояние ${s.distance}% +

      активность ${s.activity}% +

      заполненность ${s.completeness}% +

      новизна ${s.freshness}%

      =

      <span class="highlight">
        ${s.total}%
      </span>

    </div>

  `;

}


/* ======================================================
   ACTIVITY TEXT
====================================================== */

function activityText(value){

  switch(value){

    case "online":
      return "Сейчас онлайн";

    case "today":
      return "Был(а) сегодня";

    case "twoDays":
      return "Был(а) недавно";

    case "week":
      return "Был(а) на этой неделе";

    default:
      return "Давно не заходил(а)";

  }

}


/* ======================================================
   FILTER BUTTON
====================================================== */

document
  .getElementById("applyFilters")
  .addEventListener(
    "click",
    render
  );


/* ======================================================
   SAFE
====================================================== */

function safe(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ======================================================
   START
====================================================== */

render();

</script>

</body>
</html>
