<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05050a">
  <title>Seyfert</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #05050a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body {
      position: relative;
    }

    /* ===== КОСМИЧЕСКИЙ ФОН ===== */

    .space {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(91, 53, 255, 0.20),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 70%,
          rgba(0, 170, 255, 0.14),
          transparent 35%
        ),
        #05050a;
    }

    .nebula {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.25;
      animation: float 14s ease-in-out infinite alternate;
    }

    .nebula.one {
      background: #6c35ff;
      top: -180px;
      left: -160px;
    }

    .nebula.two {
      background: #00bfff;
      right: -200px;
      bottom: -180px;
      animation-delay: -5s;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(120,180,255,.6) 1px, transparent 1.5px);
      background-size: 90px 90px, 140px 140px;
      background-position: 0 0, 40px 70px;
      opacity: 0.35;
      animation: starsMove 30s linear infinite;
    }

    @keyframes starsMove {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(-90px, 90px, 0);
      }
    }

    @keyframes float {
      from {
        transform: translate3d(-20px, -10px, 0) scale(1);
      }

      to {
        transform: translate3d(30px, 30px, 0) scale(1.15);
      }
    }

    /* ===== ПРИЛОЖЕНИЕ ===== */

    .app {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 32px;
    }

    /* ===== ШАПКА ===== */

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      text-shadow:
        0 0 12px rgba(130, 80, 255, 0.7),
        0 0 30px rgba(80, 120, 255, 0.35);
    }

    .profile {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(15, 17, 28, 0.7);
      border: 1px solid rgba(160, 130, 255, 0.45);

      box-shadow:
        0 0 12px rgba(130, 80, 255, 0.35),
        inset 0 0 14px rgba(130, 80, 255, 0.08);
    }

    /* ===== ТЕКСТ ===== */

    .hello {
      color: #858897;
      font-size: 14px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 1.05;
      letter-spacing: -1.5px;

      text-shadow:
        0 0 18px rgba(255,255,255,0.08);
    }

    .subtitle {
      color: #9799a8;
      font-size: 16px;
      line-height: 1.5;
      margin: 15px 0 32px;
    }

    /* ===== НЕОНОВЫЕ КАРТОЧКИ ===== */

    .cards {
      display: grid;
      gap: 18px;
    }

    .card {
      position: relative;
      width: 100%;
      min-height: 160px;

      border-radius: 26px;
      padding: 24px;

      color: white;
      text-align: left;
      border: 1px solid transparent;

      cursor: pointer;
      overflow: hidden;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(255,255,255,0.18),
          transparent 30%
        );

      pointer-events: none;
    }

    /* ФИОЛЕТОВАЯ */

    .dating {
      background:
        linear-gradient(
          135deg,
          rgba(92, 42, 255, 0.38),
          rgba(255, 45, 190, 0.18)
        );

      border-color: rgba(185, 105, 255, 0.65);

      box-shadow:
        0 0 12px rgba(155, 70, 255, 0.55),
        0 0 35px rgba(125, 50, 255, 0.20),
        inset 0 0 30px rgba(190, 80, 255, 0.08);
    }

    /* СИНЯЯ */

    .gaming {
      background:
        linear-gradient(
          135deg,
          rgba(0, 110, 255, 0.35),
          rgba(0, 220, 255, 0.15)
        );

      border-color: rgba(55, 205, 255, 0.65);

      box-shadow:
        0 0 12px rgba(0, 185, 255, 0.55),
        0 0 35px rgba(0, 150, 255, 0.20),
        inset 0 0 30px rgba(0, 200, 255, 0.08);
    }

    .card:active {
      transform: scale(0.975);
    }
        /* ===== ЖИВОЙ НЕОН ===== */

.card {
  animation: neonBreath 4s ease-in-out infinite;
}

.card::after {
  content: "";
  position: absolute;
  top: -20%;
  left: -80%;
  width: 45%;
  height: 140%;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.18),
    transparent
  );

  transform: rotate(18deg);
  animation: neonSweep 6s ease-in-out infinite;
  pointer-events: none;
}

.dating {
  animation-delay: -1s;
}

.gaming {
  animation-delay: -2.5s;
}


@keyframes neonBreath {
  0%, 100% {
    filter: brightness(1);
  }

  50% {
    filter: brightness(1.12);
  }
}

@keyframes neonSweep {
  0% {
    left: -80%;
  }

  45%, 100% {
    left: 140%;
  }
}

    .card-icon {
      font-size: 31px;
      margin-bottom: 16px;

      filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.5));
    }

    .card-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .card-text {
      font-size: 14px;
      color: rgba(255,255,255,0.68);
    }

    .arrow {
      position: absolute;
      right: 22px;
      bottom: 20px;

      font-size: 26px;
      opacity: 0.8;

      text-shadow:
        0 0 10px rgba(255,255,255,0.7);
    }

    /* ===== АКТИВНОСТИ ===== */

    .section {
      margin-top: 34px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 750;
      margin-bottom: 13px;
    }

    .activity {
      padding: 19px;
      border-radius: 20px;

      background: rgba(15, 17, 27, 0.65);
      border: 1px solid rgba(130, 135, 170, 0.18);

      color: #858897;
      font-size: 14px;
      line-height: 1.5;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.015);
    }

    /* ===== НИЗ ===== */

    .bottom {
      text-align: center;
      margin-top: 35px;

      color: #454754;
      font-size: 12px;
    }

    button {
      font: inherit;
    }
  </style>
</head>

<body>

  <div class="space">
    <div class="nebula one"></div>
    <div class="nebula two"></div>
    <div class="stars"></div>
  </div>

  <main class="app">

    <header class="top">

      <div class="brand">
        Seyfert
      </div>

      <div class="profile">
        👤
      </div>

    </header>

    <div class="hello">
      Добро пожаловать
    </div>

    <h1>
      Найди своих людей.
    </h1>

    <p class="subtitle">
      Знакомься, общайся и находи тиммейтов
      в одном пространстве.
    </p>

    <section class="cards">

      <button class="card dating">

        <div class="card-icon">
          💜
        </div>

        <div class="card-title">
          Знакомства
        </div>

        <div class="card-text">
          Находи людей, которые тебе интересны.
        </div>

        <div class="arrow">
          →
        </div>

      </button>


      <button class="card gaming">

        <div class="card-icon">
          🎮
        </div>

        <div class="card-title">
          Игроки
        </div>

        <div class="card-text">
          Ищи тиммейтов и собирай свою команду.
        </div>

        <div class="arrow">
          →
        </div>

      </button>

    </section>


    <section class="section">

      <div class="section-title">
        Активности
      </div>

      <div class="activity">
        Здесь будут появляться события,
        игровые активности и предложения
        сообщества.
      </div>

    </section>


    <div class="bottom">
      Seyfert • 0.3
    </div>

  </main>

</body>
</html>
