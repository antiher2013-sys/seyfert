<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seyfert</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080711;
  --card:#151320;
  --card2:#1b1728;
  --text:#f7f5fb;
  --muted:#9e98ae;
  --purple:#8b5cf6;
  --pink:#d946ef;
  --green:#69e6a7;
  --red:#ff6683;
  --line:rgba(255,255,255,.1);
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(139,92,246,.25),
      transparent 42%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

button,
select,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

.header{
  height:68px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 17px;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:var(--purple);
}

.header-btn{
  width:43px;
  height:43px;
  border-radius:14px;
  color:#fff;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
}

/* ================= MAIN ================= */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 15px 8px;
}

.top{
  height:53px;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:28px;
  font-weight:900;
}

.filter{
  padding:9px 12px;
  border-radius:13px;
  color:#ddd8e8;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  font-size:13px;
  font-weight:700;
}

.card-area{
  flex:1;
  min-height:0;
  position:relative;
}

/* ================= CARD ================= */

.card{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:30px;

  background:var(--card);
  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    0 0 55px rgba(139,92,246,.1);

  touch-action:none;
  user-select:none;

  transition:
    transform .32s cubic-bezier(.2,.8,.2,1),
    opacity .3s ease;
}

/* ================= PHOTO ================= */

.photo{
  position:absolute;
  inset:0;
  transition:
    height .48s cubic-bezier(.22,.8,.22,1);
}

.card.expanded .photo{
  height:39%;
}

.photo-bg{
  position:absolute;
  inset:0;

  transition:
    background .25s ease;
}

.photo-bg::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.03) 20%,
      rgba(0,0,0,.18) 50%,
      rgba(8,7,17,.95) 100%
    );
}

/* Временный визуальный персонаж */

.person{
  position:absolute;
  z-index:2;

  left:50%;
  top:40%;

  width:220px;
  height:330px;

  transform:translate(-50%,-50%);
}

.head{
  position:absolute;

  top:0;
  left:50%;

  width:112px;
  height:132px;

  transform:translateX(-50%);

  border-radius:52% 52% 48% 48%;

  background:
    linear-gradient(
      145deg,
      #d1afc0,
      #725b7e
    );
}

.body{
  position:absolute;

  bottom:0;
  left:50%;

  width:220px;
  height:215px;

  transform:translateX(-50%);

  border-radius:
    120px 120px
    20px 20px;

  background:
    linear-gradient(
      145deg,
      #30233e,
      #0c0d15
    );
}

/* ================= PHOTO PROGRESS ================= */

.photo-progress{
  position:absolute;
  z-index:30;

  top:12px;
  left:17px;
  right:17px;

  display:flex;
  gap:4px;
}

.photo-progress span{
  flex:1;
  height:3px;

  border-radius:10px;

  background:
    rgba(255,255,255,.3);

  transition:
    background .2s ease;
}

.photo-progress span.active{
  background:#fff;
}

/* ================= PHOTO ZONES ================= */

.photo-zone{
  position:absolute;
  z-index:18;

  top:0;
  bottom:0;

  width:30%;
}

.photo-zone.left{
  left:0;
}

.photo-zone.right{
  right:0;
}

/* ================= CARD TOP ================= */

.card-top{
  position:absolute;
  z-index:35;

  top:24px;
  left:15px;
  right:15px;

  display:flex;
  justify-content:space-between;

  pointer-events:none;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 10px;

  border-radius:999px;

  color:#e5e1eb;

  background:
    rgba(7,7,13,.58);

  border:
    1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(12px);

  font-size:11px;
  font-weight:700;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 9px rgba(105,230,167,.7);
}

.report{
  width:39px;
  height:39px;

  border-radius:13px;

  color:#ddd9e4;

  background:
    rgba(7,7,13,.58);

  border:
    1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(12px);

  pointer-events:auto;
}

/* ================= PROFILE INFO ================= */

.profile-info{
  position:absolute;
  z-index:22;

  left:20px;
  right:20px;
  bottom:20px;

  transition:
    bottom .48s cubic-bezier(.22,.8,.22,1);
}

.card.expanded .profile-info{
  bottom:auto;
  top:calc(39% - 2px);
  padding-top:17px;
}

.name-line{
  display:flex;
  align-items:baseline;
  gap:8px;
}

.name{
  font-size:30px;
  font-weight:900;
}

.age{
  font-size:19px;
  color:#d0cad9;
}

.city{
  margin-top:3px;
  color:#c2bccd;
  font-size:13px;
}

.distance{
  margin-top:5px;
  color:#bda8f3;
  font-size:12px;
  font-weight:700;
}

.bio{
  margin-top:10px;

  max-width:500px;

  color:#ddd9e5;

  font-size:14px;
  line-height:1.4;

  transition:
    opacity .3s ease,
    max-height .4s ease;
}

.card.expanded .bio{
  max-height:0;
  opacity:0;
  overflow:hidden;
  margin:0;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;

  margin-top:10px;
}

.tag{
  padding:6px 9px;

  border-radius:999px;

  color:#cbb9ff;

  background:
    rgba(139,92,246,.13);

  border:
    1px solid rgba(139,92,246,.22);

  font-size:10px;
  font-weight:700;
}

/* ================= DETAILS ================= */

.details{
  position:absolute;
  z-index:21;

  left:20px;
  right:20px;

  top:calc(39% + 128px);
  bottom:20px;

  overflow-y:auto;

  padding-bottom:10px;

  opacity:0;
  transform:translateY(18px);

  pointer-events:none;

  transition:
    opacity .28s ease .12s,
    transform .42s cubic-bezier(.22,.8,.22,1) .08s;
}

.card.expanded .details{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

.detail-heading{
  margin-bottom:11px;

  color:#8f899e;

  font-size:11px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.7px;
}

.detail-grid{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);

  gap:8px;
}

.detail-item{
  min-height:58px;

  padding:10px 11px;

  border-radius:15px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.07);

  opacity:0;
  transform:translateY(9px);

  transition:
    opacity .3s ease,
    transform .3s ease;
}

.card.expanded .detail-item{
  opacity:1;
  transform:translateY(0);
}

.card.expanded
.detail-item:nth-child(1){
  transition-delay:.10s;
}

.card.expanded
.detail-item:nth-child(2){
  transition-delay:.14s;
}

.card.expanded
.detail-item:nth-child(3){
  transition-delay:.18s;
}

.card.expanded
.detail-item:nth-child(4){
  transition-delay:.22s;
}

.card.expanded
.detail-item:nth-child(5){
  transition-delay:.26s;
}

.card.expanded
.detail-item:nth-child(6){
  transition-delay:.30s;
}

.card.expanded
.detail-item:nth-child(7){
  transition-delay:.34s;
}

.card.expanded
.detail-item:nth-child(8){
  transition-delay:.38s;
}

.detail-icon{
  font-size:16px;
}

.detail-label{
  margin-top:4px;

  color:#817b8f;

  font-size:9px;
}

.detail-value{
  margin-top:2px;

  color:#eeeaf3;

  font-size:12px;
  font-weight:700;
}

.interests{
  margin-top:17px;
}

.interest-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.interest{
  padding:7px 10px;

  border-radius:10px;

  background:
    rgba(139,92,246,.12);

  color:#c8b7f7;

  border:
    1px solid rgba(139,92,246,.2);

  font-size:10px;
  font-weight:700;
}

/* ================= COLLAPSE ================= */

.collapse{
  position:absolute;
  z-index:40;

  right:17px;
  top:calc(39% + 12px);

  width:35px;
  height:35px;

  border-radius:12px;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid var(--line);

  color:#eee;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .25s ease .1s,
    transform .25s ease;
}

.card.expanded .collapse{
  opacity:1;
  pointer-events:auto;
}

/* ================= SWIPE ================= */

.swipe-label{
  position:absolute;
  z-index:50;

  top:42%;

  padding:9px 14px;

  border-radius:12px;

  font-weight:900;
  letter-spacing:1px;

  opacity:0;
  pointer-events:none;
}

.like-label{
  left:22px;

  color:var(--green);

  border:
    2px solid var(--green);

  transform:rotate(-12deg);
}

.nope-label{
  right:22px;

  color:var(--red);

  border:
    2px solid var(--red);

  transform:rotate(12deg);
}

/* ================= ACTIONS ================= */

.actions{
  height:84px;
  flex-shrink:0;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:18px;
}

.action{
  width:58px;
  height:58px;

  border-radius:50%;

  color:#fff;

  background:#14111f;

  border:
    1px solid var(--line);

  box-shadow:
    0 10px 30px rgba(0,0,0,.3);

  transition:
    transform .12s ease;
}

.action:active{
  transform:scale(.88);
}

.action.dislike{
  color:var(--red);
}

.action.comment{
  width:65px;
  height:65px;

  color:white;

  background:
    linear-gradient(
      145deg,
      var(--purple),
      var(--pink)
    );

  box-shadow:
    0 12px 35px
    rgba(139,92,246,.4);
}

.action.like{
  color:#ff6f95;
}

/* ================= EMPTY ================= */

.empty{
  position:absolute;
  inset:0;

  border-radius:30px;

  background:#11101b;

  border:
    1px solid var(--line);

  display:flex;
  justify-content:center;
  align-items:center;

  text-align:center;

  padding:30px;
}

.empty-title{
  font-size:24px;
  font-weight:900;
}

.empty-text{
  margin-top:9px;

  color:var(--muted);

  line-height:1.5;

  font-size:14px;
}

/* ================= OVERLAY ================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:blur(12px);
}

.overlay.open{
  display:flex;
}

.sheet{
  width:min(620px,100%);
  max-height:90%;

  overflow-y:auto;

  padding:21px;

  border-radius:
    28px 28px 0 0;

  background:
    linear-gradient(
      145deg,
      #171326,
      #0f1019
    );

  border:
    1px solid var(--line);
}

.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sheet-title{
  font-size:23px;
  font-weight:900;
}

.close{
  width:40px;
  height:40px;

  border-radius:13px;

  background:
    rgba(255,255,255,.05);

  color:white;

  border:
    1px solid var(--line);
}

/* ================= FILTER ================= */

.field{
  margin-top:18px;
}

.field-label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.filter-value{
  margin-top:7px;

  color:#eeeaf3;

  font-size:14px;
  font-weight:800;
}

/* ================= AGE RANGE ================= */

.range-box{
  margin-top:13px;
}

.range-track{
  position:relative;

  height:5px;

  border-radius:10px;

  background:
    rgba(255,255,255,.12);
}

.range-selected{
  position:absolute;

  height:5px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--pink)
    );
}

.range-input{
  position:absolute;

  left:0;
  top:-7px;

  width:100%;
  height:19px;

  margin:0;

  appearance:none;

  background:transparent;

  pointer-events:none;
}

.range-input::-webkit-slider-thumb{
  appearance:none;

  width:20px;
  height:20px;

  border-radius:50%;

  background:#fff;

  border:
    3px solid var(--purple);

  box-shadow:
    0 0 12px rgba(139,92,246,.5);

  pointer-events:auto;
}

.range-input::-moz-range-thumb{
  width:20px;
  height:20px;

  border-radius:50%;

  background:#fff;

  border:
    3px solid var(--purple);

  pointer-events:auto;
}

.age-values{
  display:flex;
  justify-content:space-between;

  margin-top:12px;

  color:#dcd7e5;

  font-size:12px;
  font-weight:800;
}

/* ================= SELECT ================= */

select,
textarea{
  width:100%;

  margin-top:7px;

  padding:13px;

  color:white;

  background:#191526;

  border:
    1px solid var(--line);

  border-radius:14px;

  outline:none;
}

/* ================= HOBBIES ================= */

.hobby-list{
  display:flex;
  flex-wrap:wrap;

  gap:8px;

  margin-top:10px;
}

.hobby{
  padding:9px 11px;

  border-radius:12px;

  color:#bbb4c9;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.08);

  font-size:11px;
  font-weight:700;

  transition:
    background .15s ease,
    color .15s ease,
    border .15s ease,
    transform .12s ease;
}

.hobby:active{
  transform:scale(.95);
}

.hobby.active{
  color:#fff;

  background:
    rgba(139,92,246,.2);

  border:
    1px solid rgba(139,92,246,.5);

  box-shadow:
    0 0 18px rgba(139,92,246,.12);
}

/* ================= BUTTON ================= */

.primary{
  width:100%;

  margin-top:21px;

  padding:14px;

  border-radius:15px;

  color:white;

  font-weight:800;

  background:
    linear-gradient(
      100deg,
      var(--purple),
      var(--pink)
    );
}

/* ================= COMMENT ================= */

textarea{
  height:110px;
  resize:none;
}

.counter{
  margin-top:5px;

  color:#716b7d;

  text-align:right;

  font-size:10px;
}

/* ================= REPORT ================= */

.report-option{
  width:100%;

  margin-top:8px;

  padding:14px;

  text-align:left;

  border-radius:14px;

  color:white;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid var(--line);
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  z-index:300;

  left:50%;
  bottom:24px;

  transform:
    translateX(-50%);

  padding:11px 16px;

  border-radius:999px;

  background:#f4f3f7;

  color:#15131b;

  font-size:12px;
  font-weight:800;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .2s ease;
}

.toast.show{
  opacity:1;
}

/* ================= MOBILE ================= */

@media(max-width:420px){

  .name{
    font-size:28px;
  }

  .detail-grid{
    gap:7px;
  }

  .detail-item{
    padding:9px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">
    SEY<span>F</span>ERT
  </div>

  <button
    class="header-btn"
    id="notifications">
    🔔
  </button>

</header>


<main class="main">

  <div class="top">

    <div class="title">
      Анкеты
    </div>

    <button
      class="filter"
      id="filterButton">
      ⚙ Фильтр
    </button>

  </div>


  <div
    class="card-area"
    id="cardArea">
  </div>


  <div class="actions">

    <button
      class="action dislike"
      id="dislike">
      ✕
    </button>

    <button
      class="action comment"
      id="comment">
      💬
    </button>

    <button
      class="action like"
      id="like">
      ♥
    </button>

  </div>

</main>

</div>


<!-- ================= FILTER ================= -->

<div
  class="overlay"
  id="filterOverlay">

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Фильтры
      </div>

      <button
        class="close"
        data-close="filterOverlay">
        ✕
      </button>

    </div>


    <!-- AGE -->

    <div class="field">

      <div class="field-label">
        Возраст
      </div>

      <div
        class="filter-value"
        id="ageValue">
        18–60 лет
      </div>

      <div class="range-box">

        <div class="range-track">

          <div
            class="range-selected"
            id="rangeSelected">
          </div>

          <input
            class="range-input"
            id="ageMin"
            type="range"
            min="18"
            max="60"
            value="18">

          <input
            class="range-input"
            id="ageMax"
            type="range"
            min="18"
            max="60"
            value="60">

        </div>

        <div class="age-values">

          <span id="ageMinText">
            18
          </span>

          <span id="ageMaxText">
            60
          </span>

        </div>

      </div>

    </div>


    <!-- GENDER -->

    <div class="field">

      <div class="field-label">
        Пол
      </div>

      <select id="gender">

        <option value="all">
          Все
        </option>

        <option value="female">
          Девушки
        </option>

        <option value="male">
          Парни
        </option>

      </select>

    </div>


    <!-- CITY -->

    <div class="field">

      <div class="field-label">
        Город
      </div>

      <select id="city">

        <option value="all">
          Любой город
        </option>

        <option value="Москва">
          Москва
        </option>

        <option value="Санкт-Петербург">
          Санкт-Петербург
        </option>

        <option value="Казань">
          Казань
        </option>

        <option value="Екатеринбург">
          Екатеринбург
        </option>

      </select>

    </div>


    <!-- HOBBIES -->

    <div class="field">

      <div class="field-label">
        Увлечения
      </div>

      <div
        class="hobby-list"
        id="hobbyList">

      </div>

    </div>


    <button
      class="primary"
      id="applyFilters">
      Применить
    </button>

  </div>

</div>


<!-- ================= COMMENT ================= -->

<div
  class="overlay"
  id="commentOverlay">

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Лайк с комментарием
      </div>

      <button
        class="close"
        data-close="commentOverlay">
        ✕
      </button>

    </div>


    <div class="field">

      <div class="field-label">
        Сообщение
      </div>

      <textarea
        id="commentInput"
        maxlength="180"
        placeholder="Например: «Тоже люблю такую музыку»">
      </textarea>

      <div
        class="counter"
        id="counter">
        0 / 180
      </div>

    </div>


    <button
      class="primary"
      id="sendComment">
      Отправить лайк ❤️
    </button>

  </div>

</div>


<!-- ================= REPORT ================= -->

<div
  class="overlay"
  id="reportOverlay">

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Пожаловаться
      </div>

      <button
        class="close"
        data-close="reportOverlay">
        ✕
      </button>

    </div>


    <button
      class="report-option"
      data-report="Спам">
      🚫 Спам
    </button>

    <button
      class="report-option"
      data-report="Оскорбление">
      ⚠️ Оскорбление
    </button>

    <button
      class="report-option"
      data-report="Неприемлемый контент">
      🔞 Неприемлемый контент
    </button>

    <button
      class="report-option"
      data-report="Фейковый профиль">
      👤 Фейковый профиль
    </button>

    <button
      class="report-option"
      data-report="Другое">
      ••• Другое
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* =========================================================
   ДАННЫЕ
========================================================= */

const profiles = [

  {
    id:1,

    name:"Алина",
    age:21,
    gender:"female",

    city:"Санкт-Петербург",
    distance:3,

    online:true,

    photos:[
      "photo1",
      "photo2",
      "photo3"
    ],

    bio:
      "Люблю музыку, прогулки по ночному городу и разговоры до утра.",

    interests:[
      "Музыка",
      "Кино",
      "Игры"
    ],

    details:{
      weight:"54 кг",
      income:"100–150 тыс. ₽",
      onlineTime:"18:00–01:00",
      children:"Нет детей",
      smoking:"Не курю",
      alcohol:"Иногда",
      personality:"INFJ",
      work:"Дизайн"
    }
  },


  {
    id:2,

    name:"Макс",
    age:24,
    gender:"male",

    city:"Москва",
    distance:5,

    online:true,

    photos:[
      "photo1",
      "photo2"
    ],

    bio:
      "Игры, спорт, техника и вечные попытки найти хороший фильм.",

    interests:[
      "Игры",
      "Спорт",
      "Технологии"
    ],

    details:{
      weight:"78 кг",
      income:"150–200 тыс. ₽",
      onlineTime:"20:00–03:00",
      children:"Нет детей",
      smoking:"Не курю",
      alcohol:"Редко",
      personality:"ENTP",
      work:"IT"
    }
  },


  {
    id:3,

    name:"София",
    age:22,
    gender:"female",

    city:"Казань",
    distance:8,

    online:false,

    photos:[
      "photo1",
      "photo2",
      "photo3",
      "photo4"
    ],

    bio:
      "Фотография, путешествия и кофе.",

    interests:[
      "Фото",
      "Путешествия",
      "Музыка"
    ],

    details:{
      weight:"58 кг",
      income:"Не указано",
      onlineTime:"17:00–00:00",
      children:"Нет детей",
      smoking:"Не курю",
      alcohol:"Иногда",
      personality:"ENFP",
      work:"Маркетинг"
    }
  }

];


/* =========================================================
   ДОСТУПНЫЕ УВЛЕЧЕНИЯ
========================================================= */

const hobbies = [

  "Музыка",
  "Кино",
  "Игры",
  "Спорт",
  "Путешествия",
  "Фото",
  "Технологии",
  "Автомобили",
  "Книги",
  "Искусство",
  "Танцы",
  "Программирование"

];


/* =========================================================
   STATE
========================================================= */

let activeProfiles = [...profiles];

let index = 0;

let current = null;

let photoIndex = 0;

let expanded = false;

let locked = false;

let pointer = false;

let startX = 0;

let startY = 0;

let dx = 0;

let dy = 0;

let selectedHobbies = new Set();


/* =========================================================
   ELEMENTS
========================================================= */

const area =
  document.getElementById("cardArea");


const ageMin =
  document.getElementById("ageMin");


const ageMax =
  document.getElementById("ageMax");


const ageValue =
  document.getElementById("ageValue");


const ageMinText =
  document.getElementById("ageMinText");


const ageMaxText =
  document.getElementById("ageMaxText");


const rangeSelected =
  document.getElementById("rangeSelected");


const hobbyList =
  document.getElementById("hobbyList");


/* =========================================================
   HOBBIES
========================================================= */

function renderHobbies(){

  hobbyList.innerHTML = "";

  hobbies.forEach(
    hobby => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "hobby";

      button.textContent =
        hobby;

      button.dataset.hobby =
        hobby;

      button.addEventListener(
        "click",
        () => {

          if(
            selectedHobbies.has(hobby)
          ){

            selectedHobbies.delete(hobby);

            button.classList.remove(
              "active"
            );

          }else{

            selectedHobbies.add(hobby);

            button.classList.add(
              "active"
            );

          }

        }
      );

      hobbyList.appendChild(button);

    }
  );

}


/* =========================================================
   AGE RANGE
========================================================= */

function updateAgeRange(){

  let min =
    Number(ageMin.value);

  let max =
    Number(ageMax.value);


  if(min > max){

    if(
      document.activeElement === ageMin
    ){

      max = min;

      ageMax.value = max;

    }else{

      min = max;

      ageMin.value = min;

    }

  }


  const percentMin =
    ((min - 18) / (60 - 18)) * 100;


  const percentMax =
    ((max - 18) / (60 - 18)) * 100;


  rangeSelected.style.left =
    `${percentMin}%`;


  rangeSelected.style.width =
    `${percentMax - percentMin}%`;


  ageMinText.textContent =
    min;


  ageMaxText.textContent =
    max;


  ageValue.textContent =
    `${min}–${max} лет`;

}


ageMin.addEventListener(
  "input",
  updateAgeRange
);


ageMax.addEventListener(
  "input",
  updateAgeRange
);


/* =========================================================
   RENDER CARD
========================================================= */

function render(){

  area.innerHTML = "";

  if(
    index >= activeProfiles.length
  ){

    area.innerHTML = `

      <div class="empty">

        <div>

          <div style="font-size:48px">
            ✨
          </div>

          <div class="empty-title">
            Анкеты закончились
          </div>

          <div class="empty-text">
            Попробуй изменить фильтры —
            возможно, там есть кто-то ещё.
          </div>

        </div>

      </div>

    `;

    current = null;

    return;
  }


  current =
    activeProfiles[index];


  photoIndex = 0;

  expanded = false;

  locked = false;


  const card =
    document.createElement("div");


  card.className =
    "card";


  card.id =
    "card";


  card.innerHTML = `

    <div class="photo">

      <div
        class="photo-bg"
        id="photoBg">
      </div>

      <div class="person">

        <div class="head"></div>

        <div class="body"></div>

      </div>

    </div>


    <div
      class="photo-progress"
      id="progress">

      ${current.photos.map(
        (_,i) => `

          <span
            class="${i === 0 ? "active" : ""}">
          </span>

        `
      ).join("")}

    </div>


    <div
      class="photo-zone left"
      id="leftPhoto">
    </div>


    <div
      class="photo-zone right"
      id="rightPhoto">
    </div>


    <div class="card-top">

      <div class="online">

        <span
          class="dot"
          style="
            opacity:${current.online ? 1 : .3}
          ">
        </span>

        ${
          current.online
          ? "Сейчас онлайн"
          : "Был(а) недавно"
        }

      </div>


      <button
        class="report"
        id="report">
        ⚑
      </button>

    </div>


    <div
      class="swipe-label like-label"
      id="likeLabel">
      LIKE
    </div>


    <div
      class="swipe-label nope-label"
      id="nopeLabel">
      NOPE
    </div>


    <div class="profile-info">

      <div class="name-line">

        <div class="name">
          ${safe(current.name)}
        </div>

        <div class="age">
          ${current.age}
        </div>

      </div>


      <div class="city">
        📍 ${safe(current.city)}
      </div>


      <div class="distance">
        📍 ${current.distance} км от вас
      </div>


      <div class="bio">
        ${safe(current.bio)}
      </div>


      <div class="tags">

        ${current.interests.map(
          interest => `

            <span class="tag">
              ${safe(interest)}
            </span>

          `
        ).join("")}

      </div>

    </div>


    <button
      class="collapse"
      id="collapse">
      ↑
    </button>


    <div class="details">

      <div class="detail-heading">
        О пользователе
      </div>


      <div class="detail-grid">

        ${detail(
          "⚖️",
          "Вес",
          current.details.weight
        )}

        ${detail(
          "💰",
          "Заработок",
          current.details.income
        )}

        ${detail(
          "🕐",
          "Обычно в сети",
          current.details.onlineTime
        )}

        ${detail(
          "👶",
          "Дети",
          current.details.children
        )}

        ${detail(
          "🚬",
          "Курение",
          current.details.smoking
        )}

        ${detail(
          "🍷",
          "Алкоголь",
          current.details.alcohol
        )}

        ${detail(
          "🧠",
          "Тип личности",
          current.details.personality
        )}

        ${detail(
          "💼",
          "Занятость",
          current.details.work
        )}

      </div>


      <div class="interests">

        <div class="detail-heading">
          Интересы
        </div>


        <div class="interest-list">

          ${current.interests.map(
            interest => `

              <span class="interest">
                ${safe(interest)}
              </span>

            `
          ).join("")}

        </div>

      </div>

    </div>

  `;


  area.appendChild(card);

  updatePhoto();

  bindCard(card);

}


/* =========================================================
   DETAIL
========================================================= */

function detail(
  icon,
  label,
  value
){

  return `

    <div class="detail-item">

      <div class="detail-icon">
        ${icon}
      </div>

      <div class="detail-label">
        ${label}
      </div>

      <div class="detail-value">
        ${safe(value)}
      </div>

    </div>

  `;

}


/* =========================================================
   PHOTO
========================================================= */

function updatePhoto(){

  if(!current)
    return;


  const bg =
    document.getElementById("photoBg");


  if(!bg)
    return;


  const hue =
    current.id * 53 +
    photoIndex * 43;


  bg.style.background = `

    radial-gradient(
      circle at
      ${25 + photoIndex * 12}% 20%,
      hsla(
        ${hue},
        75%,
        65%,
        .5
      ),
      transparent 30%
    ),

    radial-gradient(
      circle at
      ${80 - photoIndex * 9}% 20%,
      rgba(217,70,239,.38),
      transparent 30%
    ),

    linear-gradient(
      145deg,
      hsl(${hue},35%,27%),
      #090a12
    )

  `;


  document
    .querySelectorAll(
      "#progress span"
    )
    .forEach(
      (item,i) => {

        item.classList.toggle(
          "active",
          i === photoIndex
        );

      }
    );

}


function nextPhoto(){

  if(
    !current ||
    photoIndex >=
    current.photos.length - 1
  )
    return;


  photoIndex++;

  updatePhoto();

}


function previousPhoto(){

  if(
    !current ||
    photoIndex <= 0
  )
    return;


  photoIndex--;

  updatePhoto();

}


/* =========================================================
   CARD EVENTS
========================================================= */

function bindCard(card){

  const left =
    document.getElementById(
      "leftPhoto"
    );


  const right =
    document.getElementById(
      "rightPhoto"
    );


  const report =
    document.getElementById(
      "report"
    );


  const collapse =
    document.getElementById(
      "collapse"
    );


  left.onclick = event => {

    event.stopPropagation();

    if(!pointer)
      previousPhoto();

  };


  right.onclick = event => {

    event.stopPropagation();

    if(!pointer)
      nextPhoto();

  };


  report.onclick = event => {

    event.stopPropagation();

    open("reportOverlay");

  };


  collapse.onclick = event => {

    event.stopPropagation();

    collapseCard();

  };


  /*
    Открытие подробной информации:
    центральная / нижняя часть карточки.
  */

  card.addEventListener(
    "click",
    event => {

      if(
        Math.abs(dx) > 15 ||
        Math.abs(dy) > 15
      )
        return;


      if(
        event.target.closest(
          ".photo-zone"
        ) ||
        event.target.closest(
          ".report"
        ) ||
        event.target.closest(
          ".collapse"
        )
      )
        return;


      toggleCard();

    }
  );


  /* POINTER DOWN */

  card.addEventListener(
    "pointerdown",
    event => {

      if(locked)
        return;


      pointer = true;

      startX =
        event.clientX;

      startY =
        event.clientY;

      dx = 0;

      dy = 0;


      card.style.transition =
        "none";


      card.setPointerCapture(
        event.pointerId
      );

    }
  );


  /* POINTER MOVE */

  card.addEventListener(
    "pointermove",
    event => {

      if(
        !pointer ||
        locked
      )
        return;


      dx =
        event.clientX -
        startX;


      dy =
        event.clientY -
        startY;


      /*
        ВАЖНО:
        вертикальный свайп больше
        НЕ открывает информацию.

        Свайп работает только
        горизонтально.
      */

      const rotation =
        dx / 18;


      card.style.transform =
        `translateX(${dx}px)
         rotate(${rotation}deg)`;


      const likeLabel =
        document.getElementById(
          "likeLabel"
        );


      const nopeLabel =
        document.getElementById(
          "nopeLabel"
        );


      likeLabel.style.opacity =
        dx > 20
        ? Math.min(dx / 100, 1)
        : 0;


      nopeLabel.style.opacity =
        dx < -20
        ? Math.min(
            Math.abs(dx) / 100,
            1
          )
        : 0;

    }
  );


  card.addEventListener(
    "pointerup",
    () => finishSwipe(card)
  );


  card.addEventListener(
    "pointercancel",
    () => finishSwipe(card)
  );

}


/* =========================================================
   EXPAND
========================================================= */

function toggleCard(){

  const card =
    document.getElementById(
      "card"
    );


  if(!card)
    return;


  expanded =
    !expanded;


  card.classList.toggle(
    "expanded",
    expanded
  );

}


function collapseCard(){

  const card =
    document.getElementById(
      "card"
    );


  if(!card)
    return;


  expanded = false;


  card.classList.remove(
    "expanded"
  );

}


/* =========================================================
   SWIPE
========================================================= */

function finishSwipe(card){

  if(!pointer)
    return;


  pointer = false;


  card.style.transition =
    "transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s ease";


  if(
    Math.abs(dx) > 100
  ){

    if(dx > 0){

      likeProfile();

    }else{

      dislikeProfile();

    }

    return;

  }


  card.style.transform =
    "translateX(0) rotate(0)";


  dx = 0;

  dy = 0;

}


/* =========================================================
   LIKE / DISLIKE
========================================================= */

function likeProfile(){

  if(
    locked ||
    !current
  )
    return;


  locked = true;


  const card =
    document.getElementById(
      "card"
    );


  card.style.transform =
    "translateX(700px) rotate(18deg)";


  card.style.opacity =
    "0";


  toast(
    `Лайк отправлен: ${current.name} ❤️`
  );


  setTimeout(
    nextProfile,
    320
  );

}


function dislikeProfile(){

  if(
    locked ||
    !current
  )
    return;


  locked = true;


  const card =
    document.getElementById(
      "card"
    );


  card.style.transform =
    "translateX(-700px) rotate(-18deg)";


  card.style.opacity =
    "0";


  toast(
    "Анкета пропущена"
  );


  setTimeout(
    nextProfile,
    320
  );

}


function nextProfile(){

  index++;

  render();

}


/* =========================================================
   BOTTOM BUTTONS
========================================================= */

document
  .getElementById("like")
  .onclick =
    likeProfile;


document
  .getElementById("dislike")
  .onclick =
    dislikeProfile;


document
  .getElementById("notifications")
  .onclick =
    () => {

      toast(
        "Уведомлений пока нет"
      );

    };


/* =========================================================
   COMMENT
========================================================= */

const commentInput =
  document.getElementById(
    "commentInput"
  );


commentInput.oninput =
  () => {

    document
      .getElementById("counter")
      .textContent =
        `${commentInput.value.length} / 180`;

  };


document
  .getElementById("comment")
  .onclick =
    () => {

      if(!current)
        return;


      open(
        "commentOverlay"
      );


      setTimeout(
        () => commentInput.focus(),
        120
      );

    };


document
  .getElementById("sendComment")
  .onclick =
    () => {

      const text =
        commentInput.value.trim();


      close(
        "commentOverlay"
      );


      commentInput.value = "";


      document
        .getElementById("counter")
        .textContent =
          "0 / 180";


      toast(
        text
        ? "Лайк с комментарием отправлен ❤️"
        : "Лайк отправлен ❤️"
      );

    };


/* =========================================================
   FILTER
========================================================= */

document
  .getElementById("filterButton")
  .onclick =
    () => {

      open(
        "filterOverlay"
      );

    };


document
  .getElementById("applyFilters")
  .onclick =
    () => {

      const minAge =
        Number(ageMin.value);


      const maxAge =
        Number(ageMax.value);


      const gender =
        document.getElementById(
          "gender"
        ).value;


      const city =
        document.getElementById(
          "city"
        ).value;


      activeProfiles =
        profiles.filter(
          profile => {

            const ageOK =
              profile.age >= minAge &&
              profile.age <= maxAge;


            const genderOK =
              gender === "all" ||
              profile.gender === gender;


            const cityOK =
              city === "all" ||
              profile.city === city;


            const hobbyOK =
              selectedHobbies.size === 0 ||
              profile.interests.some(
                interest =>
                  selectedHobbies.has(
                    interest
                  )
              );


            return (
              ageOK &&
              genderOK &&
              cityOK &&
              hobbyOK
            );

          }
        );


      index = 0;


      close(
        "filterOverlay"
      );


      render();


      toast(
        `Найдено анкет: ${activeProfiles.length}`
      );

    };


/* =========================================================
   REPORT
========================================================= */

document
  .querySelectorAll(
    "[data-report]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          close(
            "reportOverlay"
          );


          toast(
            `Жалоба отправлена: ${button.dataset.report}`
          );

        };

    }
  );


/* =========================================================
   OVERLAYS
========================================================= */

function open(id){

  document
    .getElementById(id)
    .classList.add(
      "open"
    );

}


function close(id){

  document
    .getElementById(id)
    .classList.remove(
      "open"
    );

}


document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          close(
            button.dataset.close
          );

        };

    }
  );


document
  .querySelectorAll(
    ".overlay"
  )
  .forEach(
    overlay => {

      overlay.onclick =
        event => {

          if(
            event.target === overlay
          ){

            overlay.classList.remove(
              "open"
            );

          }

        };

    }
  );


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toast(message){

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    message;


  element.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      1900
    );

}


/* =========================================================
   SAFE HTML
========================================================= */

function safe(value){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   START
========================================================= */

render();

renderHobbies();

updateAgeRange();

</script>

</body>
</html>
