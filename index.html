<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seyfert — Анкеты</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05030b;
      color: white;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      position: relative;
    }

    /* ===== КОСМИЧЕСКИЙ ФОН ===== */

    .space {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      transition:
        background 0.8s ease,
        filter 0.8s ease;
    }

    .space::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.04) 0%,
          transparent 38%
        ),
        radial-gradient(
          circle,
          var(--glow),
          transparent 68%
        );

      filter: blur(20px);

      animation: galaxyMove 12s ease-in-out infinite alternate;
    }

    .space::after {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(circle at 10% 20%, white 0 1px, transparent 2px),
        radial-gradient(circle at 80% 30%, white 0 1px, transparent 2px),
        radial-gradient(circle at 30% 70%, white 0 1px, transparent 2px),
        radial-gradient(circle at 70% 80%, white 0 1px, transparent 2px),
        radial-gradient(circle at 50% 15%, white 0 1px, transparent 2px),
        radial-gradient(circle at 90% 70%, white 0 1px, transparent 2px);

      opacity: 0.65;

      animation: starsMove 18s linear infinite;
    }

    @keyframes galaxyMove {
      from {
        transform: translate(-50%, -50%) scale(1);
      }

      to {
        transform: translate(-48%, -53%) scale(1.12);
      }
    }

    @keyframes starsMove {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-35px);
      }
    }

    /* ===== ЦВЕТА АНКЕТ ===== */

    .purple {
      --glow: rgba(135, 70, 255, 0.55);
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(130, 70, 255, 0.30),
          transparent 55%
        ),
        #08040f;
    }

    .red {
      --glow: rgba(255, 55, 90, 0.55);
      background:
        radial-gradient(
          circle at 70% 30%,
          rgba(255, 50, 90, 0.32),
          transparent 55%
        ),
        #100306;
    }

    .blue {
      --glow: rgba(40, 170, 255, 0.55);
      background:
        radial-gradient(
          circle at 30% 30%,
          rgba(30, 170, 255, 0.32),
          transparent 55%
        ),
        #020912;
    }

    .gold {
      --glow: rgba(255, 190, 55, 0.50);
      background:
        radial-gradient(
          circle at 60% 30%,
          rgba(255, 180, 40, 0.30),
          transparent 55%
        ),
        #100b02;
    }

    .cyan {
      --glow: rgba(30, 255, 220, 0.50);
      background:
        radial-gradient(
          circle at 40% 30%,
          rgba(30, 255, 220, 0.28),
          transparent 55%
        ),
        #02100e;
    }

    /* ===== ОСНОВА ===== */

    .app {
      position: relative;
      z-index: 2;

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        calc(22px + env(safe-area-inset-bottom));
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 18px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .counter {
      font-size: 13px;
      opacity: 0.7;
      padding: 8px 12px;
      border-radius: 20px;

      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }

    /* ===== КАРТОЧКА ===== */

    .profile {
      width: 100%;
      max-width: 500px;

      margin: 0 auto;

      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    .profile.changing {
      opacity: 0;
      transform: scale(0.97) translateY(12px);
    }

    .photo {
      position: relative;

      width: 100%;
      height: min(62vh, 580px);

      border-radius: 30px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.12),
          rgba(255,255,255,0.02)
        );

      border: 1px solid rgba(255,255,255,0.16);

      box-shadow:
        0 25px 80px rgba(0,0,0,0.55),
        0 0 50px var(--glow);

      backdrop-filter: blur(10px);
    }

    .photo img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .photo::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.90),
          rgba(0,0,0,0.05) 55%,
          rgba(0,0,0,0.15)
        );
    }

    .profile-info {
      position: absolute;

      left: 20px;
      right: 20px;
      bottom: 20px;

      z-index: 3;
    }

    .name {
      font-size: 29px;
      font-weight: 800;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .age {
      opacity: 0.8;
      font-weight: 500;
    }

    .city {
      margin-top: 6px;

      font-size: 14px;
      opacity: 0.75;
    }

    .description {
      margin-top: 13px;

      font-size: 15px;
      line-height: 1.45;

      opacity: 0.92;
    }

    /* ===== КНОПКИ ===== */

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 24px;

      margin-top: 20px;
    }

    .action {
      width: 64px;
      height: 64px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,0.15);

      color: white;

      font-size: 25px;

      background:
        rgba(255,255,255,0.08);

      backdrop-filter: blur(16px);

      box-shadow:
        0 10px 35px rgba(0,0,0,0.35);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .action:active {
      transform: scale(0.88);
    }

    .action.like {
      width: 72px;
      height: 72px;

      box-shadow:
        0 0 30px var(--glow),
        0 10px 40px rgba(0,0,0,0.35);
    }

    .action:hover {
      transform: scale(1.06);
    }

    /* ===== НИЖНЯЯ НАВИГАЦИЯ ===== */

    .navigation {
      margin: 20px auto 0;

      width: 100%;
      max-width: 500px;

      display: flex;
      justify-content: space-around;
      align-items: center;

      padding: 12px;

      border-radius: 22px;

      background:
        rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.10);

      backdrop-filter: blur(18px);
    }

    .nav-item {
      font-size: 11px;
      opacity: 0.65;
      text-align: center;
    }

    .nav-item.active {
      opacity: 1;
    }

    .nav-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 3px;
    }

    /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */

    @media (max-height: 700px) {
      .photo {
        height: 55vh;
      }

      .actions {
        margin-top: 14px;
      }
    }

  </style>
</head>

<body>

  <!-- Космический фон -->
  <div class="space purple" id="space"></div>

  <main class="app">

    <header class="header">

      <div class="logo">
        SEYFERT
      </div>

      <div class="counter" id="counter">
        1 / 5
      </div>

    </header>


    <section class="profile" id="profile">

      <div class="photo">

        <!-- Временная фотография -->
        <img
          id="photo"
          src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=85"
          alt="Фото профиля"
        >

        <div class="profile-info">

          <div class="name">
            <span id="name">Алина</span>
            <span class="age" id="age">22</span>
          </div>

          <div class="city" id="city">
            📍 Москва
          </div>

          <div class="description" id="description">
            Люблю путешествия, музыку и долгие разговоры обо всём на свете.
          </div>

        </div>

      </div>


      <div class="actions">

        <button
          class="action"
          onclick="nextProfile()"
          aria-label="Пропустить"
        >
          ✕
        </button>

        <button
          class="action like"
          onclick="nextProfile()"
          aria-label="Нравится"
        >
          ♥
        </button>

      </div>

    </section>


    <nav class="navigation">

      <div class="nav-item active">
        <span class="nav-icon">⌂</span>
        Анкеты
      </div>

      <div class="nav-item">
        <span class="nav-icon">♡</span>
        Матчи
      </div>

      <div class="nav-item">
        <span class="nav-icon">◌</span>
        Чаты
      </div>

      <div class="nav-item">
        <span class="nav-icon">◉</span>
        Профиль
      </div>

    </nav>

  </main>


  <script>

    const profiles = [

      {
        name: "Алина",
        age: 22,
        city: "Москва",
        description:
          "Люблю путешествия, музыку и долгие разговоры обо всём на свете.",
        photo:
          "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=85",
        theme: "purple"
      },

      {
        name: "София",
        age: 24,
        city: "Санкт-Петербург",
        description:
          "Музыка, фотография, кофе и спонтанные поездки без плана.",
        photo:
          "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=85",
        theme: "red"
      },

      {
        name: "Маша",
        age: 21,
        city: "Казань",
        description:
          "Обожаю кино, вечерние прогулки и находить новые места.",
        photo:
          "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=85",
        theme: "blue"
      },

      {
        name: "Ева",
        age: 23,
        city: "Екатеринбург",
        description:
          "Немного интроверт, немного безумная. Люблю уют и красивые истории.",
        photo:
          "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&fit=crop&w=900&q=85",
        theme: "gold"
      },

      {
        name: "Лера",
        age: 25,
        city: "Новосибирск",
        description:
          "IT, музыка, игры и бесконечные разговоры ночью.",
        photo:
          "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=85",
        theme: "cyan"
      }

    ];


    let current = 0;


    function nextProfile() {

      const profile = document.getElementById("profile");
      const space = document.getElementById("space");

      profile.classList.add("changing");

      setTimeout(() => {

        current++;

        if (current >= profiles.length) {
          current = 0;
        }

        const person = profiles[current];

        document.getElementById("name").textContent =
          person.name;

        document.getElementById("age").textContent =
          person.age;

        document.getElementById("city").textContent =
          "📍 " + person.city;

        document.getElementById("description").textContent =
          person.description;

        document.getElementById("photo").src =
          person.photo;

        document.getElementById("counter").textContent =
          (current + 1) + " / " + profiles.length;


        space.className =
          "space " + person.theme;


        profile.classList.remove("changing");

      }, 350);

    }

  </script>

</body>
</html>
