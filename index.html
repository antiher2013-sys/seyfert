<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Seyfert — Анкеты</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#080711;
    --panel:#14111f;
    --purple:#8b5cf6;
    --pink:#d946ef;
    --text:#f8f7fc;
    --muted:#aaa5b8;
    --danger:#ff5f7d;
    --success:#65e6a5;
    --border:rgba(255,255,255,.1);
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% -10%,rgba(124,58,237,.28),transparent 42%),
        #080711;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

button,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:620px;
    height:100%;
    margin:auto;
    display:flex;
    flex-direction:column;
}

.header{
    height:70px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 17px;
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:.8px;
}

.logo span{
    color:var(--purple);
}

.header-button{
    width:43px;
    height:43px;
    border-radius:14px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.045);
    color:white;
    font-size:19px;
}

.main{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:0 15px 8px;
}

.top{
    height:53px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 2px 10px;
}

.title{
    font-size:27px;
    font-weight:900;
    letter-spacing:-.6px;
}

.filter-button{
    padding:9px 12px;
    border-radius:13px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.045);
    color:#ddd9e7;
    font-size:13px;
    font-weight:700;
}

.card-wrap{
    position:relative;
    flex:1;
    min-height:0;
}

.card{
    position:absolute;
    inset:0;
    overflow:hidden;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.12);
    background:#151221;
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 60px rgba(124,58,237,.11);
    touch-action:none;
    user-select:none;
    transition:
        transform .3s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
}

/* ФОТО */

.photo{
    position:absolute;
    inset:0;
    transition:opacity .18s ease;
}

.photo::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0) 38%,
            rgba(0,0,0,.12) 52%,
            rgba(0,0,0,.9) 88%,
            rgba(0,0,0,.98) 100%
        );
}

/*
    Здесь вместо градиента позже подключим реальные
    фотографии пользователя.
*/

.person{
    position:absolute;
    left:50%;
    top:41%;
    width:230px;
    height:340px;
    transform:translate(-50%,-50%);
}

.head{
    position:absolute;
    left:50%;
    top:0;
    width:118px;
    height:140px;
    transform:translateX(-50%);
    border-radius:52% 52% 48% 48%;
    background:linear-gradient(145deg,#d0adbd,#765e80);
}

.body{
    position:absolute;
    left:50%;
    bottom:0;
    width:230px;
    height:225px;
    transform:translateX(-50%);
    border-radius:120px 120px 25px 25px;
    background:linear-gradient(145deg,#30233f,#0c0d17);
}

/* ИНДИКАТОРЫ ФОТО */

.photo-progress{
    position:absolute;
    z-index:12;
    top:12px;
    left:17px;
    right:17px;
    display:flex;
    gap:4px;
}

.photo-progress span{
    flex:1;
    height:3px;
    border-radius:10px;
    background:rgba(255,255,255,.28);
}

.photo-progress span.active{
    background:#fff;
}

/* ЗОНЫ ПЕРЕКЛЮЧЕНИЯ ФОТО */

.photo-zone{
    position:absolute;
    z-index:7;
    top:0;
    bottom:0;
    width:34%;
}

.photo-zone.left{
    left:0;
}

.photo-zone.right{
    right:0;
}

/* Верх */

.card-top{
    position:absolute;
    z-index:15;
    top:25px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.online{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:999px;
    background:rgba(7,7,13,.58);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(12px);
    font-size:11px;
    font-weight:700;
}

.online-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 10px rgba(101,230,165,.7);
}

.report{
    width:39px;
    height:39px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(7,7,13,.58);
    color:#d8d4df;
    backdrop-filter:blur(12px);
    pointer-events:auto;
}

/* СВАЙП */

.swipe-indicator{
    position:absolute;
    z-index:20;
    top:42%;
    padding:9px 14px;
    border-radius:12px;
    font-size:18px;
    font-weight:900;
    letter-spacing:1px;
    opacity:0;
    pointer-events:none;
}

.like-indicator{
    left:22px;
    color:#6ee7a5;
    border:2px solid #6ee7a5;
    transform:rotate(-12deg);
}

.nope-indicator{
    right:22px;
    color:#ff6482;
    border:2px solid #ff6482;
    transform:rotate(12deg);
}

/* ИНФОРМАЦИЯ */

.profile-info{
    position:absolute;
    z-index:15;
    left:20px;
    right:20px;
    bottom:19px;
    pointer-events:none;
}

.name-line{
    display:flex;
    align-items:baseline;
    gap:8px;
}

.name{
    font-size:30px;
    font-weight:900;
}

.age{
    color:#d3cedc;
    font-size:19px;
}

.city{
    margin-top:3px;
    color:#c1bccb;
    font-size:13px;
}

.distance{
    margin-top:5px;
    color:#bca9e9;
    font-size:12px;
    font-weight:700;
}

.bio{
    max-width:500px;
    margin-top:10px;
    color:#ddd9e4;
    line-height:1.42;
    font-size:14px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.tag{
    padding:6px 9px;
    border-radius:999px;
    background:rgba(139,92,246,.13);
    border:1px solid rgba(139,92,246,.22);
    color:#c7b4ff;
    font-size:10px;
    font-weight:700;
}

/* Кнопки */

.actions{
    height:84px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
}

.action{
    width:58px;
    height:58px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#14111f;
    color:white;
    font-size:21px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    transition:transform .12s ease;
}

.action:active{
    transform:scale(.88);
}

.action.dislike{
    color:var(--danger);
}

.action.comment{
    width:65px;
    height:65px;
    border:none;
    background:linear-gradient(145deg,var(--purple),var(--pink));
    box-shadow:0 12px 35px rgba(139,92,246,.4);
}

.action.like{
    color:#ff6e94;
}

/* EMPTY */

.empty-state{
    position:absolute;
    inset:0;
    border-radius:30px;
    border:1px solid var(--border);
    background:
        radial-gradient(circle at 50% 30%,rgba(139,92,246,.16),transparent 40%),
        #11101b;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.empty-content{
    max-width:330px;
}

.empty-icon{
    font-size:48px;
    margin-bottom:16px;
}

.empty-title{
    font-size:24px;
    font-weight:900;
}

.empty-text{
    margin-top:10px;
    color:var(--muted);
    line-height:1.5;
    font-size:14px;
}

.reset-filters{
    margin-top:18px;
    padding:12px 17px;
    border:none;
    border-radius:14px;
    background:linear-gradient(100deg,var(--purple),var(--pink));
    color:white;
    font-weight:800;
}

/* ОКНА */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:flex-end;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(12px);
}

.overlay.open{
    display:flex;
}

.sheet{
    width:min(620px,100%);
    max-height:90%;
    overflow-y:auto;
    margin:auto;
    padding:21px;
    border-radius:28px 28px 0 0;
    background:linear-gradient(145deg,#171326,#0f1019);
    border:1px solid var(--border);
}

.sheet-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.sheet-title{
    font-size:23px;
    font-weight:900;
}

.close{
    width:40px;
    height:40px;
    border-radius:13px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.05);
    color:white;
}

.filter-item{
    margin-top:15px;
}

.filter-label{
    color:var(--muted);
    font-size:12px;
}

select,textarea{
    width:100%;
    margin-top:7px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#191526;
    color:white;
    outline:none;
}

select{
    padding:13px;
}

.apply{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:15px;
    background:linear-gradient(100deg,var(--purple),var(--pink));
    color:white;
    font-weight:800;
}

.comment-description{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

textarea{
    height:110px;
    padding:13px;
    resize:none;
    font-size:14px;
}

.counter{
    margin-top:5px;
    color:#716b7d;
    text-align:right;
    font-size:10px;
}

/* Детальная информация */

.details-photo{
    height:210px;
    border-radius:22px;
    overflow:hidden;
    position:relative;
    background:
        radial-gradient(circle at 25% 20%,rgba(139,92,246,.5),transparent 29%),
        radial-gradient(circle at 80% 20%,rgba(217,70,239,.38),transparent 29%),
        linear-gradient(145deg,#34204c,#090a12);
}

.details-person{
    position:absolute;
    left:50%;
    bottom:-40px;
    width:120px;
    height:175px;
    transform:translateX(-50%);
}

.details-head{
    position:absolute;
    left:50%;
    top:0;
    width:78px;
    height:88px;
    transform:translateX(-50%);
    border-radius:50%;
    background:linear-gradient(145deg,#d0adbd,#765e80);
}

.details-body{
    position:absolute;
    bottom:0;
    width:120px;
    height:105px;
    border-radius:70px 70px 0 0;
    background:linear-gradient(145deg,#30233f,#0c0d17);
}

.details-section{
    padding:15px 0;
    border-bottom:1px solid var(--border);
}

.details-label{
    color:#8f899c;
    font-size:11px;
}

.details-value{
    margin-top:6px;
    color:#e3dfea;
    font-size:14px;
    line-height:1.5;
}

/* Жалоба */

.report-option{
    width:100%;
    margin-top:8px;
    padding:14px;
    text-align:left;
    border:1px solid var(--border);
    border-radius:14px;
    background:rgba(255,255,255,.035);
    color:white;
}

/* Toast */

.toast{
    position:fixed;
    z-index:300;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    padding:11px 16px;
    border-radius:999px;
    background:#f4f3f7;
    color:#15131b;
    font-size:12px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
}

.toast.show{
    opacity:1;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        SEY<span>F</span>ERT
    </div>

    <button
        class="header-button"
        id="notificationsButton">
        🔔
    </button>

</header>

<main class="main">

    <div class="top">

        <div class="title">
            Анкеты
        </div>

        <button
            class="filter-button"
            id="filterButton">
            ⚙ Фильтр
        </button>

    </div>

    <div
        class="card-wrap"
        id="cardWrap">
    </div>

    <div class="actions">

        <button
            class="action dislike"
            id="dislikeButton">
            ✕
        </button>

        <button
            class="action comment"
            id="commentButton">
            💬
        </button>

        <button
            class="action like"
            id="likeButton">
            ♥
        </button>

    </div>

</main>

</div>


<!-- ФИЛЬТР -->

<div class="overlay" id="filterOverlay">

<div class="sheet">

<div class="sheet-header">

<div class="sheet-title">
Фильтры поиска
</div>

<button
class="close"
data-close="filterOverlay">
✕
</button>

</div>

<div class="filter-item">

<div class="filter-label">
Возраст
</div>

<select id="ageFilter">
<option value="18-25">18–25</option>
<option value="18-30">18–30</option>
<option value="18-35">18–35</option>
<option value="all">Без ограничения</option>
</select>

</div>

<div class="filter-item">

<div class="filter-label">
Пол
</div>

<select id="genderFilter">
<option value="all">Все</option>
<option value="female">Девушки</option>
<option value="male">Парни</option>
</select>

</div>

<div class="filter-item">

<div class="filter-label">
Город
</div>

<select id="cityFilter">
<option value="all">Любой город</option>
<option value="Санкт-Петербург">Санкт-Петербург</option>
<option value="Москва">Москва</option>
<option value="Казань">Казань</option>
<option value="Екатеринбург">Екатеринбург</option>
</select>

</div>

<button
class="apply"
id="applyFilters">
Применить
</button>

</div>
</div>


<!-- КОММЕНТАРИЙ -->

<div class="overlay" id="commentOverlay">

<div class="sheet">

<div class="sheet-header">

<div class="sheet-title">
Лайк с комментарием
</div>

<button
class="close"
data-close="commentOverlay">
✕
</button>

</div>

<div class="comment-description">
Отправь лайк вместе с коротким сообщением.
</div>

<textarea
id="commentInput"
maxlength="180"
placeholder="Например: «Тоже люблю такую музыку»">
</textarea>

<div
class="counter"
id="counter">
0 / 180
</div>

<button
class="apply"
id="sendComment">
Отправить лайк ❤️
</button>

</div>
</div>


<!-- ПОДРОБНАЯ ИНФОРМАЦИЯ -->

<div class="overlay" id="detailsOverlay">

<div class="sheet">

<div class="sheet-header">

<div class="sheet-title">
Подробная информация
</div>

<button
class="close"
data-close="detailsOverlay">
✕
</button>

</div>

<div id="detailsContent"></div>

</div>
</div>


<!-- ЖАЛОБА -->

<div class="overlay" id="reportOverlay">

<div class="sheet">

<div class="sheet-header">

<div class="sheet-title">
Пожаловаться
</div>

<button
class="close"
data-close="reportOverlay">
✕
</button>

</div>

<div class="comment-description">
Выбери причину жалобы.
</div>

<button class="report-option" data-report="Спам">
🚫 Спам
</button>

<button class="report-option" data-report="Оскорбление">
⚠️ Оскорбление
</button>

<button class="report-option" data-report="Неприемлемый контент">
🔞 Неприемлемый контент
</button>

<button class="report-option" data-report="Фейковый профиль">
👤 Фейковый профиль
</button>

<button class="report-option" data-report="Другое">
••• Другое
</button>

</div>
</div>


<div
class="toast"
id="toast">
</div>


<script>

/* =====================================================
   ПРОФИЛИ

   photos:
   1 обязательная фотография
   + до 5 дополнительных
===================================================== */

const profiles = [

{
    id:1,
    name:"Алина",
    age:21,
    gender:"female",
    city:"Санкт-Петербург",
    distance:3,
    online:true,

    photos:[
        "photo-1-1",
        "photo-1-2",
        "photo-1-3"
    ],

    bio:"Люблю музыку, прогулки по ночному городу и разговоры до утра.",

    interests:[
        "Музыка",
        "Кино",
        "Dota 2"
    ],

    details:
        "Ценю открытых людей и хорошие разговоры без формальностей."
},

{
    id:2,
    name:"Макс",
    age:24,
    gender:"male",
    city:"Москва",
    distance:5,
    online:true,

    photos:[
        "photo-2-1",
        "photo-2-2"
    ],

    bio:"Игры, спорт, техника и вечные попытки найти хороший фильм.",

    interests:[
        "Игры",
        "Спорт",
        "Технологии"
    ],

    details:
        "Могу часами обсуждать железо, игры и совершенно случайные темы."
},

{
    id:3,
    name:"София",
    age:22,
    gender:"female",
    city:"Казань",
    distance:8,
    online:false,

    photos:[
        "photo-3-1",
        "photo-3-2",
        "photo-3-3",
        "photo-3-4"
    ],

    bio:"Фотография, путешествия и кофе. Иногда всё это одновременно.",

    interests:[
        "Фото",
        "Путешествия",
        "Музыка"
    ],

    details:
        "Люблю спонтанные поездки и людей, с которыми можно быть собой."
},

{
    id:4,
    name:"Артём",
    age:27,
    gender:"male",
    city:"Екатеринбург",
    distance:12,
    online:true,

    photos:[
        "photo-4-1",
        "photo-4-2",
        "photo-4-3"
    ],

    bio:"Музыка, компьютерные игры и долгие ночные разговоры.",

    interests:[
        "Рок",
        "Игры",
        "Фильмы"
    ],

    details:
        "Ищу людей для общения, игр и нормальных разговоров без напряжения."
},

{
    id:5,
    name:"Лера",
    age:25,
    gender:"female",
    city:"Москва",
    distance:7,
    online:true,

    photos:[
        "photo-5-1",
        "photo-5-2"
    ],

    bio:"Кино, книги и прогулки. Люблю уютные места и интересных людей.",

    interests:[
        "Кино",
        "Книги",
        "Прогулки"
    ],

    details:
        "Всегда рада новым знакомствам и необычным историям."
}

];


/* =====================================================
   STATE
===================================================== */

let activeProfiles = [...profiles];

let currentIndex = 0;

let currentProfile = null;

let currentPhotoIndex = 0;

let pointerActive = false;

let startX = 0;
let startY = 0;

let deltaX = 0;
let deltaY = 0;

let cardLocked = false;


/* =====================================================
   DOM
===================================================== */

const cardWrap =
    document.getElementById("cardWrap");

const likeButton =
    document.getElementById("likeButton");

const dislikeButton =
    document.getElementById("dislikeButton");

const commentButton =
    document.getElementById("commentButton");

const detailsContent =
    document.getElementById("detailsContent");

const commentInput =
    document.getElementById("commentInput");

const counter =
    document.getElementById("counter");


/* =====================================================
   РЕНДЕР
===================================================== */

function renderCard(){

    cardWrap.innerHTML = "";

    if(currentIndex >= activeProfiles.length){

        renderEmpty();

        return;
    }


    currentProfile =
        activeProfiles[currentIndex];

    currentPhotoIndex = 0;


    const card =
        document.createElement("div");

    card.className = "card";

    card.id = "card";


    const hue =
        currentProfile.id * 53;


    card.innerHTML = `

        <div
            class="photo"
            id="photo"
            style="
                background:
                radial-gradient(
                    circle at 25% 20%,
                    hsla(${hue},75%,65%,.5),
                    transparent 29%
                ),
                radial-gradient(
                    circle at 80% 20%,
                    rgba(217,70,239,.38),
                    transparent 29%
                ),
                linear-gradient(
                    145deg,
                    hsl(${hue},35%,27%),
                    #090a12
                );
            "
        >

            <div class="person">

                <div class="head"></div>

                <div class="body"></div>

            </div>

        </div>


        <div
            class="photo-progress"
            id="photoProgress">

            ${currentProfile.photos
                .map(
                    (_,i) =>
                    `<span class="${
                        i === 0
                        ? "active"
                        : ""
                    }"></span>`
                )
                .join("")
            }

        </div>


        <div
            class="photo-zone left"
            id="photoLeft">
        </div>


        <div
            class="photo-zone right"
            id="photoRight">
        </div>


        <div class="card-top">

            <div class="online">

                <span
                    class="online-dot"
                    style="
                    opacity:${
                        currentProfile.online
                        ? 1
                        : .35
                    };
                    ">
                </span>

                ${
                    currentProfile.online
                    ? "Сейчас онлайн"
                    : "Был(а) недавно"
                }

            </div>


            <button
                class="report"
                id="reportButton">
                ⚑
            </button>

        </div>


        <div
            class="swipe-indicator like-indicator"
            id="likeIndicator">
            LIKE
        </div>


        <div
            class="swipe-indicator nope-indicator"
            id="nopeIndicator">
            NOPE
        </div>


        <div class="profile-info">

            <div class="name-line">

                <div class="name">
                    ${escapeHTML(
                        currentProfile.name
                    )}
                </div>

                <div class="age">
                    ${currentProfile.age}
                </div>

            </div>


            <div class="city">
                📍 ${escapeHTML(
                    currentProfile.city
                )}
            </div>


            <div class="distance">
                📍 ${currentProfile.distance} км от вас
            </div>


            <div class="bio">
                ${escapeHTML(
                    currentProfile.bio
                )}
            </div>


            <div class="tags">

                ${currentProfile.interests
                    .map(
                        tag =>
                        `<span class="tag">
                            ${escapeHTML(tag)}
                        </span>`
                    )
                    .join("")
                }

            </div>

        </div>
    `;


    cardWrap.appendChild(card);

    bindCard(card);

}


/* =====================================================
   ПЕРЕКЛЮЧЕНИЕ ФОТО
===================================================== */

function nextPhoto(){

    if(!currentProfile)
        return;


    if(
        currentPhotoIndex <
        currentProfile.photos.length - 1
    ){

        currentPhotoIndex++;

        updatePhoto();

    }

}


function previousPhoto(){

    if(!currentProfile)
        return;


    if(currentPhotoIndex > 0){

        currentPhotoIndex--;

        updatePhoto();

    }

}


function updatePhoto(){

    const photo =
        document.getElementById("photo");

    if(!photo)
        return;


    /*
       Сейчас используются визуальные
       демо-заглушки.

       Позже здесь будет:
       photo.style.backgroundImage =
       `url(${currentProfile.photos[currentPhotoIndex]})`;
    */


    const hue =
        currentProfile.id * 53 +
        currentPhotoIndex * 47;


    photo.style.background =
        `
        radial-gradient(
            circle at
            ${25 + currentPhotoIndex * 13}%
            20%,
            hsla(
                ${hue},
                75%,
                65%,
                .5
            ),
            transparent 29%
        ),

        radial-gradient(
            circle at
            ${80 - currentPhotoIndex * 10}%
            20%,
            rgba(217,70,239,.38),
            transparent 29%
        ),

        linear-gradient(
            145deg,
            hsl(${hue},35%,27%),
            #090a12
        )
        `;


    const indicators =
        document
            .querySelectorAll(
                "#photoProgress span"
            );


    indicators.forEach(
        (indicator,index) => {

            indicator.classList.toggle(
                "active",
                index === currentPhotoIndex
            );

        }
    );

}


/* =====================================================
   CARD EVENTS
===================================================== */

function bindCard(card){

    const leftZone =
        card.querySelector("#photoLeft");

    const rightZone =
        card.querySelector("#photoRight");

    const reportButton =
        card.querySelector("#reportButton");

    const likeIndicator =
        card.querySelector("#likeIndicator");

    const nopeIndicator =
        card.querySelector("#nopeIndicator");


    /*
       Фото по краям.
       Они работают только когда нет
       активного горизонтального свайпа.
    */

    leftZone.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            previousPhoto();

        }
    );


    rightZone.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            nextPhoto();

        }
    );


    reportButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            openOverlay(
                "reportOverlay"
            );

        }
    );


    /*
       Тап по центральной / нижней части
       открывает подробную информацию.
    */

    card.addEventListener(
        "click",
        function(event){

            if(
                Math.abs(deltaX) > 15 ||
                Math.abs(deltaY) > 15
            )
                return;


            /*
               Не открываем детали, если
               пользователь нажал по зоне фото
               или кнопке жалобы.
            */

            if(
                event.target.closest(
                    ".photo-zone"
                ) ||
                event.target.closest(
                    ".report"
                )
            )
                return;


            openDetails();

        }
    );


    /* Свайпы */

    card.addEventListener(
        "pointerdown",
        function(event){

            if(cardLocked)
                return;


            pointerActive = true;

            startX =
                event.clientX;

            startY =
                event.clientY;

            deltaX = 0;
            deltaY = 0;


            card.style.transition =
                "none";


            card.setPointerCapture(
                event.pointerId
            );

        }
    );


    card.addEventListener(
        "pointermove",
        function(event){

            if(
                !pointerActive ||
                cardLocked
            )
                return;


            deltaX =
                event.clientX -
                startX;


            deltaY =
                event.clientY -
                startY;


            /*
               Вертикальное движение теперь
               НЕ имеет отдельного действия.
               Карточка реагирует только
               на горизонтальный свайп.
            */

            const horizontal =
                Math.abs(deltaX);


            const rotation =
                deltaX / 18;


            card.style.transform =
                `
                translate(${deltaX}px,0)
                rotate(${rotation}deg)
                `;


            likeIndicator.style.opacity =
                deltaX > 20
                ? Math.min(
                    deltaX / 100,
                    1
                )
                : 0;


            nopeIndicator.style.opacity =
                deltaX < -20
                ? Math.min(
                    Math.abs(deltaX) / 100,
                    1
                )
                : 0;

        }
    );


    card.addEventListener(
        "pointerup",
        function(){

            finishSwipe(card);

        }
    );


    card.addEventListener(
        "pointercancel",
        function(){

            finishSwipe(card);

        }
    );

}


/* =====================================================
   SWIPE
===================================================== */

function finishSwipe(card){

    if(!pointerActive)
        return;


    pointerActive = false;


    card.style.transition =
        "transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s ease";


    const horizontal =
        Math.abs(deltaX);


    /*
       Только горизонтальный свайп.
    */

    if(horizontal > 100){

        if(deltaX > 0)
            performLike();

        else
            performDislike();

        return;
    }


    resetCardPosition(card);

}


function resetCardPosition(card){

    card.style.transform =
        "translate(0,0) rotate(0deg)";

    deltaX = 0;

    deltaY = 0;

}


/* =====================================================
   LIKE
===================================================== */

function performLike(){

    if(
        cardLocked ||
        !currentProfile
    )
        return;


    cardLocked = true;


    const card =
        document.getElementById("card");


    if(!card)
        return;


    card.style.transition =
        "transform .3s ease,opacity .3s ease";


    card.style.transform =
        "translate(700px,0) rotate(18deg)";


    card.style.opacity = "0";


    showToast(
        `Лайк отправлен: ${
            currentProfile.name
        } ❤️`
    );


    setTimeout(
        nextProfile,
        330
    );

}


/* =====================================================
   DISLIKE
===================================================== */

function performDislike(){

    if(
        cardLocked ||
        !currentProfile
    )
        return;


    cardLocked = true;


    const card =
        document.getElementById("card");


    if(!card)
        return;


    card.style.transition =
        "transform .3s ease,opacity .3s ease";


    card.style.transform =
        "translate(-700px,0) rotate(-18deg)";


    card.style.opacity = "0";


    showToast(
        "Анкета пропущена"
    );


    setTimeout(
        nextProfile,
        330
    );

}


/* =====================================================
   NEXT PROFILE
===================================================== */

function nextProfile(){

    currentIndex++;

    cardLocked = false;

    renderCard();

}


/* =====================================================
   DETAILS
===================================================== */

    detailsContent.innerHTML = `

        <div class="details-photo">

            <div class="details-person">

                <div class="details-head"></div>

                <div class="details-body"></div>

            </div>

        </div>


        <div class="details-section">

            <div style="
                font-size:25px;
                font-weight:900;
            ">

                ${escapeHTML(
                    currentProfile.name
                )},

                ${currentProfile.age}

            </div>


            <div
                class="details-value"
                style="color:#aaa5b8;">

                📍 ${escapeHTML(
                    currentProfile.city
                )}

                ·

                ${currentProfile.distance}
                км от вас

            </div>

        </div>


        <div class="details-section">

            <div class="details-label">
                О себе
            </div>

            <div class="details-value">
                ${escapeHTML(
                    currentProfile.bio
                )}
            </div>

        </div>


        <div class="details-section">

            <div class="details-label">
                Интересы
            </div>

            <div class="tags">

                ${currentProfile.interests
                    .map(
                        tag =>
                        `<span class="tag">
                            ${escapeHTML(tag)}
                        </span>`
                    )
                    .join("")
                }

            </div>

        </div>


        <div class="details-section">

            <div class="details-label">
                Подробнее
            </div>

            <div class="details-value">
                ${escapeHTML(

                )}
            </div>

        </div>

}


/* =====================================================
   COMMENT LIKE
===================================================== */

commentButton.addEventListener(
    "click",
    function(){

        if(!currentProfile)
            return;


        openOverlay(
            "commentOverlay"
        );


        setTimeout(
            function(){

                commentInput.focus();

            },
            150
        );

    }
);


commentInput.addEventListener(
    "input",
    function(){

        counter.textContent =
            `${commentInput.value.length} / 180`;

    }
);


document
    .getElementById("sendComment")
    .addEventListener(
        "click",
        function(){

            if(!currentProfile)
                return;


            const name =
                currentProfile.name;


            const comment =
                commentInput.value.trim();


            closeOverlay(
                "commentOverlay"
            );


            commentInput.value = "";

            counter.textContent =
                "0 / 180";


            if(comment){

                showToast(
                    `Лайк с комментарием отправлен ${name} ❤️`
                );

            }else{

                showToast(
                    `Лайк отправлен ${name} ❤️`
                );

            }

        }
    );


/* =====================================================
   BUTTONS
===================================================== */

likeButton.addEventListener(
    "click",
    performLike
);


dislikeButton.addEventListener(
    "click",
    performDislike
);


/* =====================================================
   FILTER
===================================================== */

document
    .getElementById("filterButton")
    .addEventListener(
        "click",
        function(){

            openOverlay(
                "filterOverlay"
            );

        }
    );


document
    .getElementById("applyFilters")
    .addEventListener(
        "click",
        applyFilters
    );


function applyFilters(){

    const age =
        document
            .getElementById("ageFilter")
            .value;


    const gender =
        document
            .getElementById("genderFilter")
            .value;


    const city =
        document
            .getElementById("cityFilter")
            .value;


    activeProfiles =
        profiles.filter(
            profile => {

                let ageOK = true;


                if(age !== "all"){

                    const parts =
                        age.split("-");

                    const min =
                        Number(parts[0]);

                    const max =
                        Number(parts[1]);


                    ageOK =
                        profile.age >= min &&
                        profile.age <= max;

                }


                const genderOK =
                    gender === "all" ||
                    profile.gender === gender;


                const cityOK =
                    city === "all" ||
                    profile.city === city;


                return (
                    ageOK &&
                    genderOK &&
                    cityOK
                );

            }
        );


    currentIndex = 0;

    cardLocked = false;


    closeOverlay(
        "filterOverlay"
    );


    renderCard();


    showToast(
        `Найдено анкет: ${
            activeProfiles.length
        }`
    );

}


/* =====================================================
   REPORT
===================================================== */

document
    .querySelectorAll("[data-report]")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    if(!currentProfile)
                        return;


                    const reason =
                        button.dataset.report;


                    closeOverlay(
                        "reportOverlay"
                    );


                    showToast(
                        `Жалоба отправлена: ${reason}`
                    );

                }
            );

        }
    );


/* =====================================================
   NOTIFICATIONS
===================================================== */

document
    .getElementById("notificationsButton")
    .addEventListener(
        "click",
        function(){

            showToast(
                "Уведомления открыты"
            );

        }
    );


/* =====================================================
   OVERLAYS
===================================================== */

function openOverlay(id){

    document
        .getElementById(id)
        .classList.add("open");

}


function closeOverlay(id){

    document
        .getElementById(id)
        .classList.remove("open");

}


document
    .querySelectorAll("[data-close]")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    closeOverlay(
                        button.dataset.close
                    );

                }
            );

        }
    );


document
    .querySelectorAll(".overlay")
    .forEach(
        overlay => {

            overlay.addEventListener(
                "click",
                function(event){

                    if(
                        event.target === overlay
                    ){

                        overlay.classList.remove(
                            "open"
                        );

                    }

                }
            );

        }
    );


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById("toast");


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1900
        );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   START
===================================================== */

renderCard();

</script>
