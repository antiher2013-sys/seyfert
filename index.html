<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seyfert</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
:root{
  --bg:#080711;
  --card:#151320;
  --card2:#1b1728;
  --text:#f7f5fb;
  --muted:#9e98ae;
  --purple:#8b5cf6;
  --pink:#d946ef;
  --green:#69e6a7;
  --red:#ff6683;
  --line:rgba(255,255,255,.1);
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(139,92,246,.25),
      transparent 42%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}
button{
  font:inherit;
  border:0;
  cursor:pointer;
}
.app{
  width:100%;
  max-width:620px;
  height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
}
/* ================= HEADER ================= */
.header{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 15px;
}
.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}
.logo span{
  color:var(--purple);
}
/* ================= MAIN ================= */
.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 13px 7px;
}
.card-area{
  flex:1;
  min-height:0;
  position:relative;
}
/* ================= CARD ================= */
.card{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:31px;
  background:var(--card);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    0 0 55px rgba(139,92,246,.1);
  touch-action:none;
  user-select:none;
  transition:
    transform .3s cubic-bezier(.2,.8,.2,1),
    opacity .3s ease;
}
/* ================= PHOTO ================= */
.photo{
  position:absolute;
  inset:0;
  transition:
    opacity .3s ease;
}
.photo-bg{
  position:absolute;
  inset:0;
  transition:background .25s ease;
}
.photo-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.03) 20%,
      rgba(0,0,0,.05) 42%,
      rgba(8,7,17,.15) 63%,
      rgba(8,7,17,.93) 100%
    );
}
/* временный персонаж */
.person{
  position:absolute;
  z-index:2;
  left:50%;
  top:43%;
  width:220px;
  height:330px;
  transform:translate(-50%,-50%);
}
.head{
  position:absolute;
  top:0;
  left:50%;
  width:112px;
  height:132px;
  transform:translateX(-50%);
  border-radius:52% 52% 48% 48%;
  background:
    linear-gradient(
      145deg,
      #d1afc0,
      #725b7e
    );
}
.body{
  position:absolute;
  bottom:0;
  left:50%;
  width:220px;
  height:215px;
  transform:translateX(-50%);
  border-radius:120px 120px 20px 20px;
  background:
    linear-gradient(
      145deg,
      #30233e,
      #0c0d15
    );
}
/* ================= PHOTO PROGRESS ================= */
.photo-progress{
  position:absolute;
  z-index:20;
  top:11px;
  left:15px;
  right:15px;
  display:flex;
  gap:4px;
}
.photo-progress span{
  flex:1;
  height:3px;
  border-radius:10px;
  background:rgba(255,255,255,.3);
}
.photo-progress span.active{
  background:#fff;
}
/* ================= PHOTO ZONES ================= */
.photo-zone{
  position:absolute;
  z-index:18;
  top:0;
  bottom:0;
  width:28%;
}
.photo-zone.left{
  left:0;
}
.photo-zone.right{
  right:0;
}
/* ================= FILTER ================= */
.card-filter{
  position:absolute;
  z-index:35;
  top:20px;
  left:16px;
  padding:9px 12px;
  border-radius:13px;
  color:#eeeaf5;
  background:rgba(7,7,13,.6);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(13px);
  font-size:12px;
  font-weight:800;
}
/* ================= REPORT ================= */
.report{
  position:absolute;
  z-index:35;
  top:20px;
  right:16px;
  width:39px;
  height:39px;
  border-radius:13px;
  color:#ddd9e4;
  background:rgba(7,7,13,.58);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(12px);
}
/* ================= PROFILE INFO ================= */
.profile-info{
  position:absolute;
  z-index:22;
  left:19px;
  right:19px;
  bottom:21px;
  padding-right:5px;
  pointer-events:none;
}
.name-line{
  display:flex;
  align-items:baseline;
  gap:8px;
}
.name{
  font-size:31px;
  font-weight:900;
}
.age{
  font-size:19px;
  color:#d0cad9;
}
.city{
  margin-top:3px;
  color:#c2bccd;
  font-size:13px;
}
.distance{
  margin-top:5px;
  color:#bda8f3;
  font-size:12px;
  font-weight:700;
}
.status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:6px;
  color:#c6c0d0;
  font-size:11px;
  font-weight:700;
}
.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:
    0 0 8px rgba(105,230,167,.65);
}
.status-dot.offline{
  opacity:.3;
  box-shadow:none;
}
.bio{
  margin-top:10px;
  color:#ddd9e5;
  font-size:14px;
  line-height:1.4;
  max-height:100px;
  overflow:hidden;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.tag{
  padding:6px 9px;
  border-radius:999px;
  color:#cbb9ff;
  background:rgba(139,92,246,.13);
  border:1px solid rgba(139,92,246,.22);
  font-size:10px;
  font-weight:700;
}
/* ================= BOTTOM FADE ================= */
.card-bottom-fade{
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  bottom:0;
  height:190px;
  pointer-events:none;
  background:
    linear-gradient(
      to top,
      rgba(8,7,17,.98) 0%,
      rgba(8,7,17,.83) 35%,
      rgba(8,7,17,.3) 70%,
      transparent 100%
    );
}
/* ================= ACTIONS INSIDE CARD ================= */
.card-actions{
  position:absolute;
  z-index:45;
  left:17px;
  right:17px;
  bottom:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:17px;
}
.action{
  width:52px;
  height:52px;
  border-radius:50%;
  color:#fff;
  background:rgba(20,17,31,.86);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    0 10px 25px rgba(0,0,0,.35);
  transition:
    transform .12s ease;
}
.action:active{
  transform:scale(.88);
}
.action.dislike{
  color:var(--red);
}
.action.comment{
  width:61px;
  height:61px;
  color:white;
  background:
    linear-gradient(
      145deg,
      var(--purple),
      var(--pink)
    );
  box-shadow:
    0 12px 35px rgba(139,92,246,.4);
}
.action.like{
  color:#ff6f95;
}
/* ================= DETAILS SHEET ================= */
.details-overlay{
  position:absolute;
  z-index:100;
  inset:0;
  display:flex;
  align-items:flex-end;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(5px);
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
}
.details-overlay.open{
  opacity:1;
  pointer-events:auto;
}
.details-sheet{
  width:100%;
  height:88%;
  overflow-y:auto;
  padding:22px 19px 30px;
  border-radius:29px 29px 0 0;
  background:
    linear-gradient(
      145deg,
      #171326,
      #0f1019
    );
  border:1px solid rgba(255,255,255,.1);
  transform:translateY(100%);
  transition:
    transform .48s cubic-bezier(.22,.8,.22,1);
}
.details-overlay.open .details-sheet{
  transform:translateY(0);
}
.details-handle{
  width:43px;
  height:4px;
  margin:0 auto 18px;
  border-radius:20px;
  background:rgba(255,255,255,.2);
}
.details-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.details-name{
  font-size:25px;
  font-weight:900;
}
.details-sub{
  margin-top:4px;
  color:#9e98ae;
  font-size:12px;
}
.details-close{
  width:39px;
  height:39px;
  border-radius:13px;
  color:#eee;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
}
.detail-heading{
  margin-top:23px;
  margin-bottom:11px;
  color:#8f899e;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.7px;
}
.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.detail-item{
  min-height:61px;
  padding:10px 11px;
  border-radius:15px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);
}
.detail-icon{
  font-size:16px;
}
.detail-label{
  margin-top:4px;
  color:#817b8f;
  font-size:9px;
}
.detail-value{
  margin-top:2px;
  color:#eeeaf3;
  font-size:12px;
  font-weight:700;
}
.detail-bio{
  padding:13px;
  border-radius:15px;
  color:#ddd9e5;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);
  font-size:13px;
  line-height:1.5;
}
.interest-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.interest{
  padding:8px 10px;
  border-radius:10px;
  color:#c8b7f7;
  background:rgba(139,92,246,.12);
  border:1px solid rgba(139,92,246,.2);
  font-size:10px;
  font-weight:700;
}
/* ================= SWIPE LABELS ================= */
.swipe-label{
  position:absolute;
  z-index:60;
  top:42%;
  padding:9px 14px;
  border-radius:12px;
  font-weight:900;
  letter-spacing:1px;
  opacity:0;
  pointer-events:none;
}
.like-label{
  left:22px;
  color:var(--green);
  border:2px solid var(--green);
  transform:rotate(-12deg);
}
.nope-label{
  right:22px;
  color:var(--red);
  border:2px solid var(--red);
  transform:rotate(12deg);
}
/* ================= EMPTY ================= */
.empty{
  position:absolute;
  inset:0;
  border-radius:30px;
  background:#11101b;
  border:1px solid var(--line);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}
.empty-title{
  font-size:24px;
  font-weight:900;
}
.empty-text{
  margin-top:9px;
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}
/* ================= BOTTOM NAV ================= */
.bottom-nav{
  height:67px;
  flex-shrink:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  align-items:center;
  padding:5px 5px 7px;
  margin-top:4px;
  border-top:1px solid rgba(255,255,255,.06);
  background:
    linear-gradient(
      to top,
      rgba(8,7,17,.98),
      rgba(8,7,17,.82)
    );
}
.nav-item{
  height:55px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  color:#777181;
  background:transparent;
  border-radius:15px;
  font-size:10px;
  font-weight:700;
  pointer-events:none;
}
.nav-icon{
  font-size:20px;
  line-height:1;
}
.nav-item.active{
  color:#eeeaf6;
}
.nav-item.active .nav-icon{
  color:var(--purple);
}
/* ================= SHEETS ================= */
.overlay{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px);
}
.overlay.open{
  display:flex;
}
.sheet{
  width:min(620px,100%);
  max-height:90%;
  overflow-y:auto;
  padding:21px;
  border-radius:28px 28px 0 0;
  background:
    linear-gradient(
      145deg,
      #171326,
      #0f1019
    );
  border:1px solid var(--line);
}
.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.sheet-title{
  font-size:23px;
  font-weight:900;
}
.close{
  width:40px;
  height:40px;
  border-radius:13px;
  background:rgba(255,255,255,.05);
  color:white;
  border:1px solid var(--line);
}
.field{
  margin-top:15px;
}
.field-label{
  color:var(--muted);
  font-size:12px;
}
/* ================= AGE SLIDER ================= */
.age-values{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  color:#eeeaf4;
  font-size:13px;
  font-weight:800;
}
.range-wrap{
  position:relative;
  margin-top:12px;
}
input[type="range"]{
  width:100%;
  margin:0;
  appearance:none;
  height:4px;
  border-radius:10px;
  outline:none;
  background:
    linear-gradient(
      to right,
      var(--purple),
      var(--pink)
    );
}
input[type="range"]::-webkit-slider-thumb{
  appearance:none;
  width:23px;
  height:23px;
  border-radius:50%;
  background:#fff;
  border:3px solid var(--purple);
  box-shadow:
    0 0 0 4px rgba(139,92,246,.18);
}
input[type="range"]::-moz-range-thumb{
  width:23px;
  height:23px;
  border-radius:50%;
  background:#fff;
  border:3px solid var(--purple);
}
select,textarea{
  width:100%;
  margin-top:7px;
  padding:13px;
  color:white;
  background:#191526;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
}
textarea{
  height:110px;
  resize:none;
}
.primary{
  width:100%;
  margin-top:18px;
  padding:14px;
  border-radius:15px;
  color:white;
  font-weight:800;
  background:
    linear-gradient(
      100deg,
      var(--purple),
      var(--pink)
    );
}
.secondary{
  width:100%;
  margin-top:8px;
  padding:13px;
  border-radius:15px;
  color:#ddd8e7;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  font-weight:700;
}
.report-option{
  width:100%;
  margin-top:8px;
  padding:14px;
  text-align:left;
  border-radius:14px;
  color:white;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
}
.counter{
  margin-top:5px;
  color:#716b7d;
  text-align:right;
  font-size:10px;
}
/* ================= TOAST ================= */
.toast{
  position:fixed;
  z-index:300;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  padding:11px 16px;
  border-radius:999px;
  background:#f4f3f7;
  color:#15131b;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
}
.toast.show{
  opacity:1;
}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <header class="header">
<div class="logo">
  SEY<span>F</span>ERT
</div>
  </header>
  <!-- MAIN -->
  <main class="main">
<div class="card-area" id="cardArea"></div>
<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active">
    <span class="nav-icon">♡</span>
    <span>Анкеты</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">💬</span>
    <span>Чаты</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">◉</span>
    <span>Глобал</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">◯</span>
    <span>Профиль</span>
  </button>
</nav>
  </main>
</div>
<!-- FILTER -->
<div class="overlay" id="filterOverlay">
  <div class="sheet">
<div class="sheet-head">
  <div class="sheet-title">
    Фильтры
  </div>
  <button
    class="close"
    data-close="filterOverlay">
    ✕
  </button>
</div>
<div class="field">
  <div class="field-label">
    Возраст
  </div>
  <div class="age-values">
    <span id="ageMinValue">
      18
    </span>
    <span>—</span>
    <span id="ageMaxValue">
      60
    </span>
  </div>
  <div class="range-wrap">
    <input
      type="range"
      id="ageMin"
      min="18"
      max="60"
      value="18"
    >
    <input
      type="range"
      id="ageMax"
      min="18"
      max="60"
      value="60"
      style="margin-top:10px"
    >
  </div>
</div>
<div class="field">
  <div class="field-label">
    Пол
  </div>
  <select id="gender">
    <option value="all">
      Все
    </option>
    <option value="female">
      Девушки
    </option>
    <option value="male">
      Парни
    </option>
  </select>
</div>
<div class="field">
  <div class="field-label">
    Город
  </div>
  <select id="city">
    <option value="all">
      Любой город
    </option>
    <option value="Москва">
      Москва
    </option>
    <option value="Санкт-Петербург">
      Санкт-Петербург
    </option>
    <option value="Казань">
      Казань
    </option>
    <option value="Екатеринбург">
      Екатеринбург
    </option>
  </select>
</div>
<div class="field">
  <div class="field-label">
    Интересы
  </div>
  <select id="interest">
    <option value="all">
      Любые интересы
    </option>
    <option value="Готовка">
      Готовка
    </option>
    <option value="ПК игры">
      ПК игры
    </option>
    <option value="Кошки">
      Кошки
    </option>
    <option value="Музыка">
      Музыка
    </option>
    <option value="Кино">
      Кино
    </option>
    <option value="Спорт">
      Спорт
    </option>
    <option value="Технологии">
      Технологии
    </option>
    <option value="Путешествия">
      Путешествия
    </option>
  </select>
</div>
<button
  class="primary"
  id="applyFilters">
  Применить
</button>
<button
  class="secondary"
  id="resetFilters">
  Сбросить фильтры
</button>
  </div>
</div>
<!-- COMMENT -->
<div class="overlay" id="commentOverlay">
  <div class="sheet">
<div class="sheet-head">
  <div class="sheet-title">
    Лайк с комментарием
  </div>
  <button
    class="close"
    data-close="commentOverlay">
    ✕
  </button>
</div>
<div class="field">
  <div class="field-label">
    Сообщение
  </div>
  <textarea
    id="commentInput"
    maxlength="180"
    placeholder="Например: «Тоже люблю такую музыку»"></textarea>
  <div
    class="counter"
    id="counter">
    0 / 180
  </div>
</div>
<button
  class="primary"
  id="sendComment">
  Отправить лайк ❤️
</button>
  </div>
</div>
<!-- REPORT -->
<div class="overlay" id="reportOverlay">
  <div class="sheet">
<div class="sheet-head">
  <div class="sheet-title">
    Пожаловаться
  </div>
  <button
    class="close"
    data-close="reportOverlay">
    ✕
  </button>
</div>
<button
  class="report-option"
  data-report="Спам">
  🚫 Спам
</button>
<button
  class="report-option"
  data-report="Оскорбление">
  ⚠️ Оскорбление
</button>
<button
  class="report-option"
  data-report="Неприемлемый контент">
  🔞 Неприемлемый контент
</button>
<button
  class="report-option"
  data-report="Фейковый профиль">
  👤 Фейковый профиль
</button>
<button
  class="report-option"
  data-report="Другое">
  ••• Другое
</button>
  </div>
</div>
<div
  class="toast"
  id="toast"></div>
<script>
/* =========================================================
   ТЕСТОВЫЕ АНКЕТЫ
========================================================= */
const profiles=[
  {
    id:1,
    name:"Алина",
    age:21,
    gender:"female",
    city:"Санкт-Петербург",
    distance:3,
    online:true,
    photos:[
      "photo1",
      "photo2",
      "photo3"
    ],
    bio:
      "Люблю музыку, прогулки по ночному городу и разговоры до утра.",
    interests:[
      "Музыка",
      "Кино",
      "Dota 2"
    ],
    details:{
      weight:"54 кг",
      income:"100–150 тыс. ₽",
      onlineTime:"18:00–01:00",
      children:"Нет детей",
      smoking:"Не курю",
      alcohol:"Иногда",
      personality:"INFJ",
      work:"Дизайн"
    }
  },
  {
    id:2,
    name:"Макс",
    age:24,
    gender:"male",
    city:"Москва",
    distance:5,
    online:true,
    photos:[
      "photo1",
      "photo2"
    ],
    bio:
      "Игры, спорт, техника и вечные попытки найти хороший фильм.",
    interests:[
      "Игры",
      "Спорт",
      "Технологии"
    ],
    details:{
      weight:"78 кг",
      income:"150–200 тыс. ₽",
      onlineTime:"20:00–03:00",
      children:"Нет детей",
      smoking:"Не курю",
      alcohol:"Редко",
      personality:"ENTP",
      work:"IT"
    }
  },
  {
    id:3,
    name:"София",
    age:22,
    gender:"female",
    city:"Казань",
    distance:8,
    online:false,
    photos:[
      "photo1",
      "photo2",
      "photo3",
      "photo4"
    ],
    bio:
      "Фотография, путешествия и кофе.",
    interests:[
      "Фото",
      "Путешествия",
      "Музыка"
    ],
    details:{
      weight:"58 кг",
      income:"Не указано",
      onlineTime:"17:00–00:00",
      children:"Нет детей",
      smoking:"Не курю",
      alcohol:"Иногда",
      personality:"ENFP",
      work:"Маркетинг"
    }
  }
];
let activeProfiles=[...profiles];
let index=0;
let current=null;
let photoIndex=0;
let locked=false;
let pointer=false;
let startX=0;
let startY=0;
let dx=0;
let dy=0;
const area=
  document.getElementById("cardArea");
/* =========================================================
   RENDER
========================================================= */
function render(){
  area.innerHTML="";
  if(index>=activeProfiles.length){
    area.innerHTML=`
      <div class="empty">
        <div>
          <div style="font-size:48px">
            ✨
          </div>
          <div class="empty-title">
            Анкеты закончились
          </div>
          <div class="empty-text">
            Попробуй изменить фильтры —
            возможно, там есть кто-то ещё.
          </div>
        </div>
      </div>
    `;
    current=null;
    return;
  }
  current=
    activeProfiles[index];
  photoIndex=0;
  locked=false;
  const card=
    document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <div class="photo">
      <div
        class="photo-bg"
        id="photoBg">
      </div>
      <div class="person">
        <div class="head"></div>
        <div class="body"></div>
      </div>
    </div>
    <div
      class="photo-progress"
      id="progress">
      ${
        current.photos.map(
          (_,i)=>
          `
          <span
            class="${i===0?"active":""}">
          </span>
          `
        ).join("")
      }
    </div>
    <div
      class="photo-zone left"
      id="leftPhoto">
    </div>
    <div
      class="photo-zone right"
      id="rightPhoto">
    </div>
    <button
      class="card-filter"
      id="cardFilter">
      ⚙ Фильтр
    </button>
    <button
      class="report"
      id="report">
      ⚑
    </button>
    <div
      class="swipe-label like-label"
      id="likeLabel">
      LIKE
    </div>
    <div
      class="swipe-label nope-label"
      id="nopeLabel">
      NOPE
    </div>
    <div class="card-bottom-fade"></div>
    <div class="profile-info">
      <div class="name-line">
        <div class="name">
          ${safe(current.name)}
        </div>
        <div class="age">
          ${current.age}
        </div>
      </div>
      <div class="city">
        📍 ${safe(current.city)}
      </div>
      <div class="distance">
        📍 ${current.distance} км от вас
      </div>
      <div class="status">
        <span
          class="status-dot ${
            current.online ? "" : "offline"
          }">
        </span>
        ${
          current.online
          ? "Сейчас онлайн"
          : "Был(а) недавно"
        }
      </div>
      <div class="bio">
        ${safe(current.bio)}
      </div>
      <div class="tags">
        ${
          current.interests.map(
            x=>
            `
            <span class="tag">
              ${safe(x)}
            </span>
            `
          ).join("")
        }
      </div>
    </div>
    <div class="card-actions">
      <button
        class="action dislike"
        id="dislike">
        ✕
      </button>
      <button
        class="action comment"
        id="comment">
        💬
      </button>
      <button
        class="action like"
        id="like">
        ♥
      </button>
    </div>
    <!-- ПОДРОБНАЯ ИНФОРМАЦИЯ -->
    <div
      class="details-overlay"
      id="detailsOverlay">
      <div
        class="details-sheet">
        <div class="details-handle"></div>
        <div class="details-head">
          <div>
            <div class="details-name">
              ${safe(current.name)}, ${current.age}
            </div>
            <div class="details-sub">
              📍 ${safe(current.city)}
              · ${current.distance} км от вас
            </div>
            <div class="details-sub">
              ${
                current.online
                ? "● Сейчас онлайн"
                : "● Был(а) недавно"
              }
            </div>
          </div>
          <button
            class="details-close"
            id="detailsClose">
            ↓
          </button>
        </div>
        <div class="detail-heading">
          О пользователе
        </div>
        <div class="detail-grid">
          ${detail(
            "⚖️",
            "Вес",
            current.details.weight
          )}
          ${detail(
            "💰",
            "Заработок",
            current.details.income
          )}
          ${detail(
            "🕐",
            "Обычно в сети",
            current.details.onlineTime
          )}
          ${detail(
            "👶",
            "Дети",
            current.details.children
          )}
          ${detail(
            "🚬",
            "Курение",
            current.details.smoking
          )}
          ${detail(
            "🍷",
            "Алкоголь",
            current.details.alcohol
          )}
          ${detail(
            "🧠",
            "Тип личности",
            current.details.personality
          )}
          ${detail(
            "💼",
            "Занятость",
            current.details.work
          )}
        </div>
        <div class="detail-heading">
          Биография
        </div>
        <div class="detail-bio">
          ${safe(current.bio)}
        </div>
        <div class="detail-heading">
          Интересы
        </div>
        <div class="interest-list">
          ${
            current.interests.map(
              x=>
              `
              <span class="interest">
                ${safe(x)}
              </span>
              `
            ).join("")
          }
        </div>
        <div style="height:120px"></div>
      </div>
    </div>
  `;
  area.appendChild(card);
  updatePhoto();
  bindCard(card);
}
/* =========================================================
   DETAIL ITEM
========================================================= */
function detail(
  icon,
  label,
  value
){
  return`
    <div class="detail-item">
      <div class="detail-icon">
        ${icon}
      </div>
      <div class="detail-label">
        ${label}
      </div>
      <div class="detail-value">
        ${safe(value)}
      </div>
    </div>
  `;
}
/* =========================================================
   PHOTO
========================================================= */
function updatePhoto(){
  if(!current)
    return;
  const bg=
    document.getElementById("photoBg");
  if(!bg)
    return;
  const hue=
    current.id*53+
    photoIndex*43;
  bg.style.background=`
    radial-gradient(
      circle at ${25+photoIndex*12}% 20%,
      hsla(${hue},75%,65%,.5),
      transparent 30%
    ),
    radial-gradient(
      circle at ${80-photoIndex*9}% 20%,
      rgba(217,70,239,.38),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      hsl(${hue},35%,27%),
      #090a12
    )
  `;
  document
    .querySelectorAll("#progress span")
    .forEach(
      (x,i)=>{
        x.classList.toggle(
          "active",
          i===photoIndex
        );
      }
    );
}
function nextPhoto(){
  if(
    !current ||
    photoIndex>=current.photos.length-1
  )
    return;
  photoIndex++;
  updatePhoto();
}
function previousPhoto(){
  if(
    !current ||
    photoIndex<=0
  )
    return;
  photoIndex--;
  updatePhoto();
}
/* =========================================================
   CARD BIND
========================================================= */
function bindCard(card){
  const left=
    card.querySelector("#leftPhoto");
  const right=
    card.querySelector("#rightPhoto");
  const report=
    card.querySelector("#report");
  const filter=
    card.querySelector("#cardFilter");
  const like=
    card.querySelector("#like");
  const dislike=
    card.querySelector("#dislike");
  const comment=
    card.querySelector("#comment");
  const detailsOverlay=
    card.querySelector("#detailsOverlay");
  const detailsSheet=
    card.querySelector(".details-sheet");
  const detailsClose=
    card.querySelector("#detailsClose");
  /* фотографии */
  left.onclick=e=>{
    e.stopPropagation();
    if(!pointer)
      previousPhoto();
  };
  right.onclick=e=>{
    e.stopPropagation();
    if(!pointer)
      nextPhoto();
  };
  /* фильтр */
  filter.onclick=e=>{
    e.stopPropagation();
    open("filterOverlay");
  };
  /* жалоба */
  report.onclick=e=>{
    e.stopPropagation();
    open("reportOverlay");
  };
  /* реакции */
  like.onclick=e=>{
    e.stopPropagation();
    likeProfile();
  };
  dislike.onclick=e=>{
    e.stopPropagation();
    dislikeProfile();
  };
  comment.onclick=e=>{
    e.stopPropagation();
    if(!current)
      return;
    open("commentOverlay");
    setTimeout(
      ()=>{
        document
          .getElementById("commentInput")
          .focus();
      },
      120
    );
  };
  /* подробная информация */
  card.addEventListener(
    "click",
    e=>{
      if(
        Math.abs(dx)>15 ||
        Math.abs(dy)>15
      )
        return;
      if(
        e.target.closest(".photo-zone") ||
        e.target.closest(".report") ||
        e.target.closest(".card-filter") ||
        e.target.closest(".card-actions")
      )
        return;
      detailsOverlay.classList.add("open");
    }
  );
  detailsClose.onclick=e=>{
    e.stopPropagation();
    detailsOverlay.classList.remove("open");
  };
  /* закрытие нажатием на затемнение */
  detailsOverlay.onclick=e=>{
    if(e.target===detailsOverlay){
      detailsOverlay.classList.remove(
        "open"
      );
    }
  };
  /*
    Не позволяем свайпу
    сработать при прокрутке
    подробной информации.
  */
  detailsSheet.addEventListener(
    "pointerdown",
    e=>{
      e.stopPropagation();
    }
  );
  detailsSheet.addEventListener(
    "pointermove",
    e=>{
      e.stopPropagation();
    }
  );
  detailsSheet.addEventListener(
    "pointerup",
    e=>{
      e.stopPropagation();
    }
  );
  /* pointer */
  card.addEventListener(
    "pointerdown",
    e=>{
      if(locked)
        return;
      pointer=true;
      startX=e.clientX;
      startY=e.clientY;
      dx=0;
      dy=0;
      card.style.transition="none";
      card.setPointerCapture(
        e.pointerId
      );
    }
  );
  card.addEventListener(
    "pointermove",
    e=>{
      if(
        !pointer ||
        locked
      )
        return;
      dx=
        e.clientX-startX;
      dy=
        e.clientY-startY;
      const rotation=
        dx/18;
      card.style.transform=
        `
        translateX(${dx}px)
        rotate(${rotation}deg)
        `;
      card.querySelector(
        "#likeLabel"
      ).style.opacity=
        dx>20
        ?Math.min(dx/100,1)
        :0;
      card.querySelector(
        "#nopeLabel"
      ).style.opacity=
        dx<-20
        ?Math.min(
          Math.abs(dx)/100,
          1
        )
        :0;
    }
  );
  card.addEventListener(
    "pointerup",
    ()=>finishSwipe(card)
  );
  card.addEventListener(
    "pointercancel",
    ()=>finishSwipe(card)
  );
}
/* =========================================================
   SWIPE
========================================================= */
function finishSwipe(card){
  if(!pointer)
    return;
  pointer=false;
  card.style.transition=
    `
    transform .3s
      cubic-bezier(.2,.8,.2,1),
    opacity .3s ease
    `;
  if(Math.abs(dx)>100){
    if(dx>0)
      likeProfile();
    else
      dislikeProfile();
    return;
  }
  card.style.transform=
    "translateX(0) rotate(0)";
  dx=0;
  dy=0;
}
/* =========================================================
   LIKE / DISLIKE
========================================================= */
function likeProfile(){
  if(
    locked ||
    !current
  )
    return;
  locked=true;
  const card=
    document.getElementById("card");
  card.style.transform=
    "translateX(700px) rotate(18deg)";
  card.style.opacity="0";
  toast(
    `Лайк отправлен: ${current.name} ❤️`
  );
  setTimeout(
    nextProfile,
    320
  );
}
function dislikeProfile(){
  if(
    locked ||
    !current
  )
    return;
  locked=true;
  const card=
    document.getElementById("card");
  card.style.transform=
    "translateX(-700px) rotate(-18deg)";
  card.style.opacity="0";
  toast(
    "Анкета пропущена"
  );
  setTimeout(
    nextProfile,
    320
  );
}
function nextProfile(){
  index++;
  render();
}
/* =========================================================
   FILTERS
========================================================= */
const ageMin=
  document.getElementById("ageMin");
const ageMax=
  document.getElementById("ageMax");
const ageMinValue=
  document.getElementById("ageMinValue");
const ageMaxValue=
  document.getElementById("ageMaxValue");
function updateAgeLabels(){
  let min=
    Number(ageMin.value);
  let max=
    Number(ageMax.value);
  if(min>max){
    if(
      document.activeElement===ageMin
    ){
      min=max;
      ageMin.value=min;
    }else{
      max=min;
      ageMax.value=max;
    }
  }
  ageMinValue.textContent=min;
  ageMaxValue.textContent=max;
}
ageMin.oninput=
  updateAgeLabels;
ageMax.oninput=
  updateAgeLabels;
document
  .getElementById("applyFilters")
  .onclick=()=>{
    const min=
      Number(ageMin.value);
    const max=
      Number(ageMax.value);
    const gender=
      document.getElementById(
        "gender"
      ).value;
    const city=
      document.getElementById(
        "city"
      ).value;
    const interest=
      document.getElementById(
        "interest"
      ).value;
    activeProfiles=
      profiles.filter(
        p=>{
          const ageOK=
            p.age>=min &&
            p.age<=max;
          const genderOK=
            gender==="all" ||
            p.gender===gender;
          const cityOK=
            city==="all" ||
            p.city===city;
          const interestOK=
            interest==="all" ||
            p.interests.includes(
              interest
            );
          return(
            ageOK &&
            genderOK &&
            cityOK &&
            interestOK
          );
        }
      );
    index=0;
    close("filterOverlay");
    render();
    toast(
      `Найдено анкет: ${activeProfiles.length}`
    );
  };
/* =========================================================
   RESET FILTERS
========================================================= */
document
  .getElementById("resetFilters")
  .onclick=()=>{
    ageMin.value=18;
    ageMax.value=60;
    document
      .getElementById("gender")
      .value="all";
    document
      .getElementById("city")
      .value="all";
    document
      .getElementById("interest")
      .value="all";
    updateAgeLabels();
    activeProfiles=
      [...profiles];
    index=0;
    close("filterOverlay");
    render();
    toast(
      "Фильтры сброшены"
    );
  };
/* =========================================================
   COMMENT
========================================================= */
const commentInput=
  document.getElementById(
    "commentInput"
  );
commentInput.oninput=()=>{
  document
    .getElementById("counter")
    .textContent=
    `
    ${commentInput.value.length} / 180
    `;
};
document
  .getElementById("sendComment")
  .onclick=()=>{
    const text=
      commentInput.value.trim();
    close("commentOverlay");
    commentInput.value="";
    document
      .getElementById("counter")
      .textContent=
      "0 / 180";
    toast(
      text
      ? "Лайк с комментарием отправлен ❤️"
      : "Лайк отправлен ❤️"
    );
  };
/* =========================================================
   REPORT
========================================================= */
document
  .querySelectorAll("[data-report]")
  .forEach(
    button=>{
      button.onclick=()=>{
        close("reportOverlay");
        toast(
          `Жалоба отправлена: ${button.dataset.report}`
        );
      };
    }
  );
/* =========================================================
   OVERLAYS
========================================================= */
function open(id){
  document
    .getElementById(id)
    .classList.add("open");
}
function close(id){
  document
    .getElementById(id)
    .classList.remove("open");
}
document
  .querySelectorAll("[data-close]")
  .forEach(
    button=>{
      button.onclick=()=>{
        close(
          button.dataset.close
        );
      };
    }
  );
document
  .querySelectorAll(".overlay")
  .forEach(
    overlay=>{
      overlay.onclick=e=>{
        if(
          e.target===overlay
        ){
          overlay.classList.remove(
            "open"
          );
        }
      };
    }
  );
/* =========================================================
   TOAST
========================================================= */
let toastTimer;
function toast(message){
  const el=
    document.getElementById(
      "toast"
    );
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(
    toastTimer
  );
  toastTimer=
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      1900
    );
}
/* =========================================================
   SAFE
========================================================= */
function safe(value){
  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}
/* =========================================================
   START
========================================================= */
updateAgeLabels();
render();
</script>
</body>
</html>
