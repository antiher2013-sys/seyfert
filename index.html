<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05060b">
  <title>Seyfert</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #05060b;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    /* =========================
       ФОН
    ========================= */

    .space {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(100, 55, 255, 0.18),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 75%,
          rgba(0, 170, 255, 0.13),
          transparent 38%
        ),
        #05060b;
      z-index: 0;
      pointer-events: none;
    }

    .nebula {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
    }

    .nebula.one {
      background: #6c35ff;
      top: -230px;
      left: -190px;
      animation: nebulaOne 18s ease-in-out infinite alternate;
    }

    .nebula.two {
      background: #009dff;
      right: -230px;
      bottom: -220px;
      animation: nebulaTwo 22s ease-in-out infinite alternate;
    }

    @keyframes nebulaOne {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(80px, 70px) scale(1.18);
      }
    }

    @keyframes nebulaTwo {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(-70px, -50px) scale(1.2);
      }
    }

    .stars {
      position: absolute;
      inset: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 6px currentColor;
      animation-name: starFloat;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }

    @keyframes starFloat {
      from {
        transform: translate(0, 0);
        opacity: 0.25;
      }

      to {
        transform: translate(var(--move-x), var(--move-y));
        opacity: var(--max-opacity);
      }
    }

    /* =========================
       ПРИЛОЖЕНИЕ
    ========================= */

    .app {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 480px;
      min-height: 100vh;

      margin: 0 auto;
      padding: 24px 20px 32px;
    }

    /* =========================
       ВЕРХ
    ========================= */

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 48px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;

      text-shadow:
        0 0 12px rgba(135, 90, 255, 0.8),
        0 0 28px rgba(90, 80, 255, 0.35);
    }

    .profile {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(18, 20, 32, 0.75);
      border: 1px solid rgba(150, 125, 255, 0.5);

      box-shadow:
        0 0 14px rgba(130, 80, 255, 0.35),
        inset 0 0 15px rgba(130, 80, 255, 0.08);

      backdrop-filter: blur(10px);
    }

    /* =========================
       ТЕКСТ
    ========================= */

    .hello {
      color: #858897;
      font-size: 14px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;

      font-size: 38px;
      line-height: 1.05;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 15px 0 32px;

      color: #9799a8;
      font-size: 16px;
      line-height: 1.5;
    }

    /* =========================
       КАРТОЧКИ
    ========================= */

    .cards {
      display: grid;
      gap: 18px;
    }

    .card {
      position: relative;

      width: 100%;
      min-height: 160px;

      padding: 24px;

      border-radius: 26px;
      border: 1px solid;

      color: white;
      text-align: left;

      cursor: pointer;

      overflow: hidden;

      transition:
        transform 0.2s ease,
        filter 0.2s ease;
    }

    .card:active {
      transform: scale(0.975);
      filter: brightness(1.2);
    }

    .dating {
      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(255, 100, 220, 0.20),
          transparent 30%
        ),
        rgba(90, 45, 180, 0.25);

      border-color: rgba(190, 110, 255, 0.65);

      box-shadow:
        0 0 12px rgba(155, 70, 255, 0.55),
        0 0 35px rgba(125, 50, 255, 0.20),
        inset 0 0 30px rgba(190, 80, 255, 0.08);

      animation: purpleGlow 4s ease-in-out infinite;
    }

    .gaming {
      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(80, 240, 255, 0.20),
          transparent 30%
        ),
        rgba(0, 100, 180, 0.24);

      border-color: rgba(55, 205, 255, 0.65);

      box-shadow:
        0 0 12px rgba(0, 185, 255, 0.55),
        0 0 35px rgba(0, 150, 255, 0.20),
        inset 0 0 30px rgba(0, 200, 255, 0.08);

      animation: blueGlow 4s ease-in-out infinite;
      animation-delay: -1.5s;
    }

    @keyframes purpleGlow {
      0%, 100% {
        box-shadow:
          0 0 10px rgba(155, 70, 255, 0.45),
          0 0 28px rgba(125, 50, 255, 0.16),
          inset 0 0 25px rgba(190, 80, 255, 0.07);
      }

      50% {
        box-shadow:
          0 0 18px rgba(180, 80, 255, 0.75),
          0 0 45px rgba(145, 60, 255, 0.28),
          inset 0 0 35px rgba(210, 100, 255, 0.11);
      }
    }

    @keyframes blueGlow {
      0%, 100% {
        box-shadow:
          0 0 10px rgba(0, 185, 255, 0.45),
          0 0 28px rgba(0, 150, 255, 0.16),
          inset 0 0 25px rgba(0, 200, 255, 0.07);
      }

      50% {
        box-shadow:
          0 0 18px rgba(0, 210, 255, 0.75),
          0 0 45px rgba(0, 170, 255, 0.28),
          inset 0 0 35px rgba(0, 220, 255, 0.11);
      }
    }

    .card-icon {
      font-size: 31px;
      margin-bottom: 16px;

      filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.55));
    }

    .card-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .card-text {
      color: rgba(255,255,255,0.68);
      font-size: 14px;
    }

    .arrow {
      position: absolute;
      right: 22px;
      bottom: 20px;

      font-size: 26px;
      opacity: 0.8;

      text-shadow:
        0 0 10px rgba(255,255,255,0.7);
    }

    /* =========================
       АКТИВНОСТИ
    ========================= */

    .section {
      margin-top: 34px;
    }

    .section-title {
      margin-bottom: 13px;

      font-size: 17px;
      font-weight: 750;
    }

    .activity {
      padding: 19px;

      border-radius: 20px;
      border: 1px solid rgba(130, 135, 170, 0.18);

      background: rgba(15, 17, 27, 0.65);

      color: #858897;
      font-size: 14px;
      line-height: 1.5;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* =========================
       НИЗ
    ========================= */

    .bottom {
      margin-top: 35px;

      text-align: center;

      color: #454754;
      font-size: 12px;
    }

    button {
      font: inherit;
    }
  </style>
</head>

<body>

  <div class="space">

    <div class="nebula one"></div>
    <div class="nebula two"></div>

    <div class="stars" id="stars"></div>

  </div>


  <main class="app">

    <header class="top">

      <div class="brand">
        Seyfert
      </div>

      <div class="profile">
        👤
      </div>

    </header>


    <div class="hello">
      Добро пожаловать
    </div>


    <h1>
      Найди своих людей.
    </h1>


    <p class="subtitle">
      Знакомься, общайся и находи тиммейтов
      в одном пространстве.
    </p>


    <section class="cards">

      <button class="card dating">

        <div class="card-icon">
          💜
        </div>

        <div class="card-title">
          Знакомства
        </div>

        <div class="card-text">
          Находи людей, которые тебе интересны.
        </div>

        <div class="arrow">
          →
        </div>

      </button>


      <button class="card gaming">

        <div class="card-icon">
          🎮
        </div>

        <div class="card-title">
          Игроки
        </div>

        <div class="card-text">
          Ищи тиммейтов и собирай свою команду.
        </div>

        <div class="arrow">
          →
        </div>

      </button>

    </section>


    <section class="section">

      <div class="section-title">
        Активности
      </div>

      <div class="activity">
        Здесь будут появляться события,
        игровые активности и предложения
        сообщества.
      </div>

    </section>


    <div class="bottom">
      Seyfert • 0.4
    </div>

  </main>


  <script>
    const stars = document.getElementById("stars");

    const starCount = 85;

    for (let i = 0; i < starCount; i++) {

      const star = document.createElement("div");

      star.className = "star";

      const size = Math.random() * 2 + 0.7;
      const left = Math.random() * 100;
      const top = Math.random() * 100;

      const duration = Math.random() * 8 + 7;
      const delay = Math.random() * -12;

      const moveX = (Math.random() * 30 - 15).toFixed(1);
      const moveY = (Math.random() * 30 - 15).toFixed(1);

      const opacity = (Math.random() * 0.55 + 0.35).toFixed(2);

      star.style.width = size + "px";
      star.style.height = size + "px";

      star.style.left = left + "%";
      star.style.top = top + "%";

      star.style.color =
        Math.random() > 0.82
          ? "#8edcff"
          : Math.random() > 0.82
          ? "#c7a7ff"
          : "#ffffff";

      star.style.animationDuration = duration + "s";
      star.style.animationDelay = delay + "s";

      star.style.setProperty("--move-x", moveX + "px");
      star.style.setProperty("--move-y", moveY + "px");
      star.style.setProperty("--max-opacity", opacity);

      stars.appendChild(star);
    }
  </script>

</body>
</html>
