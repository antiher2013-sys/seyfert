<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seyfert</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080711;
  --card:#151320;
  --card2:#1b1728;
  --text:#f7f5fb;
  --muted:#9e98ae;
  --purple:#8b5cf6;
  --pink:#d946ef;
  --green:#69e6a7;
  --red:#ff6683;
  --line:rgba(255,255,255,.1);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% -15%,rgba(139,92,246,.25),transparent 42%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

.header{
  height:60px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 15px;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:var(--purple);
}

/* ================= MAIN ================= */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0 11px 7px;
}

.card-area{
  flex:1;
  min-height:0;
  position:relative;
}

/* ================= CARD ================= */

.card{
  position:absolute;
  inset:0;

  overflow:hidden;

  border-radius:32px;

  background:var(--card);

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    0 0 55px rgba(139,92,246,.1);

  touch-action:none;
  user-select:none;

  transition:
    transform .32s cubic-bezier(.2,.8,.2,1),
    opacity .3s ease;
}

/* ================= PHOTO ================= */

.photo{
  position:absolute;
  inset:0;

  transition:
    opacity .38s ease,
    transform .48s cubic-bezier(.22,.8,.22,1);
}

.card.expanded .photo{
  opacity:0;
  transform:scale(1.04);
  pointer-events:none;
}

.photo-bg{
  position:absolute;
  inset:0;
}

.photo-bg::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.04) 20%,
      rgba(0,0,0,.08) 42%,
      rgba(8,7,17,.28) 65%,
      rgba(8,7,17,.94) 100%
    );
}

/* временный персонаж */

.person{
  position:absolute;
  z-index:2;

  left:50%;
  top:43%;

  width:260px;
  height:390px;

  transform:translate(-50%,-50%);
}

.head{
  position:absolute;

  top:0;
  left:50%;

  width:126px;
  height:148px;

  transform:translateX(-50%);

  border-radius:52% 52% 48% 48%;

  background:
    linear-gradient(
      145deg,
      #d1afc0,
      #725b7e
    );
}

.body{
  position:absolute;

  bottom:0;
  left:50%;

  width:260px;
  height:250px;

  transform:translateX(-50%);

  border-radius:140px 140px 25px 25px;

  background:
    linear-gradient(
      145deg,
      #30233e,
      #0c0d15
    );
}

/* ================= PHOTO PROGRESS ================= */

.photo-progress{
  position:absolute;
  z-index:20;

  top:12px;
  left:17px;
  right:17px;

  display:flex;
  gap:4px;
}

.photo-progress span{
  flex:1;

  height:3px;

  border-radius:10px;

  background:rgba(255,255,255,.3);

  transition:
    background .2s ease;
}

.photo-progress span.active{
  background:#fff;
}

/* ================= PHOTO ZONES ================= */

.photo-zone{
  position:absolute;
  z-index:18;

  top:0;
  bottom:0;

  width:28%;
}

.photo-zone.left{
  left:0;
}

.photo-zone.right{
  right:0;
}

/* ================= FILTER ================= */

.card-filter{
  position:absolute;
  z-index:35;

  top:23px;
  left:16px;

  padding:9px 13px;

  border-radius:13px;

  color:#eeeaf5;

  background:rgba(7,7,13,.58);

  border:1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(12px);

  font-size:12px;
  font-weight:800;

  pointer-events:auto;
}

/* ================= REPORT ================= */

.report{
  position:absolute;
  z-index:35;

  top:23px;
  right:16px;

  width:39px;
  height:39px;

  border-radius:13px;

  color:#ddd9e4;

  background:rgba(7,7,13,.58);

  border:1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(12px);
}

/* ================= PROFILE INFO ================= */

.profile-info{
  position:absolute;
  z-index:25;

  left:20px;
  right:20px;
  bottom:112px;

  transition:
    opacity .3s ease,
    transform .4s ease;
}

.card.expanded .profile-info{
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
}

.name-line{
  display:flex;
  align-items:baseline;
  gap:8px;
}

.name{
  font-size:31px;
  font-weight:900;
}

.age{
  font-size:20px;
  color:#d0cad9;
}

.city{
  margin-top:3px;

  color:#c2bccd;

  font-size:13px;
}

.status-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;

  gap:8px;

  margin-top:6px;
}

.distance{
  color:#bda8f3;

  font-size:12px;
  font-weight:700;
}

.status{
  display:flex;
  align-items:center;
  gap:5px;

  color:#c5bfce;

  font-size:11px;
  font-weight:700;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 9px rgba(105,230,167,.7);
}

.status-dot.offline{
  background:#85808d;
  box-shadow:none;
}

.bio{
  margin-top:9px;

  max-width:510px;

  color:#ddd9e5;

  font-size:14px;
  line-height:1.4;

  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.tags{
  display:flex;
  flex-wrap:wrap;

  gap:6px;

  margin-top:10px;
}

.tag{
  padding:6px 9px;

  border-radius:999px;

  color:#cbb9ff;

  background:rgba(139,92,246,.13);

  border:1px solid rgba(139,92,246,.22);

  font-size:10px;
  font-weight:700;
}

/* ================= BOTTOM BLUR ================= */

.card-bottom{
  position:absolute;
  z-index:23;

  left:0;
  right:0;
  bottom:0;

  height:210px;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      transparent 0%,
      rgba(8,7,17,.2) 18%,
      rgba(8,7,17,.78) 62%,
      rgba(8,7,17,.97) 100%
    );

  backdrop-filter:blur(2px);

  mask-image:
    linear-gradient(
      to bottom,
      transparent 0%,
      black 34%,
      black 100%
    );

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      transparent 0%,
      black 34%,
      black 100%
    );
}

/* ================= ACTIONS INSIDE CARD ================= */

.card-actions{
  position:absolute;
  z-index:40;

  left:20px;
  right:20px;
  bottom:19px;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:18px;

  transition:
    opacity .3s ease,
    transform .35s ease;
}

.card.expanded .card-actions{
  opacity:0;
  transform:translateY(25px);
  pointer-events:none;
}

.action{
  width:58px;
  height:58px;

  border-radius:50%;

  color:#fff;

  background:#14111f;

  border:1px solid var(--line);

  box-shadow:
    0 10px 30px rgba(0,0,0,.3);

  transition:
    transform .12s ease;
}

.action:active{
  transform:scale(.88);
}

.action.dislike{
  color:var(--red);
}

.action.comment{
  width:66px;
  height:66px;

  color:white;

  background:
    linear-gradient(
      145deg,
      var(--purple),
      var(--pink)
    );

  box-shadow:
    0 12px 35px rgba(139,92,246,.4);
}

.action.like{
  color:#ff6f95;
}

/* ================= DETAILS ================= */

.details{
  position:absolute;
  z-index:60;

  inset:0;

  overflow-y:auto;

  padding:
    24px
    20px
    28px;

  opacity:0;
  transform:translateY(100%);

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      #151320 0%,
      #11101b 100%
    );

  transition:
    opacity .32s ease,
    transform .48s cubic-bezier(.22,.8,.22,1);
}

.card.expanded .details{
  opacity:1;

  transform:translateY(0);

  pointer-events:auto;
}

/* верх деталей */

.details-header{
  display:flex;

  justify-content:space-between;
  align-items:flex-start;

  gap:15px;

  margin-bottom:22px;
}

.details-title{
  font-size:25px;
  font-weight:900;
}

.details-subtitle{
  margin-top:4px;

  color:#9e98ae;

  font-size:12px;
}

.collapse{
  flex-shrink:0;

  width:40px;
  height:40px;

  border-radius:13px;

  color:#eee;

  background:rgba(255,255,255,.06);

  border:1px solid var(--line);
}

/* информация */

.detail-heading{
  margin:
    0
    0
    11px;

  color:#8f899e;

  font-size:11px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.7px;
}

.detail-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;
}

.detail-item{
  min-height:65px;

  padding:11px;

  border-radius:15px;

  background:
    rgba(255,255,255,.045);

  border:1px solid rgba(255,255,255,.07);

  opacity:0;
  transform:translateY(10px);

  transition:
    opacity .3s ease,
    transform .3s ease;
}

.card.expanded .detail-item{
  opacity:1;
  transform:translateY(0);
}

.card.expanded .detail-item:nth-child(1){
  transition-delay:.05s;
}

.card.expanded .detail-item:nth-child(2){
  transition-delay:.08s;
}

.card.expanded .detail-item:nth-child(3){
  transition-delay:.11s;
}

.card.expanded .detail-item:nth-child(4){
  transition-delay:.14s;
}

.card.expanded .detail-item:nth-child(5){
  transition-delay:.17s;
}

.card.expanded .detail-item:nth-child(6){
  transition-delay:.20s;
}

.card.expanded .detail-item:nth-child(7){
  transition-delay:.23s;
}

.card.expanded .detail-item:nth-child(8){
  transition-delay:.26s;
}

.detail-icon{
  font-size:16px;
}

.detail-label{
  margin-top:4px;

  color:#817b8f;

  font-size:9px;
}

.detail-value{
  margin-top:2px;

  color:#eeeaf3;

  font-size:12px;
  font-weight:700;
}

/* bio */

.full-bio{
  margin-top:20px;

  padding:14px;

  border-radius:16px;

  background:
    rgba(255,255,255,.045);

  border:1px solid rgba(255,255,255,.07);

  color:#ddd9e5;

  font-size:14px;
  line-height:1.55;
}

/* interests */

.interests{
  margin-top:20px;
}

.interest-list{
  display:flex;
  flex-wrap:wrap;

  gap:7px;
}

.interest{
  padding:8px 11px;

  border-radius:10px;

  background:
    rgba(139,92,246,.12);

  color:#c8b7f7;

  border:1px solid rgba(139,92,246,.2);

  font-size:10px;
  font-weight:700;
}

/* ================= SWIPE LABELS ================= */

.swipe-label{
  position:absolute;
  z-index:50;

  top:42%;

  padding:9px 14px;

  border-radius:12px;

  font-weight:900;
  letter-spacing:1px;

  opacity:0;

  pointer-events:none;
}

.like-label{
  left:22px;

  color:var(--green);

  border:2px solid var(--green);

  transform:rotate(-12deg);
}

.nope-label{
  right:22px;

  color:var(--red);

  border:2px solid var(--red);

  transform:rotate(12deg);
}

/* ================= EMPTY ================= */

.empty{
  position:absolute;
  inset:0;

  border-radius:32px;

  background:#11101b;

  border:1px solid var(--line);

  display:flex;

  justify-content:center;
  align-items:center;

  text-align:center;

  padding:30px;
}

.empty-title{
  font-size:24px;
  font-weight:900;
}

.empty-text{
  margin-top:9px;

  color:var(--muted);

  line-height:1.5;

  font-size:14px;
}

/* ================= SHEETS ================= */

.overlay{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;

  align-items:flex-end;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(12px);
}

.overlay.open{
  display:flex;
}

.sheet{
  width:min(620px,100%);

  max-height:90%;

  overflow-y:auto;

  padding:21px;

  border-radius:28px 28px 0 0;

  background:
    linear-gradient(
      145deg,
      #171326,
      #0f1019
    );

  border:1px solid var(--line);
}

.sheet-head{
  display:flex;

  justify-content:space-between;
  align-items:center;
}

.sheet-title{
  font-size:23px;
  font-weight:900;
}

.close{
  width:40px;
  height:40px;

  border-radius:13px;

  background:rgba(255,255,255,.05);

  color:white;

  border:1px solid var(--line);
}

/* ================= FILTER ================= */

.filter-summary{
  margin-top:15px;

  padding:11px 12px;

  border-radius:14px;

  background:rgba(139,92,246,.08);

  border:1px solid rgba(139,92,246,.16);

  color:#cbb9ff;

  font-size:11px;
}

.field{
  margin-top:17px;
}

.field-label{
  color:var(--muted);

  font-size:12px;
}

/* range */

.range-row{
  display:flex;

  justify-content:space-between;

  margin-top:9px;

  color:#ddd8e8;

  font-size:13px;
  font-weight:800;
}

input[type="range"]{
  width:100%;

  margin-top:8px;

  accent-color:var(--purple);
}

select,
textarea{
  width:100%;

  margin-top:7px;

  padding:13px;

  color:white;

  background:#191526;

  border:1px solid var(--line);

  border-radius:14px;

  outline:none;
}

textarea{
  height:110px;

  resize:none;
}

.interest-filter{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:9px;
}

.interest-option{
  padding:8px 10px;

  border-radius:10px;

  color:#aaa4b5;

  background:rgba(255,255,255,.04);

  border:1px solid var(--line);

  font-size:10px;
  font-weight:700;

  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease;
}

.interest-option.active{
  color:#fff;

  background:rgba(139,92,246,.2);

  border-color:rgba(139,92,246,.45);
}

.filter-buttons{
  display:flex;

  gap:8px;

  margin-top:18px;
}

.primary{
  flex:1;

  padding:14px;

  border-radius:15px;

  color:white;

  font-weight:800;

  background:
    linear-gradient(
      100deg,
      var(--purple),
      var(--pink)
    );
}

.secondary{
  padding:14px 16px;

  border-radius:15px;

  color:#ddd8e8;

  background:rgba(255,255,255,.05);

  border:1px solid var(--line);

  font-weight:800;
}

/* ================= COMMENT ================= */

.counter{
  margin-top:5px;

  color:#716b7d;

  text-align:right;

  font-size:10px;
}

/* ================= REPORT ================= */

.report-option{
  width:100%;

  margin-top:8px;

  padding:14px;

  text-align:left;

  border-radius:14px;

  color:white;

  background:rgba(255,255,255,.035);

  border:1px solid var(--line);
}

/* ================= TOAST ================= */

.toast{
  position:fixed;

  z-index:300;

  left:50%;
  bottom:24px;

  transform:translateX(-50%);

  padding:11px 16px;

  border-radius:999px;

  background:#f4f3f7;

  color:#15131b;

  font-size:12px;
  font-weight:800;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .2s ease;
}

.toast.show{
  opacity:1;
}

/* ================= MOBILE ================= */

@media(max-height:700px){

  .header{
    height:52px;
  }

  .profile-info{
    bottom:100px;
  }

  .card-bottom{
    height:185px;
  }

  .card-actions{
    bottom:14px;
  }

}

@media(max-width:390px){

  .detail-grid{
    grid-template-columns:1fr 1fr;
  }

  .name{
    font-size:28px;
  }

  .bio{
    font-size:13px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">
    SEY<span>F</span>ERT
  </div>

</header>


<main class="main">

  <div class="card-area" id="cardArea"></div>

</main>

</div>


<!-- ================= FILTER ================= -->

<div class="overlay" id="filterOverlay">

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Фильтры
      </div>

      <button
        class="close"
        data-close="filterOverlay">
        ✕
      </button>

    </div>


    <div class="filter-summary" id="filterSummary">
      Фильтры не применены
    </div>


    <div class="field">

      <div class="field-label">
        Возраст
      </div>

      <div class="range-row">
        <span id="ageMinText">18</span>
        <span>—</span>
        <span id="ageMaxText">60</span>
      </div>

      <input
        type="range"
        id="ageMin"
        min="18"
        max="60"
        value="18">

      <input
        type="range"
        id="ageMax"
        min="18"
        max="60"
        value="60">

    </div>


    <div class="field">

      <div class="field-label">
        Пол
      </div>

      <select id="gender">

        <option value="all">
          Все
        </option>

        <option value="female">
          Девушки
        </option>

        <option value="male">
          Парни
        </option>

      </select>

    </div>


    <div class="field">

      <div class="field-label">
        Город
      </div>

      <select id="city">

        <option value="all">
          Любой город
        </option>

        <option value="Москва">
          Москва
        </option>

        <option value="Санкт-Петербург">
          Санкт-Петербург
        </option>

        <option value="Казань">
          Казань
        </option>

        <option value="Екатеринбург">
          Екатеринбург
        </option>

      </select>

    </div>


    <div class="field">

      <div class="field-label">
        Интересы
      </div>

      <div
        class="interest-filter"
        id="interestFilter">
      </div>

    </div>


    <div class="filter-buttons">

      <button
        class="secondary"
        id="resetFilters">
        Сбросить
      </button>

      <button
        class="primary"
        id="applyFilters">
        Применить
      </button>

    </div>

  </div>

</div>


<!-- ================= COMMENT ================= -->

<div class="overlay" id="commentOverlay">

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Лайк с комментарием
      </div>

      <button
        class="close"
        data-close="commentOverlay">
        ✕
      </button>

    </div>


    <div class="field">

      <div class="field-label">
        Сообщение
      </div>

      <textarea
        id="commentInput"
        maxlength="180"
        placeholder="Например: «Тоже люблю такую музыку»"></textarea>

      <div
        class="counter"
        id="counter">
        0 / 180
      </div>

    </div>


    <button
      class="primary"
      id="sendComment">
      Отправить лайк ❤️
    </button>

  </div>

</div>


<!-- ================= REPORT ================= -->

<div class="overlay" id="reportOverlay">

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        Пожаловаться
      </div>

      <button
        class="close"
        data-close="reportOverlay">
        ✕
      </button>

    </div>


    <button
      class="report-option"
      data-report="Спам">
      🚫 Спам
    </button>

    <button
      class="report-option"
      data-report="Оскорбление">
      ⚠️ Оскорбление
    </button>

    <button
      class="report-option"
      data-report="Неприемлемый контент">

function detail(icon,label,value){

  return `

    <div class="detail-item">

      <div class="detail-icon">
        ${icon}

        ${label}

/* =========================================================
   PHOTO
========================================================= */

function updatePhoto(){

  if(!current)
    return;


  const bg=
    document.getElementById("photoBg");

  if(!bg)
    return;


  const hue=
    current.id*53+
    photoIndex*43;


  bg.style.background=`

    radial-gradient(
      circle at ${25+photoIndex*12}% 20%,
      hsla(${hue},75%,65%,.5),
      transparent 30%
    ),

    radial-gradient(
      circle at ${80-photoIndex*9}% 20%,
      rgba(217,70,239,.38),
      transparent 30%
    ),

    linear-gradient(
      145deg,
      hsl(${hue},35%,27%),
      #090a12
    )

  `;


  document
    .querySelectorAll("#progress span")
    .forEach(

      (x,i)=>{

        x.classList.toggle(
          "active",
          i===photoIndex
        );

      }

    );

}


function nextPhoto(){

  if(
    !current ||
    photoIndex>=current.photos.length-1
  )
    return;


  photoIndex++;

  updatePhoto();

}


function previousPhoto(){

  if(
    !current ||
    photoIndex<=0
  )
    return;


  photoIndex--;

  updatePhoto();

}


/* =========================================================
   CARD EVENTS
========================================================= */

function bind(card){

  const left=
    document.getElementById("leftPhoto");

  const right=
    document.getElementById("rightPhoto");

  const report=
    document.getElementById("report");

  const filter=
    document.getElementById("cardFilter");

  const collapse=
    document.getElementById("collapse");

  const like=
    document.getElementById("like");

  const dislike=
    document.getElementById("dislike");

  const comment=
    document.getElementById("comment");


  /* photo */

  left.onclick=e=>{

    e.stopPropagation();

    if(!pointer)
      previousPhoto();

  };


  right.onclick=e=>{

    e.stopPropagation();

    if(!pointer)
      nextPhoto();

  };


  /* filter */

  filter.onclick=e=>{

    e.stopPropagation();

    open("filterOverlay");

  };


  /* report */

  report.onclick=e=>{

    e.stopPropagation();

    open("reportOverlay");

  };


  /* collapse */

  collapse.onclick=e=>{

    e.stopPropagation();

    collapseCard();

  };


  /* reactions */

  like.onclick=e=>{

    e.stopPropagation();

    likeProfile();

  };


  dislike.onclick=e=>{

    e.stopPropagation();

    dislikeProfile();

  };


  comment.onclick=e=>{

    e.stopPropagation();

    openComment();

  };


  /* center click */

  card.addEventListener(
    "click",
    e=>{

      if(
        Math.abs(dx)>15 ||
        Math.abs(dy)>15
      )
        return;


      if(
        e.target.closest(".photo-zone") ||
        e.target.closest(".report") ||
        e.target.closest(".card-filter") ||
        e.target.closest(".collapse") ||
        e.target.closest(".card-actions")
      )
        return;


      if(
        e.target.closest(".details")
      )
        return;


      toggleCard();

    }
  );


  /* pointer */

  card.addEventListener(
    "pointerdown",
    e=>{

      if(
        locked ||
        expanded
      )
        return;


      pointer=true;

      startX=e.clientX;
      startY=e.clientY;

      dx=0;
      dy=0;

      card.style.transition="none";

      card.setPointerCapture(
        e.pointerId
      );

    }
  );


  card.addEventListener(
    "pointermove",
    e=>{

      if(
        !pointer ||
        locked ||
        expanded
      )
        return;


      dx=e.clientX-startX;

      dy=e.clientY-startY;


      const rotation=
        dx/18;


      card.style.transform=
        `translateX(${dx}px) rotate(${rotation}deg)`;


      const likeLabel=
        document.getElementById(
          "likeLabel"
        );

      const nopeLabel=
        document.getElementById(
          "nopeLabel"
        );


      likeLabel.style.opacity=
        dx>20
        ?Math.min(dx/100,1)
        :0;


      nopeLabel.style.opacity=
        dx<-20
        ?Math.min(Math.abs(dx)/100,1)
        :0;

    }
  );


  card.addEventListener(
    "pointerup",
    ()=>finishSwipe(card)
  );


  card.addEventListener(
    "pointercancel",
    ()=>finishSwipe(card)
  );

}


/* =========================================================
   EXPAND
========================================================= */

function toggleCard(){

  const card=
    document.getElementById("card");

  if(!card)
    return;


  expanded=true;

  card.classList.add("expanded");

}


function collapseCard(){

  const card=
    document.getElementById("card");

  if(!card)
    return;


  expanded=false;

  card.classList.remove("expanded");

}


/* =========================================================
   SWIPE
========================================================= */

function finishSwipe(card){

  if(!pointer)
    return;


  pointer=false;


  card.style.transition=
    "transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s ease";


  if(Math.abs(dx)>100){

    if(dx>0)
      likeProfile();

    else
      dislikeProfile();

    return;

  }


  card.style.transform=
    "translateX(0) rotate(0)";


  dx=0;
  dy=0;

}


/* =========================================================
   LIKE / DISLIKE
========================================================= */

function likeProfile(){

  if(
    locked ||
    !current
  )
    return;


  locked=true;


  const card=
    document.getElementById("card");


  card.style.transform=
    "translateX(700px) rotate(18deg)";

  card.style.opacity="0";


  toast(
    `Лайк отправлен: ${current.name} ❤️`
  );


  setTimeout(
    nextProfile,
    320
  );

}


function dislikeProfile(){

  if(
    locked ||
    !current

    return;


  locked=true;


  const card=
    document.getElementById("card");


  card.style.transform=
    "translateX(-700px) rotate(-18deg)";

  card.style.opacity="0";


  toast(
    "Анкета пропущена"

  setTimeout(
    nextProfile,
    320

}

document.getElementById(

).oninput=e=>{

  let value=
    Number(e.target.value);


  if(
    value <
    Number(
      document.getElementById(
        "ageMin"
      ).value
    )
  ){

    value=
      Number(
        document.getElementById(
          "ageMin"
        ).value
      );

    e.target.value=value;

  }


  document.getElementById(
    "ageMaxText"
  ).textContent=value;

};


document.getElementById(
  "applyFilters"
).onclick=()=>{

  const minAge=
    Number(
      document.getElementById(
        "ageMin"
      ).value
    );


  const maxAge=
    Number(
      document.getElementById(
        "ageMax"
      ).value
    );


  const gender=
    document.getElementById(
      "gender"
    ).value;


  const city=
    document.getElementById(
      "city"
    ).value;


  filterState={

    minAge,
    maxAge,

    gender,
    city,

    interests:[
      ...filterState.interests
    ]

  };


  activeProfiles=
    profiles.filter(

      p=>{

        const ageOK=
          p.age>=minAge &&
          p.age<=maxAge;


        const genderOK=
          gender==="all" ||
          p.gender===gender;


        const cityOK=
          city==="all" ||
          p.city===city;


        const interestOK=

          filterState.interests.length===0 ||

          filterState.interests.some(

            interest=>

              p.interests.includes(interest) ||

              p.games.includes(interest)

          );


        return(
          ageOK &&
          genderOK &&
          cityOK &&
          interestOK
        );

      }

    );


  index=0;


  updateFilterSummary();


  close(
    "filterOverlay"
  );


  render();


  toast(
    `Найдено анкет: ${activeProfiles.length}`
  );

};

  document.getElementById(

  ).value="all";


  activeProfiles=[
    ...profiles

  index=0;


  renderInterestFilter();


  updateFilterSummary();


  render();


  close(
    "filterOverlay"
  );


  toast(
    "Фильтры сброшены"
  );

};


/* =========================================================
   FILTER SUMMARY
========================================================= */

function updateFilterSummary(){

  const parts=[];


  if(filterState.minAge!==18 ||
     filterState.maxAge!==60){

    parts.push(
      `${filterState.minAge}–${filterState.maxAge} лет`
    );

  }


  if(
    filterState.gender!=="all"
  ){

    parts.push(
      filterState.gender==="female"
      ?"Девушки"
      :"Парни"
    );

  }


  if(
    filterState.city!=="all"
  ){

    parts.push(
      filterState.city
    );

  }


  if(
    filterState.interests.length
  ){

    parts.push(
      `интересы: ${filterState.interests.length}`
    );

  }


  document.getElementById(
    "filterSummary"
  ).textContent=

    parts.length
    ?`Активно: ${parts.join(" · ")}`
    :"Фильтры не применены";

}

/* =========================================================
   OVERLAYS
========================================================= */

function open(id){

  document
    .getElementById(id)
    .classList.add("open");

}


function close(id){

  document
    .getElementById(id)
    .classList.remove("open");

}


document
  .querySelectorAll("[data-close]")
  .forEach(

    button=>{

      button.onclick=()=>{

        close(
          button.dataset.close
        );

      };

    }

  );


document
  .querySelectorAll(".overlay")
  .forEach(

    overlay=>{

      overlay.onclick=e=>{

        if(
          e.target===overlay
        ){

          overlay.classList.remove(
            "open"
          );

        }

      };

    }

  );


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toast(message){

  const el=
    document.getElementById(
      "toast"
    );


  el.textContent=message;


  el.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer=

    setTimeout(

      ()=>{

        el.classList.remove(
          "show"
        );

      },

      1900

    );

}


/* =========================================================
   SAFE HTML
========================================================= */

function safe(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
