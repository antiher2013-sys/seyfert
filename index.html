<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seyfert — Чаты</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0b10;
    color: white;
    min-height: 100vh;
}

button {
    font: inherit;
    color: inherit;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 85px;
}

/* =========================
   HEADER
========================= */

.header {
    padding: 22px 18px 14px;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
}

/* =========================
   CHAT TABS
========================= */

.tabs {
    display: flex;
    padding: 0 12px;
    border-bottom: 1px solid rgba(255,255,255,.1);
}

.tab {
    flex: 1;
    padding: 14px 4px;
    background: none;
    border: none;
    opacity: .5;
    cursor: pointer;
    position: relative;
}

.tab.active {
    opacity: 1;
}

.tab.active::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 15%;
    right: 15%;
    height: 2px;
    background: white;
    border-radius: 5px;
}

/* =========================
   CONTENT
========================= */

.content {
    padding: 18px;
}

/* =========================
   MATCHES
========================= */

.section-title {
    font-size: 14px;
    opacity: .65;
    margin-bottom: 12px;
}

.matches {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding-bottom: 8px;
}

.matches::-webkit-scrollbar {
    display: none;
}

.match {
    flex: 0 0 auto;
    width: 68px;
    text-align: center;
    cursor: pointer;
}

.match-photo {
    width: 62px;
    height: 62px;
    margin: auto;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,.75);
}

.match-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.match-name {
    margin-top: 6px;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   CHAT LIST
========================= */

.chat-list {
    margin-top: 24px;
}

.chat {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 5px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    cursor: pointer;
}

.chat-photo {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
}

.chat-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.chat-info {
    flex: 1;
    min-width: 0;
}

.chat-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.chat-name {
    font-weight: 700;
}

.chat-time {
    font-size: 11px;
    opacity: .45;
}

.chat-message {
    margin-top: 5px;
    font-size: 13px;
    opacity: .55;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.unread {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
}

/* =========================
   OTHER TABS
========================= */

.placeholder {
    text-align: center;
    padding: 80px 20px;
    opacity: .6;
}

.placeholder h2 {
    margin-bottom: 10px;
}

/* =========================
   NAVIGATION
========================= */

.navigation {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 100%;
    max-width: 520px;

    display: flex;
    justify-content: space-around;

    padding: 12px 5px calc(12px + env(safe-area-inset-bottom));

    background: rgba(10,10,15,.92);
    backdrop-filter: blur(18px);

    border-top: 1px solid rgba(255,255,255,.08);
}

.nav-item {
    border: none;
    background: none;
    opacity: .5;
    font-size: 11px;
    cursor: pointer;
}

.nav-item.active {
    opacity: 1;
}

.nav-icon {
    display: block;
    font-size: 21px;
    margin-bottom: 3px;
}

/* =========================
   DIALOG
========================= */

.chat-screen {
    display: none;
    min-height: 100vh;
    flex-direction: column;
}

.chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,.1);
}

.back {
    border: none;
    background: none;
    font-size: 25px;
    cursor: pointer;
}

.chat-header-photo {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    overflow: hidden;
}

.chat-header-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.chat-header-name {
    font-weight: 700;
}

.messages {
    flex: 1;
    padding: 20px 18px 100px;
}

.message {
    max-width: 78%;
    padding: 10px 14px;
    margin-bottom: 10px;
    border-radius: 18px;
    background: #24242c;
}

.message.mine {
    margin-left: auto;
    background: #ffffff;
    color: black;
}

.message-time {
    font-size: 9px;
    opacity: .45;
    margin-top: 4px;
}

.message-input {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 100%;
    max-width: 520px;

    display: flex;
    gap: 8px;

    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));

    background: rgba(10,10,15,.95);
    backdrop-filter: blur(18px);
}

.message-input input {
    flex: 1;
    min-width: 0;

    border: none;
    outline: none;

    padding: 12px 15px;
    border-radius: 20px;

    background: #202027;
    color: white;
}

.send {
    width: 44px;
    height: 44px;

    border-radius: 50%;
    border: none;

    background: white;
    color: black;

    cursor: pointer;
}
</style>
</head>

<body>

<!-- =========================
     ОСНОВНОЙ ЭКРАН
========================= -->

<div class="app" id="mainScreen">

    <header class="header">
        <div class="logo">SEYFERT</div>
    </header>

    <div class="tabs">

        <button class="tab active" onclick="switchTab('chats', this)">
            Чаты
        </button>

        <button class="tab" onclick="switchTab('likes', this)">
            Мои лайки
        </button>

        <button class="tab" onclick="switchTab('likedMe', this)">
            Кому я нравлюсь
        </button>

    </div>

    <main class="content" id="content"></main>

</div>


<!-- =========================
     ЭКРАН ДИАЛОГА
========================= -->

<div class="chat-screen" id="chatScreen">

    <header class="chat-header">

        <button class="back" onclick="closeChat()">
            ←
        </button>

        <div class="chat-header-photo">
            <img id="dialogPhoto" src="">
        </div>

        <div class="chat-header-name" id="dialogName">
        </div>

    </header>

    <div class="messages" id="messages"></div>

    <form class="message-input" onsubmit="sendMessage(event)">

        <input
            id="messageInput"
            type="text"
            placeholder="Написать сообщение..."
            autocomplete="off"
        >

        <button class="send">
            ➤
        </button>

    </form>

</div>


<!-- =========================
     НИЖНЯЯ НАВИГАЦИЯ
========================= -->

<nav class="navigation">

    <button class="nav-item">
        <span class="nav-icon">⌂</span>
        Анкеты
    </button>

    <button class="nav-item active">
        <span class="nav-icon">♡</span>
        Чаты
    </button>

    <button class="nav-item">
        <span class="nav-icon">◌</span>
        Интересы
    </button>

    <button class="nav-item">
        <span class="nav-icon">◉</span>
        Моя анкета
    </button>

</nav>


<script>

/* =========================
   ТЕСТОВЫЕ ДАННЫЕ
========================= */

const matches = [

    {
        name: "Алина",
        photo:
        "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=500&q=85"
    },

    {
        name: "София",
        photo:
        "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=85"
    },

    {
        name: "Маша",
        photo:
        "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=500&q=85"
    },

    {
        name: "Ева",
        photo:
        "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&fit=crop&w=500&q=85"
    }

];


const chats = [

    {
        name: "Алина",
        photo:
        "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=500&q=85",

        message:
        "Я тоже люблю электронную музыку",

        time: "19:42",

        unread: 2
    },

    {
        name: "София",
        photo:
        "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=85",

        message:
        "Давай как-нибудь обсудим это",

        time: "18:17",

        unread: 0
    },

    {
        name: "Маша",
        photo:
        "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=500&q=85",

        message:
        "Привет :)",

        time: "вчера",

        unread: 1
    }

];


const likes = [

    {
        name: "Лера",
        photo:
        "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=85"
    },

    {
        name: "Катя",
        photo:
        "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=500&q=85"
    }

];


const likedMe = [

    {
        name: "Ирина",
        photo:
        "https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?auto=format&fit=crop&w=500&q=85"
    },

    {
        name: "Настя",
        photo:
        "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&fit=crop&w=500&q=85"
    }

];


/* =========================
   РЕНДЕР ЧАТОВ
========================= */

function renderChats() {

    let html = `

        <div class="section-title">
            Метчи
        </div>

        <div class="matches">
    `;

    matches.forEach(person => {

        html += `

            <div
                class="match"
                onclick="openChat('${person.name}', '${person.photo}')"
            >

                <div class="match-photo">

                    <img
                        src="${person.photo}"
                        alt="${person.name}"
                    >

                </div>

                <div class="match-name">
                    ${person.name}
                </div>

            </div>

        `;

    });

    html += `
        </div>

        <div class="chat-list">

            <div class="section-title">
                Сообщения
            </div>
    `;

    chats.forEach(person => {

        html += `

            <div
                class="chat"
                onclick="openChat('${person.name}', '${person.photo}')"
            >

                <div class="chat-photo">

                    <img
                        src="${person.photo}"
                        alt="${person.name}"
                    >

                </div>

                <div class="chat-info">

                    <div class="chat-top">

                        <div class="chat-name">
                            ${person.name}
                        </div>

                        <div class="chat-time">
                            ${person.time}
                        </div>

                    </div>

                    <div class="chat-message">
                        ${person.message}
                    </div>

                </div>

                ${
                    person.unread
                    ?
                    `<div class="unread">${person.unread}</div>`
                    :
                    ""
                }

            </div>

        `;

    });

    html += `
        </div>
    `;

    document.getElementById("content").innerHTML = html;
}


/* =========================
   МОИ ЛАЙКИ
========================= */

function renderLikes() {

    let html = `
        <div class="section-title">
            Мои лайки
        </div>
    `;

    likes.forEach(person => {

        html += `

            <div
                class="chat"
                onclick="openChat('${person.name}', '${person.photo}')"
            >

                <div class="chat-photo">

                    <img
                        src="${person.photo}"
                        alt="${person.name}"
                    >

                </div>

                <div class="chat-info">

                    <div class="chat-name">
                        ${person.name}
                    </div>

                    <div class="chat-message">
                        ❤️ Лайк отправлен
                    </div>

                </div>

            </div>

        `;

    });

    document.getElementById("content").innerHTML = html;
}


/* =========================
   КОМУ Я НРАВЛЮСЬ
========================= */

function renderLikedMe() {

    let html = `
        <div class="section-title">
            Кому я нравлюсь
        </div>
    `;

    likedMe.forEach(person => {

        html += `

            <div class="chat">

                <div class="chat-photo">

                    <img
                        src="${person.photo}"
                        alt="${person.name}"
                    >

                </div>

                <div class="chat-info">

                    <div class="chat-name">
                        ${person.name}
                    </div>

                    <div class="chat-message">
                        ❤️ Поставили вам лайк
                    </div>

                </div>

                <button
                    class="send"
                    onclick="createMatch(event, '${person.name}')"
                >
                    ♥
                </button>

            </div>

        `;

    });

    document.getElementById("content").innerHTML = html;
}


/* =========================
   ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
========================= */

function switchTab(tab, button) {

    document
        .querySelectorAll(".tab")
        .forEach(item => item.classList.remove("active"));

    button.classList.add("active");

    if (tab === "chats") {
        renderChats();
    }

    if (tab === "likes") {
        renderLikes();
    }

    if (tab === "likedMe") {
        renderLikedMe();
    }

}


/* =========================
   ОТКРЫТИЕ ДИАЛОГА
========================= */

function openChat(name, photo) {

    document.getElementById("mainScreen").style.display = "none";

    document.querySelector(".navigation").style.display = "none";

    document.getElementById("chatScreen").style.display = "flex";

    document.getElementById("dialogName").textContent = name;

    document.getElementById("dialogPhoto").src = photo;


    document.getElementById("messages").innerHTML = `

        <div class="message">
            Привет! 👋
            <div class="message-time">
                19:30
            </div>
        </div>

        <div class="message mine">
            Привет :)
            <div class="message-time">
                19:31
            </div>
        </div>

        <div class="message">
            Рад познакомиться!
            <div class="message-time">
                19:32
            </div>
        </div>

    `;

}


/* =========================
   ЗАКРЫТИЕ ДИАЛОГА
========================= */

function closeChat() {

    document.getElementById("chatScreen").style.display = "none";

    document.getElementById("mainScreen").style.display = "block";

    document.querySelector(".navigation").style.display = "flex";

}


/* =========================
   ОТПРАВКА СООБЩЕНИЯ
========================= */

function sendMessage(event) {

    event.preventDefault();

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) return;

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className = "message mine";

    message.innerHTML = `
        ${text}
        <div class="message-time">
            сейчас
        </div>
    `;

    messages.appendChild(message);

    input.value = "";

    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================
   СОЗДАНИЕ МЕТЧА
========================= */

function createMatch(event, name) {

    event.stopPropagation();

    alert(
        "МЕТЧ с " + name + " создан!"
    );

}


/* =========================
   ПЕРВЫЙ ЗАПУСК
========================= */

renderChats();

</script>

</body>
</html>
