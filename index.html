<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">

  <title>Seyfert</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08090d;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 32px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(135deg, #7c5cff, #36cfff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 28px;
      box-shadow: 0 15px 50px rgba(90, 100, 255, 0.3);
    }

    h1 {
      font-size: 42px;
      margin: 0 0 10px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #a8abb8;
      font-size: 17px;
      line-height: 1.5;
      margin: 0 0 38px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 18px;
      font-size: 17px;
      font-weight: 700;
      color: white;
      background: #171922;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(135deg, #7c5cff, #4f8cff);
      box-shadow: 0 12px 35px rgba(85, 90, 255, 0.25);
    }

    button:active {
      transform: scale(0.98);
    }

    .version {
      text-align: center;
      color: #555865;
      font-size: 12px;
      margin-top: 35px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">S</div>

    <h1>Seyfert</h1>

    <p class="subtitle">
      Знакомства, общение и поиск тиммейтов в одном месте.
    </p>

    <div class="buttons">
      <button class="primary">
        🚀 Начать
      </button>

      <button>
        🎮 Я ищу тиммейта
      </button>
    </div>

    <div class="version">
      Seyfert • 0.1
    </div>

  </main>

</body>
</html>
