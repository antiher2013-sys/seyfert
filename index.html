<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Seyfert</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080711;
  --card:#151320;
  --text:#f7f5fb;
  --muted:#9e98ae;
  --purple:#8b5cf6;
  --pink:#d946ef;
  --green:#69e6a7;
  --red:#ff6683;
  --line:rgba(255,255,255,.1);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(139,92,246,.22),
      transparent 42%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* =========================================================
   BRAND
========================================================= */

.brand{
  position:absolute;
  z-index:90;

  top:18px;
  left:50%;

  transform:translateX(-50%);

  font-size:18px;
  font-weight:900;
  letter-spacing:1.5px;

  color:#f8f7ff;

  pointer-events:none;

  text-shadow:
    0 0 5px rgba(255,255,255,.35),
    0 0 12px rgba(139,92,246,.45),
    0 0 24px rgba(139,92,246,.25);
}

.brand span{
  color:#9b6cff;

  text-shadow:
    0 0 5px rgba(139,92,246,.9),
    0 0 12px rgba(139,92,246,.8),
    0 0 25px rgba(139,92,246,.55);
}

/* =========================================================
   HEADER
========================================================= */

.header{
  height:58px;
  flex-shrink:0;

  display:flex;
  align-items:flex-start;
  justify-content:flex-end;

  padding:14px 15px 0;
}

.header-btn{
  width:32px;
  height:32px;

  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;

  background:transparent;
  border:0;
}

.bell-icon{
  width:18px;
  height:18px;
  display:block;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;

  padding:0 10px;
}

.view{
  width:100%;
  height:100%;
  min-height:0;
}

.view.hidden{
  display:none;
}
.chat-page{
  width:100%;
  height:100%;
  min-height:0;
}
.chat-page.hidden{
  display:none !important;
}
.profile-area{
  width:100%;
  height:100%;

  position:relative;
}
.profile-card{
  width:100%;
  height:100%;

  position:relative;

  overflow:hidden;

  border-radius:30px;

  background:var(--card);

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    0 0 55px rgba(139,92,246,.1);
}
/* =========================================================
   PROFILE CONTENT
========================================================= */

.profile-scroll{
  width:100%;
  height:100%;

  overflow-y:auto;
  overflow-x:hidden;

  padding:24px 18px 30px;

  box-sizing:border-box;

  scrollbar-width:none;

  touch-action:pan-y;
}

.profile-scroll::-webkit-scrollbar{
  display:none;
}

.profile-avatar-large{
  width:180px;
  height:180px;

  margin:0 auto;

  overflow:hidden;

  border-radius:50%;

  background:#171421;

  border:
    2px solid
    rgba(139,92,246,.65);

  box-shadow:
    0 0 25px
    rgba(139,92,246,.15);
}

.profile-avatar-large img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}
.profile-divider{
  width:100%;

  height:1px;

  margin:24px 0 20px;

  background:rgba(255,255,255,.10);
}

.profile-identity{
  margin-top:18px;

  text-align:center;

  color:#eeeaf3;
}

.profile-name{
  display:inline;

  font-size:21px;
  font-weight:850;
}

.profile-age{
  display:inline;

  margin-left:6px;

  font-size:19px;
  font-weight:700;

  color:#bdb7c9;
}

.profile-gender{
  margin-top:5px;

  color:#817b8f;

  font-size:12px;
  font-weight:700;
}

.profile-city{
  margin-top:12px;

  text-align:center;

  color:#aaa3b6;

  font-size:12px;
  font-weight:700;
}

/* =========================================================
   CARD AREA
========================================================= */

.card-area{
  width:100%;
  height:calc(100% - 10px);

  position:relative;
}

/* =========================================================
   CARD
========================================================= */

.card{
  position:absolute;
  inset:0;

  overflow:hidden;

  border-radius:30px;

  background:var(--card);

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    0 0 55px rgba(139,92,246,.1);

  touch-action:none;
  user-select:none;

  transition:
    transform .32s cubic-bezier(.2,.8,.2,1),
    opacity .3s ease;
}

/* =========================================================
   PHOTO
========================================================= */

.photo{
  position:absolute;
  inset:0;
}

.photo-bg{
  position:absolute;
  inset:0;
}

.photo-bg::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.05) 0%,
      rgba(0,0,0,.05) 45%,
      rgba(8,7,17,.22) 65%,
      rgba(8,7,17,.93) 100%
    );
}

.person{
  position:absolute;

  z-index:2;

  left:50%;
  top:40%;

  width:220px;
  height:330px;

  transform:translate(-50%,-50%);
}

.head{
  position:absolute;

  top:0;
  left:50%;

  width:112px;
  height:132px;

  transform:translateX(-50%);

  border-radius:52% 52% 48% 48%;

  background:
    linear-gradient(
      145deg,
      #d1afc0,
      #725b7e
    );
}

.body{
  position:absolute;

  bottom:0;
  left:50%;

  width:220px;
  height:215px;

  transform:translateX(-50%);

  border-radius:
    120px 120px
    20px 20px;

  background:
    linear-gradient(
      145deg,
      #30233e,
      #0c0d15
    );
}

/* =========================================================
   TOP CARD BUTTONS
========================================================= */

.card-top{
  position:absolute;

  z-index:30;

  top:15px;
  left:15px;
  right:15px;

  display:flex;
  justify-content:space-between;
}
.card-top button{
  width:43px;
  height:43px;
  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  color:#fff;
  background:rgba(7,7,13,.55);
  border:1px solid rgba(255,255,255,.12);

  backdrop-filter:blur(14px);
}
.filter-icon{
  width:23px;
  height:23px;
  display:block;
}
.report-icon{
  width:21px;
  height:21px;
  transform:translateX(1px);
}

/* =========================================================
   PHOTO PROGRESS
========================================================= */

.photo-progress{
  position:absolute;

  z-index:25;

  top:9px;
  left:72px;
  right:72px;

  display:flex;
  gap:4px;
}

.photo-progress span{
  flex:1;

  height:3px;

  border-radius:10px;

  background:
    rgba(255,255,255,.28);
}

.photo-progress span.active{
  background:#fff;
}

/* =========================================================
   PHOTO ZONES
========================================================= */

.photo-zone{
  position:absolute;

  z-index:20;

  top:0;
  bottom:0;

  width:25%;
}

.photo-zone.left{
  left:0;
}

.photo-zone.right{
  right:0;
}

/* =========================================================
   PROFILE INFO
========================================================= */

.profile-info{
  position:absolute;

  z-index:31;

  left:22px;
  right:22px;

  bottom:116px;

  pointer-events:none;
}

.name-line{
  display:flex;
  align-items:baseline;
  gap:8px;
}

.name{
  font-size:30px;
  font-weight:900;
}

.age{
  font-size:19px;
  color:#d0cad9;
}

.city{
  margin-top:3px;

  color:#c2bccd;

  font-size:13px;
}

.distance-row{
  display:flex;
  align-items:center;
  gap:9px;

  margin-top:6px;
}

.distance{
  color:#bda8f3;

  font-size:12px;
  font-weight:700;
}

.status{
  display:flex;
  align-items:center;
  gap:5px;

  color:#d5d0dc;

  font-size:11px;
  font-weight:700;
}

.status-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 8px
    rgba(105,230,167,.65);
}

.status-dot.offline{
  background:#89838f;
  box-shadow:none;
}

.bio{
  margin-top:9px;

  color:#ddd9e5;

  font-size:14px;
  line-height:1.4;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;

  margin-top:9px;
}

.tag{
  padding:6px 9px;

  border-radius:999px;

  color:#cbb9ff;

  background:
    rgba(139,92,246,.13);

  border:
    1px solid
    rgba(139,92,246,.22);

  font-size:10px;
  font-weight:700;
}

/* =========================================================
   BLUR
========================================================= */

.bottom-blur{
  position:absolute;

  z-index:27;

  left:0;
  right:0;
  bottom:0;

  height:235px;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      transparent 0%,
      rgba(8,7,17,.10) 20%,
      rgba(8,7,17,.48) 45%,
      rgba(8,7,17,.92) 75%,
      rgba(8,7,17,1) 100%
    );
}

/* =========================================================
   ACTIONS
========================================================= */

.card-actions{
  position:absolute;

  z-index:40;

  left:18px;
  right:18px;
  bottom:17px;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:18px;
}

.action{
  width:56px;
  height:56px;

  border-radius:50%;

  color:#fff;

  background:
    rgba(20,17,31,.88);

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.35);

  backdrop-filter:blur(14px);
}

.action:active{
  transform:scale(.88);
}

.action.dislike{
  color:var(--red);
}

.action.comment{
  width:64px;
  height:64px;

  background:
    linear-gradient(
      145deg,
      var(--purple),
      var(--pink)
    );

  box-shadow:
    0 12px 35px
    rgba(139,92,246,.42);
}

.action.like{
  color:#ff6f95;
}

/* =========================================================
   SWIPE LABELS
========================================================= */

.swipe-label{
  position:absolute;

  z-index:50;

  top:42%;

  padding:9px 14px;

  border-radius:12px;

  font-weight:900;

  opacity:0;

  pointer-events:none;
}

.like-label{
  left:22px;

  color:var(--green);

  border:2px solid var(--green);

  transform:rotate(-12deg);
}

.nope-label{
  right:22px;

  color:var(--red);

  border:2px solid var(--red);

  transform:rotate(12deg);
}

/* =========================================================
   DETAILS
========================================================= */

.details{
  position:absolute;

  z-index:80;

  inset:0;

  overflow-y:auto;

  padding:
    30px
    22px
    35px;

  background:
    linear-gradient(
      180deg,
      rgba(17,15,28,.98),
      rgba(11,10,18,.99)
    );

  opacity:0;

  transform:translateY(100%);

  pointer-events:none;

  transition:
    transform .48s
      cubic-bezier(.22,.8,.22,1),
    opacity .25s ease;
}

.card.expanded .details{
  opacity:1;

  transform:translateY(0);

  pointer-events:auto;
}

.details-close{
  position:absolute;

  top:16px;
  right:17px;

  width:40px;
  height:40px;

  border-radius:13px;

  color:#fff;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid var(--line);
}

.detail-heading{
  margin-top:45px;
  margin-bottom:12px;

  color:#8f899e;

  font-size:11px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.7px;
}

.detail-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;
}

.detail-item{
  min-height:64px;

  padding:10px 11px;

  border-radius:15px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.07);
}

.detail-icon{
  font-size:16px;
}

.detail-label{
  margin-top:4px;

  color:#817b8f;

  font-size:9px;
}

.detail-value{
  margin-top:2px;

  color:#eeeaf3;

  font-size:12px;
  font-weight:700;
}

.detail-section{
  margin-top:20px;
}

.interest-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.interest{
  padding:8px 10px;

  border-radius:10px;

  background:
    rgba(139,92,246,.12);

  color:#c8b7f7;

  border:
    1px solid
    rgba(139,92,246,.2);

  font-size:10px;
  font-weight:700;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  position:absolute;

  inset:0;

  border-radius:30px;

  background:#11101b;

  border:
    1px solid var(--line);

  display:flex;

  justify-content:center;
  align-items:center;

  text-align:center;

  padding:30px;
}

.empty-content{
  max-width:480px;
}

.empty-icon{
  font-size:48px;
}

.empty-title{
  margin-top:8px;

  font-size:24px;
  font-weight:900;
}

.empty-text{
  margin-top:9px;

  color:var(--muted);

  line-height:1.5;

  font-size:14px;
}

.empty-filter{
  margin-top:20px;

  padding:12px 18px;

  border-radius:14px;

  color:white;

  background:
    linear-gradient(
      100deg,
      var(--purple),
      var(--pink)
    );

  font-weight:800;
}

/* =========================================================
   CHATS
========================================================= */

.chat-screen{

  width:100%;

  height:100%;

  position:relative;

  border-radius:30px;

  background:

    radial-gradient(

      circle at 15% 40%,

      rgba(139,92,246,.08),

      transparent 30%

    ),

    radial-gradient(

      circle at 90% 70%,

      rgba(217,70,239,.06),

      transparent 30%

    );

  border:

    1px solid

    rgba(255,255,255,.10);

  overflow:hidden;

  display:flex;

  flex-direction:column;

}

.chat-title{

  padding:25px 22px 10px;

  font-size:25px;

  font-weight:900;

}

.chat-subtitle{

  padding:0 22px;

  color:#8f899e;

  font-size:13px;

}

.chat-empty{

  flex:1;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:25px;

}

.chat-empty-content{

  max-width:430px;

}

.chat-icon{

  font-size:58px;

  color:#b99aff;

  filter:

    drop-shadow(

      0 0 14px

      rgba(139,92,246,.55)

    );

}

.chat-empty-title{

  margin-top:18px;

  font-size:25px;

  font-weight:900;

}

.chat-empty-text{

  margin-top:9px;

  color:#9e98ae;

  font-size:14px;

  line-height:1.5;

}
/* =========================================================
   CHAT VISUAL
========================================================= */

.chat-screen{
  width:100%;
  height:100%;

  padding:26px 12px 12px;

  border-radius:30px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(139,92,246,.07),
      transparent 38%
    ),
    #0d0b17;

  border:1px solid rgba(255,255,255,.10);

  overflow:hidden;

  display:flex;
  flex-direction:column;
}

/* TABS */

.chat-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:4px;

  padding:4px;

  border-radius:15px;

  background:rgba(255,255,255,.035);

  border:1px solid rgba(255,255,255,.07);

  flex-shrink:0;
}

.chat-tab{
  min-height:38px;

  padding:0 5px;

  border-radius:11px;

  color:#817b8f;

  background:transparent;

  font-size:10px;
  font-weight:800;

  transition:
    background .2s ease,
    color .2s ease;
}

.chat-tab.active{
  color:#eee9f8;

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.28),
      rgba(217,70,239,.16)
    );

  box-shadow:
    inset 0 0 0 1px
    rgba(139,92,246,.18);
}

/* MATCHES */

.matches-section{
  flex-shrink:0;

  margin-top:17px;

  overflow:hidden;
}

.matches-list{
  display:flex;

  flex-direction:row;
  flex-wrap:nowrap;

  gap:15px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:
    2px
    3px
    10px;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.matches-list::-webkit-scrollbar{
  display:none;
}

.match-item{
  flex:0 0 54px;

  width:54px;
  min-width:54px;

  padding:0;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:6px;

  color:#bcb5c8;

  background:transparent;
}

.match-avatar{
  width:52px;
  height:52px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#eeeaf7;

  font-size:17px;
  font-weight:900;

  background:
    linear-gradient(
      145deg,
      #352653,
      #171421
    );

  border:
    2px solid
    rgba(139,92,246,.75);

  box-shadow:
    0 0 16px
    rgba(139,92,246,.13);
}

.match-name{
  max-width:54px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  font-size:9px;
  font-weight:700;
}

.chat-matches-divider{
  width:100%;
  height:1px;

  margin-top:4px;

  background:rgba(255,255,255,.055);

  flex-shrink:0;
}

/* DIALOGS */

.chat-content{
  flex:1;
  min-height:0;

  margin-top:4px;

  overflow-y:auto;

  scrollbar-width:none;
}

.chat-content::-webkit-scrollbar{
  display:none;
}

.chat-section-title{
  padding:
    12px
    5px
    8px;

  color:#777181;

  font-size:10px;
  font-weight:800;

  text-transform:uppercase;

  letter-spacing:.7px;
}

.chat-dialog{
  width:100%;

  min-height:68px;

  padding:
    9px
    5px;

  display:flex;
  align-items:center;

  gap:11px;

  position:relative;

  color:#fff;

  background:transparent;

  border-bottom:
    1px solid
    rgba(255,255,255,.055);

  text-align:left;
}

.chat-dialog:active{
  background:
    rgba(255,255,255,.045);
}

.chat-dialog-main{
  min-width:0;

  flex:1;

  /* Оставляем место для правой колонки */
  padding-right:42px;
}

.chat-dialog-top{
  display:block;

  min-width:0;
}

.chat-dialog-name{
  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  color:#eeeaf3;

  font-size:13px;
  font-weight:850;
}

.chat-dialog-time{
  position:absolute;

  top:12px;
  right:9px;

  color:#716b7d;

  font-size:9px;
  line-height:1;

  white-space:nowrap;
}

.chat-dialog-message{
  margin-top:4px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  color:#858090;

  font-size:11px;
}

.chat-unread{
  width:19px;
  height:19px;

  position:absolute;

  top:31px;
  right:5px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--pink)
    );

  font-size:9px;
  font-weight:900;
}
.chat-avatar{
  width:48px;
  height:48px;

  flex-shrink:0;
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
  overflow:visible;

  color:#eeeaf7;

  background:
    linear-gradient(
      145deg,
      #302544,
      #171421
    );

  border:1px solid rgba(255,255,255,.09);

  font-size:16px;
  font-weight:900;
}

.chat-avatar img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
  border-radius:50%;
}

function updatePhoto(){

  if(!current)
    return;


  const bg=
    document.getElementById("photoBg");

  if(!bg)
    return;


  const hue=
    current.id*53+
    photoIndex*43;


  bg.style.background=`

    radial-gradient(
      circle at ${25+photoIndex*12}% 20%,
      hsla(${hue},75%,65%,.5),
      transparent 30%
    ),

    radial-gradient(
      circle at ${80-photoIndex*9}% 20%,
      rgba(217,70,239,.38),
      transparent 30%
    ),

    linear-gradient(
      145deg,
      hsl(${hue},35%,27%),
      #090a12
    )

  `;


  document
    .querySelectorAll("#progress span")
    .forEach(
      (el,i)=>{
        el.classList.toggle(
          "active",
          i===photoIndex
        );
      }
    );

}


function nextPhoto(){

  if(
    !current ||
    photoIndex>=current.photos.length-1
  )
    return;

  photoIndex++;

  updatePhoto();
}


function previousPhoto(){

  if(
    !current ||
    photoIndex<=0
  )
    return;

  photoIndex--;

  updatePhoto();
}


/* =========================================================
   CARD BIND
========================================================= */

function bindCard(card){

  const left=
    document.getElementById("leftPhoto");

  const right=
    document.getElementById("rightPhoto");

  const report=
    document.getElementById("report");

  const filter=
    document.getElementById("cardFilter");

  const detailsClose=
    document.getElementById("detailsClose");


  left.onclick=e=>{
    e.stopPropagation();

    if(!pointer)
      previousPhoto();
  };


  right.onclick=e=>{
    e.stopPropagation();

    if(!pointer)
      nextPhoto();
  };


  report.onclick=e=>{
    e.stopPropagation();

    open("reportOverlay");
  };


  filter.onclick=e=>{
    e.stopPropagation();

    open("filterOverlay");
  };


  detailsClose.onclick=e=>{
    e.stopPropagation();

    collapseCard();
  };


  document
    .getElementById("like")
    .onclick=e=>{
      e.stopPropagation();
      likeProfile();
    };


  document
    .getElementById("dislike")
    .onclick=e=>{
      e.stopPropagation();
      dislikeProfile();
    };


  document
    .getElementById("comment")
    .onclick=e=>{
      e.stopPropagation();

      if(!current)
        return;

      open("commentOverlay");

      setTimeout(
        ()=>{
          document
            .getElementById("commentInput")
            .focus();
        },
        120
      );
    };


  card.addEventListener(
    "click",
    e=>{

      if(
        Math.abs(dx)>15 ||
        Math.abs(dy)>15
      )
        return;


      if(
        e.target.closest(".photo-zone") ||
        e.target.closest(".card-top") ||
        e.target.closest(".card-actions") ||
        e.target.closest(".details")
      )
        return;


      toggleCard();

    }
  );


  card.addEventListener(
    "pointerdown",
    e=>{

      if(locked || expanded)
        return;

      pointer=true;

      startX=e.clientX;
      startY=e.clientY;

      dx=0;
      dy=0;

      card.style.transition="none";

      card.setPointerCapture(
        e.pointerId
      );

    }
  );


  card.addEventListener(
    "pointermove",
    e=>{

      if(
        !pointer ||
        locked ||
        expanded
      )
        return;


      dx=
        e.clientX-startX;

      dy=
        e.clientY-startY;


      const rotation=
        dx/18;


      card.style.transform=
        `translateX(${dx}px) rotate(${rotation}deg)`;


      document
        .getElementById("likeLabel")
        .style.opacity=
          dx>20
            ?Math.min(dx/100,1)
            :0;


      document
        .getElementById("nopeLabel")
        .style.opacity=
          dx<-20
            ?Math.min(Math.abs(dx)/100,1)
            :0;

    }
  );


  card.addEventListener(
    "pointerup",
    ()=>finishSwipe(card)
  );


  card.addEventListener(
    "pointercancel",
    ()=>finishSwipe(card)
  );

}


/* =========================================================
   DETAILS
========================================================= */

function toggleCard(){

  const card=
    document.getElementById("card");

  if(!card)
    return;

  expanded=!expanded;

  card.classList.toggle(
    "expanded",
    expanded
  );
}


function collapseCard(){

  const card=
    document.getElementById("card");

  if(!card)
    return;

  expanded=false;

  card.classList.remove(
    "expanded"
  );
}


/* =========================================================
   SWIPE
========================================================= */

function finishSwipe(card){

  if(!pointer)
    return;

  pointer=false;

  card.style.transition=
    "transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s ease";


  if(Math.abs(dx)>100){

    if(dx>0)
      likeProfile();

    else
      dislikeProfile();

    return;
  }


  card.style.transform=
    "translateX(0) rotate(0)";

  dx=0;
  dy=0;
}

function updateAgeLabels(){

  let min=
    Number(ageMin.value);

  let max=
    Number(ageMax.value);


  if(min>max-1){

    if(
      document.activeElement===ageMin
    ){

      min=max-1;

      ageMin.value=min;

    }

    else{

      max=min+1;

      ageMax.value=max;

    }

  }


  document
    .getElementById("ageMinValue")
    .textContent=min;

  document
    .getElementById("ageMaxValue")
    .textContent=max;
}

  updateAgeLabels;

ageMax.oninput=
  updateAgeLabels;


document
  .querySelectorAll("[data-interest]")
  .forEach(
    button=>{

      button.onclick=()=>{

        const value=
          button.dataset.interest;


        if(
          selectedInterests.includes(value)
        ){

          selectedInterests=
            selectedInterests.filter(
              x=>x!==value
            );

          button.classList.remove(
            "selected"
          );

        }

        else{

          selectedInterests.push(value);

          button.classList.add(
            "selected"
          );

        }

      };

    }
  );

  .getElementById("applyFilters")
  .onclick=()=>{

    const min=
      Number(ageMin.value);

    const max=
      Number(ageMax.value);

    const gender=
      document.getElementById("gender").value;

    const city=
      document.getElementById("city").value;


    activeProfiles=
      profiles.filter(
        p=>{

          const ageOK=
            p.age>=min &&
            p.age<=max;


          const genderOK=
            gender==="all" ||
            p.gender===gender;


          const cityOK=
            city==="all" ||
            p.city===city;


          const interestOK=
            selectedInterests.length===0 ||
            selectedInterests.some(
              x=>p.interests.includes(x)
            );


          return(
            ageOK &&
            genderOK &&
            cityOK &&
            interestOK
          );

        }
      );


    index=0;

    close("filterOverlay");

    render();


    toast(

/* =========================================================
   STORAGE
========================================================= */

function getNotifications(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "seyfert_notifications"
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveNotifications(notifications){

  localStorage.setItem(
    "seyfert_notifications",
    JSON.stringify(notifications)
  );

}


/* =========================================================
   REMOVE EXPIRED
========================================================= */

function removeExpiredNotifications(){

  const now =
    Date.now();

  const notifications =
    getNotifications();

  const active =
    notifications.filter(
      notification =>
        now - notification.createdAt
        < NOTIFICATION_LIFETIME
    );

  saveNotifications(active);

  return active;

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatNotificationTime(timestamp){

  const diff =
    Date.now() - timestamp;


  const minute =
    60 * 1000;

  const hour =
    60 * minute;

  const day =
    24 * hour;


  if(diff < minute)
    return "Только что";


  if(diff < hour){

    const value =
      Math.floor(diff / minute);

    return `${value} мин. назад`;

  }


  if(diff < day){

    const value =
      Math.floor(diff / hour);

    return `${value} ч. назад`;

  }


  const value =
    Math.floor(diff / day);


  if(value === 1)
    return "Вчера";


  return `${value} дн. назад`;

}


/* =========================================================
   RENDER NOTIFICATIONS
========================================================= */

function renderNotifications(){

  const notifications =
    removeExpiredNotifications();


  notificationsList.innerHTML="";


  if(notifications.length===0){

    notificationsList.innerHTML=`

      <div
        style="
          padding:45px 20px;
          text-align:center;
          color:#777181;
          font-size:13px;
        ">

        Уведомлений пока нет

      </div>

    `;

    return;

  }


  notifications.forEach(
    notification=>{

      const type =
        notificationTypes[
          notification.type
        ];

      if(!type)
        return;


      const item =
        document.createElement("div");


      item.className=
        `notification-item ${type.className}`;


      item.innerHTML=`

        <div class="notification-icon">
          ${type.icon}
        </div>

        <div class="notification-content">

          <div class="notification-text">
            ${type.text}
          </div>

          <div class="notification-time">
            ${formatNotificationTime(
              notification.createdAt
            )}
          </div>

        </div>

      `;


      notificationsList.appendChild(item);

    }
  );

}


/* =========================================================
   CREATE NOTIFICATION
========================================================= */

function addNotification(type){

  if(!notificationTypes[type])
    return;


  const notifications =
    removeExpiredNotifications();


  notifications.unshift({

    id:
      Date.now() +
      Math.random(),

    type:type,

    createdAt:
      Date.now()

  });


  saveNotifications(
    notifications
  );


  renderNotifications();

}

  renderNotifications();

  notificationsOverlay.classList.add("open");

};


/* =========================================================
   CLOSE
========================================================= */

notificationsClose.onclick=()=>{

  notificationsOverlay.classList.remove("open");

};

/* =========================================================
   OVERLAYS
========================================================= */

function open(id){

  document
    .getElementById(id)
    .classList.add("open");

}


function close(id){

  document
    .getElementById(id)
    .classList.remove("open");

}


document
  .querySelectorAll("[data-close]")
  .forEach(
    button=>{

      button.onclick=()=>{

        close(
          button.dataset.close
        );

      };

    }
  );


document
  .querySelectorAll(".overlay")
  .forEach(
    overlay=>{

      overlay.onclick=e=>{

        if(e.target===overlay)
          overlay.classList.remove("open");

      };

    }
  );


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function toast(message){

  const el=
    document.getElementById("toast");


  el.textContent=message;

  el.classList.add("show");


  clearTimeout(toastTimer);


  toastTimer=
    setTimeout(
      ()=>{
        el.classList.remove("show");
      },
      1900
    );

}


/* =========================================================
   SAFE
========================================================= */

function safe(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   START
========================================================= */

updateAgeLabels();

render();
